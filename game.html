<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FERIES Test</title>
    <style>
        body {
            background: #0a0f1e;
            color: gold;
            text-align: center;
            padding: 50px;
            font-family: sans-serif;
        }
        button {
            background: #D4AF37;
            border: none;
            padding: 20px 30px;
            font-size: 24px;
            margin: 20px;
            border-radius: 60px;
            font-weight: bold;
        }
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .menu-item {
            background: #1E2438;
            padding: 15px 25px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔥 FERIES CASINO 🔥</h1>
    <button id="spinBtn">SPIN</button>
    <div class="menu">
        <div class="menu-item" id="profileBtn">Профиль</div>
        <div class="menu-item" id="ratingBtn">Рейтинг</div>
        <div class="menu-item" id="walletBtn">Кошелёк</div>
    </div>
    <p id="log" style="margin-top: 40px; color: #aaa;">Нажмите на кнопку</p>

    <script>
        // Простейшие обработчики
        document.getElementById('spinBtn').onclick = function() {
            document.getElementById('log').innerHTML = '✅ SPIN нажата! Баланс: 1000';
        };
        document.getElementById('profileBtn').onclick = function() {
            document.getElementById('log').innerHTML = '👤 Профиль: Игрок FERIES';
        };
        document.getElementById('ratingBtn').onclick = function() {
            document.getElementById('log').innerHTML = '🏆 Рейтинг: Вы на 1 месте';
        };
        document.getElementById('walletBtn').onclick = function() {
            document.getElementById('log').innerHTML = '💰 Кошелёк: 1000 монет';
        };
    </script>
</body>
</html>
