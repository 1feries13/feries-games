<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FERIES Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 12px;
        }

        .game-container {
            background: rgba(10, 14, 23, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 16px 12px 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            border: 2px solid rgba(212, 175, 55, 0.5);
            max-width: 500px;
            width: 100%;
            transition: border-color 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 12px 15px;
            flex-wrap: wrap;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #F5E7A3, #D4AF37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .balance-card {
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.5);
            text-align: center;
        }

        .balance-label {
            font-size: 0.7rem;
            color: #aaa;
        }

        .balance-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #F5E7A3;
            line-height: 1;
        }

        /* Слот-машина */
        .slot-machine {
            background: #0B0E16;
            border-radius: 32px;
            padding: 20px 12px;
            margin: 8px 0;
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .reel {
            background: #131A2A;
            border-radius: 20px;
            padding: 20px 0;
            width: 90px;
            text-align: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
        }

        .reel-symbol {
            font-size: 58px;
            filter: drop-shadow(0 2px 4px black);
        }

        .win-line {
            background: rgba(212,175,55,0.15);
            border-radius: 40px;
            margin: 12px 0;
            padding: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.1s;
        }

        .win-active {
            background: rgba(212,175,55,0.6);
            box-shadow: 0 0 15px gold;
            color: #000;
        }

        .spin-btn {
            background: linear-gradient(145deg, #D4AF37, #B48C2C);
            border: none;
            width: 85%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #0a0f1e;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 6px 0 #6B4E1A;
        }

        .spin-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #6B4E1A;
        }

        .theme-buttons {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 4px;
            margin-top: 8px;
        }

        .theme-btn {
            background: #1E2438;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .theme-active {
            background: #D4AF37;
            color: #0a0f1e;
            border-color: gold;
        }

        .bottom-menu {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid rgba(212,175,55,0.3);
        }

        .menu-item {
            text-align: center;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: 0.1s;
        }

        .menu-active {
            background: rgba(212,175,55,0.2);
            color: #D4AF37;
        }

        .info-panel {
            background: rgba(0,0,0,0.6);
            border-radius: 24px;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
            color: #ddd;
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #555;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="header">
        <div class="logo"><h1>FERIES</h1></div>
        <div class="balance-card">
            <div class="balance-label">БАЛАНС</div>
            <div class="balance-value" id="balanceDisplay">1000</div>
        </div>
    </div>

    <div class="slot-machine">
        <div class="reels">
            <div class="reel"><div class="reel-symbol" id="reel0">🍒</div></div>
            <div class="reel"><div class="reel-symbol" id="reel1">🍒</div></div>
            <div class="reel"><div class="reel-symbol" id="reel2">🍒</div></div>
        </div>
        <div class="win-line" id="winLine">
            <span id="winMessage">🎰 Нажми SPIN</span>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>

    <div class="theme-buttons" id="themeButtons"></div>

    <div class="bottom-menu">
        <div class="menu-item" data-menu="profile">👤 Профиль</div>
        <div class="menu-item" data-menu="rating">🏆 Рейтинг</div>
        <div class="menu-item" data-menu="wallet">💰 Кошелёк</div>
        <div class="menu-item" data-menu="menu">📋 Меню</div>
    </div>

    <div id="infoPanel" class="info-panel">✨ Выбери тему и крути!</div>
    <footer>v3.0 — работает без API, баланс сохраняется</footer>
</div>

<script>
    (function() {
        // ---------- ТЕМЫ ----------
        const themes = {
            crypto: { name: 'Crypto', border: '#F7931A', symbols: ['₿', 'Ξ', 'Ł', '₮', '💎', '🚀'] },
            jungle: { name: 'Jungle', border: '#2E7D32', symbols: ['🐒', '🐍', '🦜', '🌿', '🍌', '🐆'] },
            egypt: { name: 'Egypt', border: '#C9A03D', symbols: ['🐫', '👑', '𓂀', '🦂', '🌞', '🔺'] },
            space: { name: 'Space', border: '#3A4F8A', symbols: ['🪐', '🚀', '🌙', '⭐', '👽', '🌌'] },
            fruit: { name: 'Fruit', border: '#E65100', symbols: ['🍒', '🍊', '🍋', '🍉', '🍇', '🍓'] },
            horror: { name: 'Horror', border: '#5D2E2E', symbols: ['🧛', '🕷️', '🪦', '👻', '🔪', '🕯️'] }
        };
        const themeKeys = Object.keys(themes);
        let currentTheme = 'fruit';     // стартовая
        let currentBalance = 1000;
        let isSpinning = false;
        let currentSymbols = ['🍒', '🍒', '🍒'];

        // DOM элементы
        const balanceSpan = document.getElementById('balanceDisplay');
        const winLineDiv = document.getElementById('winLine');
        const winMessageSpan = document.getElementById('winMessage');
        const spinBtn = document.getElementById('spinButton');
        const infoPanel = document.getElementById('infoPanel');
        const container = document.getElementById('gameContainer');
        const reel0 = document.getElementById('reel0');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reels = [reel0, reel1, reel2];

        // ---------- РАБОТА С БАЛАНСОМ (localStorage) ----------
        function loadBalance() {
            const saved = localStorage.getItem('feries_balance');
            if (saved !== null && !isNaN(parseInt(saved))) {
                currentBalance = parseInt(saved);
            } else {
                currentBalance = 1000;
            }
            updateBalanceUI();
        }

        function saveBalance() {
            localStorage.setItem('feries_balance', currentBalance);
        }

        function updateBalanceUI() {
            if (balanceSpan) balanceSpan.innerText = currentBalance;
        }

        function addCoins(amount) {
            currentBalance += amount;
            updateBalanceUI();
            saveBalance();
        }

        function subtractCoins(amount) {
            if (currentBalance >= amount) {
                currentBalance -= amount;
                updateBalanceUI();
                saveBalance();
                return true;
            }
            return false;
        }

        // ---------- ЛОГИКА ИГРЫ ----------
        function getRandomSymbol(symbolsArray) {
            return symbolsArray[Math.floor(Math.random() * symbolsArray.length)];
        }

        function spinReels() {
            const themeData = themes[currentTheme];
            const newSymbols = [];
            for (let i = 0; i < 3; i++) {
                newSymbols.push(getRandomSymbol(themeData.symbols));
            }
            currentSymbols = newSymbols;
            // обновить DOM
            for (let i = 0; i < 3; i++) {
                if (reels[i]) reels[i].innerText = currentSymbols[i];
            }
            return currentSymbols;
        }

        function calculateWin(symbols, bet = 10) {
            if (symbols[0] === symbols[1] && symbols[1] === symbols[2]) {
                return bet * 5;  // джекпот
            }
            if (symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2]) {
                return bet * 1.2;
            }
            return 0;
        }

        function setWinMessage(text, isWin = false) {
            if (winMessageSpan) winMessageSpan.innerText = text;
            if (winLineDiv) {
                if (isWin) winLineDiv.classList.add('win-active');
                else winLineDiv.classList.remove('win-active');
            }
        }

        // анимация вращения (мигание символами)
        async function spin() {
            if (isSpinning) return;
            const bet = 10;
            if (currentBalance < bet) {
                setWinMessage("❌ Не хватает монет!");
                return;
            }
            isSpinning = true;
            spinBtn.disabled = true;

            // списываем ставку
            subtractCoins(bet);
            setWinMessage("🎲 Вращение...");

            // быстрая смена символов (имитация)
            const themeData = themes[currentTheme];
            let spinsRemaining = 12;
            const interval = setInterval(() => {
                for (let i = 0; i < 3; i++) {
                    const fakeSymbol = getRandomSymbol(themeData.symbols);
                    if (reels[i]) reels[i].innerText = fakeSymbol;
                }
                spinsRemaining--;
                if (spinsRemaining <= 0) {
                    clearInterval(interval);
                    // финальный результат
                    const finalSymbols = spinReels();
                    const winAmount = calculateWin(finalSymbols, bet);
                    if (winAmount > 0) {
                        addCoins(winAmount);
                        setWinMessage(`✨ ВЫИГРЫШ: ${winAmount} ✨`, true);
                        // простая вибрация, если есть
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else {
                        setWinMessage("😭 Ничего, повезёт в следующий раз");
                    }
                    spinBtn.disabled = false;
                    isSpinning = false;
                }
            }, 70);
        }

        // ---------- ТЕМЫ ----------
        function applyTheme(themeKey) {
            const theme = themes[themeKey];
            if (!theme) return;
            currentTheme = themeKey;
            container.style.borderColor = theme.border;
            // обновить активную кнопку
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.dataset.theme === themeKey) btn.classList.add('theme-active');
                else btn.classList.remove('theme-active');
            });
            // поменять символы на барабанах на новые (случайные из темы)
            const newSymbols = [];
            for (let i = 0; i < 3; i++) {
                newSymbols.push(getRandomSymbol(theme.symbols));
            }
            currentSymbols = newSymbols;
            for (let i = 0; i < 3; i++) {
                if (reels[i]) reels[i].innerText = currentSymbols[i];
            }
            setWinMessage(`🎨 Тема: ${theme.name}`);
        }

        function buildThemeButtons() {
            const containerBtns = document.getElementById('themeButtons');
            if (!containerBtns) return;
            containerBtns.innerHTML = '';
            themeKeys.forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'theme-btn';
                if (key === currentTheme) btn.classList.add('theme-active');
                btn.innerText = themes[key].name;
                btn.dataset.theme = key;
                btn.addEventListener('click', () => {
                    applyTheme(key);
                });
                containerBtns.appendChild(btn);
            });
        }

        // ---------- МЕНЮ (Профиль, Рейтинг, Кошелёк, Меню) ----------
        function showPanel(panelName) {
            const tg = window.Telegram?.WebApp;
            switch (panelName) {
                case 'profile':
                    infoPanel.innerHTML = `👤 <strong>Профиль</strong><br>ID: ${tg?.initDataUnsafe?.user?.id || 'local_feries'}<br>Баланс: ${currentBalance}<br>Тема: ${themes[currentTheme].name}`;
                    break;
                case 'rating':
                    infoPanel.innerHTML = `🏆 <strong>Рейтинг</strong><br>1. Чемпион — 50000<br>2. Ты — ${currentBalance}<br>Играй больше, чтобы подняться!`;
                    break;
                case 'wallet':
                    infoPanel.innerHTML = `💰 <strong>Кошелёк</strong><br>Баланс: ${currentBalance}<br>Ставка: 10 монет`;
                    break;
                case 'menu':
                    infoPanel.innerHTML = `📋 <strong>Меню</strong><br>• Выбери тему выше<br>• Жми SPIN<br>• Звуки и риск-режим скоро!`;
                    break;
                default: infoPanel.innerHTML = `🎰 Выбери тему и крути!`;
            }
            // подсветка активного пункта меню
            document.querySelectorAll('.menu-item').forEach(el => {
                if (el.dataset.menu === panelName) el.classList.add('menu-active');
                else el.classList.remove('menu-active');
            });
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            loadBalance();
            buildThemeButtons();
            applyTheme(currentTheme);   // установит рамку и символы
            // кнопка SPIN
            if (spinBtn) spinBtn.addEventListener('click', spin);
            // нижнее меню
            document.querySelectorAll('.menu-item').forEach(el => {
                el.addEventListener('click', () => {
                    const menuName = el.dataset.menu;
                    showPanel(menuName);
                });
            });
            // приветствие
            showPanel('menu');
            // если Telegram WebApp есть — развернуть окно
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
            }
        }

        init();
    })();
</script>
</body>
</html>
