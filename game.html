<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES Casino — живая игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0b1428, #02040c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 12px;
        }
        .app {
            background: rgba(6, 10, 20, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 64px;
            padding: 20px 16px 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(212, 175, 55, 0.6);
            max-width: 560px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 20px;
        }
        .logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffe6a3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 8px 24px;
            text-align: center;
            border: 1px solid #ffd966;
            box-shadow: 0 0 8px rgba(212,175,55,0.5);
        }
        .balance span {
            font-size: 2rem;
            font-weight: bold;
            color: #ffdf80;
        }
        .slot-area {
            background: #0a0f1acc;
            border-radius: 56px;
            padding: 20px 12px;
            margin: 8px 0;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .reel {
            background: #11161f;
            border-radius: 32px;
            padding: 24px 0;
            width: 110px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 8px 14px black;
        }
        .reel-symbol {
            font-size: 72px;
            filter: drop-shadow(0 2px 4px black);
        }
        .win-area {
            background: rgba(212,175,55,0.2);
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin: 12px 0;
            transition: 0.1s;
        }
        .win-active {
            background: rgba(212,175,55,0.8);
            color: #0a0f1e;
            box-shadow: 0 0 20px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b111ccc;
            border-radius: 60px;
            padding: 10px 20px;
            margin: 15px 0;
        }
        .bet-label {
            font-size: 1rem;
            color: #ddd;
        }
        .bet-control {
            display: flex;
            gap: 25px;
            background: #1a1f2e;
            padding: 5px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d572, #c49b2c);
            border: none;
            width: 92%;
            padding: 18px;
            border-radius: 80px;
            font-size: 2rem;
            font-weight: bold;
            color: #0c0f18;
            margin: 12px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }
        .theme-row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 12px 4px;
        }
        .theme-chip {
            background: #20273d;
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #eee;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #4a526b;
        }
        .theme-active {
            background: #d4af37;
            color: #0a0f1e;
            border-color: #ffea9e;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            margin: 24px 0 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(212,175,55,0.4);
        }
        .nav-btn {
            text-align: center;
            color: #bbb;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 60px;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
        }
        .nav-active {
            background: #d4af37;
            color: #0a0f1e;
        }
        .screen {
            display: none;
            margin-top: 20px;
        }
        .screen.active {
            display: block;
        }
        .card {
            background: #03060cdd;
            border-radius: 48px;
            padding: 24px;
        }
        .rating-item {
            display: flex;
            justify-content: space-between;
            background: #111a24;
            padding: 14px 20px;
            border-radius: 60px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffd966;
        }
        .history-item {
            background: #0f1620;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 16px;
        }
        @media (max-width: 480px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="top">
        <div class="logo"><h1>FERIES</h1></div>
        <div class="balance"><span id="balanceVal">1000</span></div>
    </div>

    <div id="menuScreen" class="screen active">
        <div class="card" style="text-align:center;">
            <div id="startGameBtn" style="background:#1e2a3a; border-radius:48px; padding:22px; margin:12px 0; cursor:pointer;">
                <div style="font-size:1.8rem;">🔥 FERIES CLASSIC</div>
                <div style="font-size:0.9rem; color:#d4af37;">▶ Нажми, чтобы играть</div>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="slot-area">
            <div class="reels">
                <div class="reel"><div class="reel-symbol" id="r0">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r1">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r2">🍒</div></div>
            </div>
            <div class="win-area" id="winArea"><span id="winMsg">🎰 SPIN</span></div>
            <div class="bet-panel">
                <span class="bet-label">💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betVal">10</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
            <div class="theme-row" id="themeList"></div>
        </div>
    </div>

    <div id="profileScreen" class="screen">
        <div class="card">
            <div style="font-size:1.5rem;">👤 Профиль</div>
            <p>⭐ Игр: <span id="statGames">0</span></p>
            <p>🏆 Макс. выигрыш: <span id="statMax">0</span></p>
            <p>📈 Общий выигрыш: <span id="statTotal">0</span></p>
        </div>
    </div>

    <div id="ratingScreen" class="screen">
        <div class="card">
            <div style="font-size:1.3rem; margin-bottom:16px;">🌍 Топ игроков</div>
            <div id="ratingList">Загрузка...</div>
        </div>
    </div>

    <div id="walletScreen" class="screen">
        <div class="card">
            <div style="font-size:1.3rem;">💰 История</div>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" data-screen="menu">🎮 Меню</div>
        <div class="nav-btn" data-screen="profile">👤 Профиль</div>
        <div class="nav-btn" data-screen="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-screen="wallet">💰 Кошелек</div>
    </div>
    <footer>Онлайн режим • Все данные защищены</footer>
</div>

<script>
    // ---------- НАСТРОЙКИ ----------
    const API = 'https://script.google.com/macros/s/AKfycbwqfGd_9OUt2iPV9av11cuCCEfn8EmNt_1pwoonnBlco0gKv7cJRbEY5wG01Sa-uxJ7/exec';  // ЗАМЕНИТЕ НА URL ВАШЕГО WEB-APP
    let userId = 'anon';
    let balance = 1000;
    let currentBet = 10;
    let currentTheme = 'fruit';
    let currentSymbols = ['🍒','🍒','🍒'];
    let spinning = false;
    
    const themes = {
        fruit: { name:'🍎 Fruit', border:'#E65100', symbols:['🍒','🍊','🍋','🍉','🍇','🍓'] },
        crypto: { name:'₿ Crypto', border:'#F7931A', symbols:['₿','Ξ','Ł','₮','💎','🚀'] },
        jungle: { name:'🌿 Jungle', border:'#2E7D32', symbols:['🐒','🐍','🦜','🌿','🍌','🐆'] },
        egypt: { name:'🔺 Egypt', border:'#C9A03D', symbols:['🐫','👑','𓂀','🦂','🌞','🔺'] },
        space: { name:'🪐 Space', border:'#3A4F8A', symbols:['🪐','🚀','🌙','⭐','👽','🌌'] }
    };
    
    // DOM
    const balanceSpan = document.getElementById('balanceVal');
    const betSpan = document.getElementById('betVal');
    const winMsgSpan = document.getElementById('winMsg');
    const winArea = document.getElementById('winArea');
    const spinButton = document.getElementById('spinBtn');
    const reelsDiv = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const appDiv = document.getElementById('app');
    
    // экраны
    const screens = {
        menu: document.getElementById('menuScreen'),
        game: document.getElementById('gameScreen'),
        profile: document.getElementById('profileScreen'),
        rating: document.getElementById('ratingScreen'),
        wallet: document.getElementById('walletScreen')
    };
    
    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if(btn.dataset.screen === name) btn.classList.add('nav-active');
            else btn.classList.remove('nav-active');
        });
        if(name === 'profile') loadProfile();
        if(name === 'rating') loadRating();
        if(name === 'wallet') loadHistory();
    }
    
    // ---- API вызовы (асинхронные, не блокируют UI) ----
    async function loadUser() {
        const res = await fetch(`${API}?action=getUser&userId=${userId}`);
        const data = await res.json();
        if(data.status === 'ok') {
            balance = data.balance;
            balanceSpan.innerText = balance;
            document.getElementById('statGames').innerText = data.games || 0;
            document.getElementById('statMax').innerText = data.maxWin || 0;
            document.getElementById('statTotal').innerText = data.totalWin || 0;
        }
    }
    
    async function loadRating() {
        try {
            // временно, потом сделаем getTop
            const res = await fetch(`${API}?action=getTop&userId=${userId}`);
            const data = await res.json();
            if(data.list) {
                document.getElementById('ratingList').innerHTML = data.list.map(p => `<div class="rating-item"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
            } else document.getElementById('ratingList').innerHTML = '<div class="rating-item">Нет данных</div>';
        } catch(e) { document.getElementById('ratingList').innerHTML = '<div class="rating-item">Ошибка загрузки</div>'; }
    }
    
    async function loadHistory() {
        const res = await fetch(`${API}?action=getUser&userId=${userId}`);
        const data = await res.json();
        if(data.history) {
            const html = data.history.map(h => `<div class="history-item">${h.date?.slice(0,16)} | Ст. ${h.bet} | Выигр. ${h.win} | Бал. ${h.balance}</div>`).join('');
            document.getElementById('historyList').innerHTML = html || 'Нет истории';
        }
    }
    
    async function loadProfile() { await loadUser(); }
    
    // ---- ИГРОВАЯ ЛОГИКА (мгновенный ответ) ----
    function getRandomSymbol(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
    
    function spinReels() {
        const syms = themes[currentTheme].symbols;
        for(let i=0;i<3;i++) {
            currentSymbols[i] = getRandomSymbol(syms);
            reelsDiv[i].innerText = currentSymbols[i];
        }
        return currentSymbols;
    }
    
    function calcWin(symbols, bet) {
        if(symbols[0]===symbols[1] && symbols[1]===symbols[2]) return bet * 5;
        if(symbols[0]===symbols[1] || symbols[1]===symbols[2] || symbols[0]===symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }
    
    function setWinMessage(text, isWin=false) {
        winMsgSpan.innerText = text;
        if(isWin) winArea.classList.add('win-active');
        else winArea.classList.remove('win-active');
    }
    
    async function spin() {
        if(spinning) return;
        if(balance < currentBet) { setWinMessage("❌ Не хватает монет!"); return; }
        
        spinning = true;
        spinButton.disabled = true;
        
        // списываем ставку мгновенно
        balance -= currentBet;
        balanceSpan.innerText = balance;
        setWinMessage("🌀 Крутим...");
        
        // анимация вращения
        const themeData = themes[currentTheme];
        let anim = 12;
        const interval = setInterval(() => {
            for(let i=0;i<3;i++) reelsDiv[i].innerText = getRandomSymbol(themeData.symbols);
            anim--;
            if(anim === 0) {
                clearInterval(interval);
                // финальные символы
                const final = spinReels();
                const win = calcWin(final, currentBet);
                const newBalance = balance + win;
                // обновляем UI
                if(win > 0) {
                    balance = newBalance;
                    balanceSpan.innerText = balance;
                    setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                    if(navigator.vibrate) navigator.vibrate(200);
                } else {
                    setWinMessage("😢 Проигрыш");
                }
                spinning = false;
                spinButton.disabled = false;
                // отправляем на сервер фоном (не ждём)
                fetch(API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'spin',
                        userId: userId,
                        bet: currentBet,
                        win: win,
                        newBalance: balance,
                        symbols: final,
                        theme: currentTheme
                    })
                }).catch(err => console.warn);
                // обновляем профиль и историю в фоне
                loadUser();
            }
        }, 60);
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if(newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betSpan.innerText = currentBet;
        }
    }
    
    function applyTheme(key) {
        currentTheme = key;
        appDiv.style.borderColor = themes[key].border;
        document.querySelectorAll('.theme-chip').forEach(chip => {
            if(chip.dataset.theme === key) chip.classList.add('theme-active');
            else chip.classList.remove('theme-active');
        });
        spinReels(); // обновить символы
    }
    
    function buildThemes() {
        const container = document.getElementById('themeList');
        container.innerHTML = '';
        Object.keys(themes).forEach(key => {
            const chip = document.createElement('div');
            chip.className = 'theme-chip';
            if(key === currentTheme) chip.classList.add('theme-active');
            chip.innerText = themes[key].name;
            chip.dataset.theme = key;
            chip.onclick = () => applyTheme(key);
            container.appendChild(chip);
        });
    }
    
    // ---- ИНИЦИАЛИЗАЦИЯ ----
    window.onload = async () => {
        if(window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if(tg.initDataUnsafe && tg.initDataUnsafe.user) userId = String(tg.initDataUnsafe.user.id);
        }
        await loadUser();
        buildThemes();
        applyTheme('fruit');
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        spinButton.onclick = spin;
        document.getElementById('startGameBtn').onclick = () => showScreen('game');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.screen);
        });
        showScreen('menu');
    };
</script>
</body>
</html>
