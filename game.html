<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FERIES Casino — онлайн версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 12px;
        }
        .app-container {
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 16px 12px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            max-width: 520px;
            width: 100%;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 12px;
        }
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #f9e0a0, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance-box {
            background: rgba(0,0,0,0.6);
            border-radius: 80px;
            padding: 6px 18px;
            border: 1px solid #d4af37;
            text-align: center;
        }
        .balance-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd966;
        }
        .slot-screen {
            background: #0a0e16;
            border-radius: 48px;
            padding: 16px 12px;
            margin: 12px 0;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 15px 0;
        }
        .reel {
            background: #131a2a;
            border-radius: 28px;
            padding: 18px 0;
            width: 100px;
            text-align: center;
        }
        .reel-symbol { font-size: 64px; }
        .win-line {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        .win-active { background: rgba(212,175,55,0.7); color: #0a0f1e; }
        .bet-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f1420cc;
            border-radius: 60px;
            padding: 8px 18px;
            margin: 10px 0;
        }
        .bet-changer {
            display: flex;
            gap: 20px;
            background: #1a1f2e;
            padding: 5px 15px;
            border-radius: 40px;
        }
        .bet-changer button {
            background: none;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            color: #d4af37;
            cursor: pointer;
        }
        .bet-value { font-size: 1.4rem; font-weight: bold; color: white; min-width: 50px; text-align: center; }
        .spin-btn {
            background: linear-gradient(145deg, #e6c458, #b48b2c);
            border: none;
            width: 90%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4a1a;
        }
        .spin-btn:active { transform: translateY(2px); }
        .theme-strip {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 12px 4px;
        }
        .theme-chip {
            background: #1f2538;
            border-radius: 40px;
            padding: 8px 18px;
            color: #ddd;
            cursor: pointer;
            border: 1px solid #3a4055;
        }
        .theme-active { background: #d4af37; color: #0a0f1e; }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            margin: 16px 0 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(212,175,55,0.3);
        }
        .nav-item {
            color: #aaa;
            font-size: 0.75rem;
            padding: 8px 12px;
            border-radius: 60px;
            cursor: pointer;
            background: rgba(0,0,0,0.3);
        }
        .nav-active { background: #d4af37; color: #0a0f1e; }
        .screen { display: none; margin-top: 12px; }
        .screen.active { display: block; }
        .panel-card {
            background: rgba(0,0,0,0.65);
            border-radius: 40px;
            padding: 20px;
        }
        .rating-list { display: flex; flex-direction: column; gap: 12px; }
        .rating-item {
            display: flex;
            justify-content: space-between;
            background: #151e2c;
            padding: 10px 16px;
            border-radius: 60px;
        }
        .history-line { font-size: 0.8rem; padding: 6px 0; border-bottom: 1px solid #333; }
        footer { text-align: center; font-size: 0.55rem; color: #4a5070; margin-top: 12px; }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="top-bar">
        <div class="logo"><h1>FERIES</h1></div>
        <div class="balance-box"><div class="balance-value" id="balanceDisplay">1000</div></div>
    </div>

    <!-- Меню игр -->
    <div id="menuScreen" class="screen active">
        <div class="game-list" style="display:flex; flex-direction:column; gap:16px;">
            <div class="game-card" id="startClassicBtn" style="background:#1e2a3a; border-radius:32px; padding:16px; display:flex; justify-content:space-between; cursor:pointer;">
                <span>🔥 FERIES Classic</span><span style="color:gold;">Активна</span>
            </div>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" class="screen">
        <div class="slot-screen">
            <div class="reels">
                <div class="reel"><div class="reel-symbol" id="reel0">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="reel1">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="reel2">🍒</div></div>
            </div>
            <div class="win-line" id="winLine"><span id="winMessage">🎡 SPIN</span></div>
            <div class="bet-block">
                <span>💰 СТАВКА</span>
                <div class="bet-changer">
                    <button id="betMinus">–</button>
                    <span class="bet-value" id="betValue">10</span>
                    <button id="betPlus">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinButton">🔮 SPIN</button>
            <div class="theme-strip" id="themeList"></div>
        </div>
    </div>

    <!-- Профиль -->
    <div id="profileScreen" class="screen">
        <div class="panel-card">
            <p>⭐ Игр: <span id="totalGames">0</span></p>
            <p>🏆 Макс выигрыш: <span id="maxWin">0</span></p>
            <p>📈 Общий выигрыш: <span id="totalWin">0</span></p>
        </div>
    </div>

    <!-- Рейтинг (глобальный из таблицы) -->
    <div id="ratingScreen" class="screen">
        <div class="panel-card"><div id="ratingList">Загрузка...</div></div>
    </div>

    <!-- Кошелёк (история из таблицы) -->
    <div id="walletScreen" class="screen">
        <div class="panel-card"><div id="historyList"></div></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" data-nav="menu">🎮 Меню</div>
        <div class="nav-item" data-nav="profile">👤 Профиль</div>
        <div class="nav-item" data-nav="rating">🏆 Рейтинг</div>
        <div class="nav-item" data-nav="wallet">💰 Кошелёк</div>
    </div>
    <footer>Онлайн версия — все данные в FERIES_DB</footer>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const API_URL = 'YOUR_APPS_SCRIPT_URL';  // 👈 СЮДА ВСТАВЬ ССЫЛКУ НА WEB-APP
    let userId = 'anon';
    let currentBalance = 1000;
    let currentBet = 10;
    let currentTheme = 'fruit';
    let currentSymbols = ['🍒','🍒','🍒'];
    let isSpinning = false;
    
    const themes = {
        fruit: { name:'Fruit', border:'#E65100', symbols:['🍒','🍊','🍋','🍉','🍇','🍓'] },
        crypto: { name:'Crypto', border:'#F7931A', symbols:['₿','Ξ','Ł','₮','💎','🚀'] },
        jungle: { name:'Jungle', border:'#2E7D32', symbols:['🐒','🐍','🦜','🌿','🍌','🐆'] },
        egypt: { name:'Egypt', border:'#C9A03D', symbols:['🐫','👑','𓂀','🦂','🌞','🔺'] },
        space: { name:'Space', border:'#3A4F8A', symbols:['🪐','🚀','🌙','⭐','👽','🌌'] }
    };
    
    // DOM
    const balanceSpan = document.getElementById('balanceDisplay');
    const betSpan = document.getElementById('betValue');
    const winMessageSpan = document.getElementById('winMessage');
    const winLine = document.getElementById('winLine');
    const spinBtn = document.getElementById('spinButton');
    const reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
    
    // Экраны
    const screens = { menu:'menuScreen', game:'gameScreen', profile:'profileScreen', rating:'ratingScreen', wallet:'walletScreen' };
    
    function showScreen(name) {
        Object.values(screens).forEach(id => document.getElementById(id).classList.remove('active'));
        document.getElementById(screens[name]).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(btn => {
            if(btn.dataset.nav === name) btn.classList.add('nav-active');
            else btn.classList.remove('nav-active');
        });
        if(name === 'rating') loadRating();
        if(name === 'wallet') loadHistory();
        if(name === 'profile') loadProfile();
    }
    
    // Загрузка данных с сервера
    async function loadUserData() {
        try {
            const res = await fetch(`${API_URL}?action=getUser&userId=${userId}`);
            const data = await res.json();
            if(data.status === 'ok') {
                currentBalance = data.balance;
                balanceSpan.innerText = currentBalance;
                document.getElementById('totalGames').innerText = data.games || 0;
                document.getElementById('maxWin').innerText = data.maxWin || 0;
                document.getElementById('totalWin').innerText = data.totalWin || 0;
            }
        } catch(e) { console.warn(e); }
    }
    
    async function loadRating() {
        // Временно демо — потом сделаем отдельный эндпоинт getTop
        document.getElementById('ratingList').innerHTML = '<div class="rating-item">1. FERIES_MASTER 5000</div>';
    }
    
    async function loadHistory() {
        try {
            const res = await fetch(`${API_URL}?action=getUser&userId=${userId}`);
            const data = await res.json();
            if(data.history) {
                const html = data.history.map(h => `<div class="history-line">${h.date.slice(0,16)} | Ставка ${h.bet} | Выигрыш ${h.win} | Баланс ${h.balance}</div>`).join('');
                document.getElementById('historyList').innerHTML = html || 'Нет истории';
            }
        } catch(e) {}
    }
    
    async function loadProfile() {
        await loadUserData();
    }
    
    // Логика игры
    function getRandomSymbol(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
    function spinReels() {
        const syms = themes[currentTheme].symbols;
        for(let i=0;i<3;i++) {
            currentSymbols[i] = getRandomSymbol(syms);
            reels[i].innerText = currentSymbols[i];
        }
        return currentSymbols;
    }
    function calculateWin(symbols, bet) {
        if(symbols[0]===symbols[1] && symbols[1]===symbols[2]) return bet * 5;
        if(symbols[0]===symbols[1] || symbols[1]===symbols[2] || symbols[0]===symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }
    function setWinMessage(text, isWin=false) {
        winMessageSpan.innerText = text;
        if(isWin) winLine.classList.add('win-active');
        else winLine.classList.remove('win-active');
    }
    
    async function spin() {
        if(isSpinning) return;
        if(currentBalance < currentBet) { setWinMessage("❌ Не хватает"); return; }
        isSpinning = true;
        spinBtn.disabled = true;
        // локальное списание для отзывчивости
        currentBalance -= currentBet;
        balanceSpan.innerText = currentBalance;
        setWinMessage("🌀 Крутим...");
        
        const themeData = themes[currentTheme];
        let anim = 12;
        const interval = setInterval(() => {
            for(let i=0;i<3;i++) reels[i].innerText = getRandomSymbol(themeData.symbols);
            anim--;
            if(anim<=0) {
                clearInterval(interval);
                const finalSymbols = spinReels();
                const win = calculateWin(finalSymbols, currentBet);
                const newBalance = currentBalance + win;
                // Отправляем на сервер
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'spin',
                        userId: userId,
                        bet: currentBet,
                        win: win,
                        newBalance: newBalance,
                        symbols: finalSymbols,
                        theme: currentTheme
                    })
                }).then(res => res.json()).then(data => {
                    if(data.status === 'ok') {
                        currentBalance = data.balance;
                        balanceSpan.innerText = currentBalance;
                        if(win>0) {
                            setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                            if(navigator.vibrate) navigator.vibrate(200);
                        } else setWinMessage("😢 Проигрыш");
                        loadUserData(); // обновить статистику
                    } else { setWinMessage("Ошибка сервера"); }
                }).catch(() => setWinMessage("Нет связи с БД"));
                spinBtn.disabled = false;
                isSpinning = false;
            }
        }, 70);
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if(newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betSpan.innerText = currentBet;
        }
    }
    
    function applyTheme(themeKey) {
        currentTheme = themeKey;
        document.getElementById('app').style.borderColor = themes[themeKey].border;
        document.querySelectorAll('.theme-chip').forEach(chip => {
            if(chip.dataset.theme === themeKey) chip.classList.add('theme-active');
            else chip.classList.remove('theme-active');
        });
        spinReels();
    }
    
    function buildThemes() {
        const container = document.getElementById('themeList');
        container.innerHTML = '';
        Object.keys(themes).forEach(key => {
            const chip = document.createElement('div');
            chip.className = 'theme-chip';
            if(key === currentTheme) chip.classList.add('theme-active');
            chip.innerText = themes[key].name;
            chip.dataset.theme = key;
            chip.onclick = () => applyTheme(key);
            container.appendChild(chip);
        });
    }
    
    // Инициализация
    window.onload = async () => {
        if(window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            if(tg.initDataUnsafe && tg.initDataUnsafe.user) userId = String(tg.initDataUnsafe.user.id);
        }
        await loadUserData();
        buildThemes();
        applyTheme('fruit');
        document.getElementById('betMinus').onclick = () => changeBet(-5);
        document.getElementById('betPlus').onclick = () => changeBet(5);
        spinBtn.onclick = spin;
        document.getElementById('startClassicBtn').onclick = () => showScreen('game');
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.nav);
        });
        showScreen('menu');
    };
</script>
</body>
</html>
