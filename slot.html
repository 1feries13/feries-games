<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES CASINO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1a, #02050c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 0;
        }
        .app {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            background: linear-gradient(145deg, #11161f, #0a0e16);
            border-radius: 56px 56px 40px 40px;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0,0,0,0.7);
        }
        .top {
            background: rgba(0,0,0,0.3);
            padding: 20px 24px 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance {
            background: #000000aa;
            border-radius: 80px;
            padding: 6px 24px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .balance span {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffdf80;
        }
        .slot-area {
            padding: 20px 20px 12px;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .reel {
            background: #0b101ccc;
            border-radius: 36px;
            padding: 24px 0;
            width: 110px;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(212,175,55,0.2), 0 12px 20px black;
        }
        .reel-symbol {
            font-size: 72px;
            filter: drop-shadow(0 4px 8px black);
        }
        .win-area {
            background: rgba(212,175,55,0.1);
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 16px 0;
            transition: 0.1s;
        }
        .win-active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 20px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 12px 0;
        }
        .bet-label {
            font-size: 1rem;
            color: #ccc;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd966;
            cursor: pointer;
            width: 44px;
        }
        .bet-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 80px;
            font-size: 2rem;
            font-weight: bold;
            color: #0c0f18;
            margin: 16px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }
        .theme-strip {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 12px 4px;
            margin-top: 8px;
        }
        .theme-chip {
            background: #20273d;
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #eee;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #4a526b;
        }
        .theme-active {
            background: #d4af37;
            color: #0a0f1e;
            border-color: #ffea9e;
        }
        .nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 12px 12px 20px;
            margin-top: 8px;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            color: #ccc;
        }
        .nav-active {
            background: #d4af37;
            color: #0a0f1e;
        }
        .screen {
            display: none;
            padding: 0 20px 20px;
        }
        .screen.active {
            display: block;
        }
        .card {
            background: rgba(0,0,0,0.45);
            border-radius: 48px;
            padding: 24px;
            backdrop-filter: blur(8px);
        }
        .rating-item {
            display: flex;
            justify-content: space-between;
            background: #151e2c;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffd966;
        }
        .history-item {
            background: #0f1620;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #ddd;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 12px;
            background: rgba(0,0,0,0.2);
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top">
        <div class="logo"><h1>FERIES</h1></div>
        <div class="balance"><span id="balanceVal">1000</span></div>
    </div>

    <div id="menuScreen" class="screen active">
        <div class="card" style="text-align:center;">
            <div id="startGameBtn" style="background:linear-gradient(145deg,#2a3448,#141a2a); border-radius:48px; padding:28px; cursor:pointer;">
                <div style="font-size:2rem;">🔥 FERIES CLASSIC</div>
                <div style="font-size:1.1rem; color:#d4af37; margin-top:8px;">➡️ Нажми, чтобы играть</div>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div class="slot-area">
            <div class="reels">
                <div class="reel"><div class="reel-symbol" id="r0">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r1">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r2">🍒</div></div>
            </div>
            <div class="win-area" id="winArea"><span id="winMsg">🎰 SPIN</span></div>
            <div class="bet-panel">
                <span class="bet-label">💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betVal">10</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
            <div class="theme-strip" id="themeList"></div>
        </div>
    </div>

    <div id="profileScreen" class="screen">
        <div class="card">
            <div style="font-size:1.5rem; margin-bottom:16px;">👤 Профиль</div>
            <p>⭐ Игр: <span id="statGames">0</span></p>
            <p>🏆 Макс. выигрыш: <span id="statMax">0</span></p>
            <p>📈 Общий выигрыш: <span id="statTotal">0</span></p>
        </div>
    </div>

    <div id="ratingScreen" class="screen">
        <div class="card">
            <div style="font-size:1.3rem; margin-bottom:16px;">🌍 Топ игроков</div>
            <div id="ratingList">Загрузка...</div>
        </div>
    </div>

    <div id="walletScreen" class="screen">
        <div class="card">
            <div style="font-size:1.3rem;">💰 История</div>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-btn" data-screen="menu">🎮 Меню</div>
        <div class="nav-btn" data-screen="profile">👤 Профиль</div>
        <div class="nav-btn" data-screen="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-screen="wallet">💰 Кошелек</div>
    </div>
    <footer>FERIES CASINO — честная игра</footer>
</div>

<script>
    // ========== НАСТРОЙКИ ==========
    const API = 'ВАШ_URL_APPS_SCRIPT';  // 👈 СЮДА ВСТАВЬ ССЫЛКУ НА ВЕБ-АПП (проверенный, который вернул JSON)
    let userId = 'anon';
    let balance = 1000;
    let currentBet = 10;
    let currentTheme = 'fruit';
    let currentSymbols = ['🍒','🍒','🍒'];
    let spinning = false;

    const themes = {
        fruit: { name:'🍎 Fruit', border:'#E65100', symbols:['🍒','🍊','🍋','🍉','🍇','🍓'] },
        crypto: { name:'₿ Crypto', border:'#F7931A', symbols:['₿','Ξ','Ł','₮','💎','🚀'] },
        jungle: { name:'🌿 Jungle', border:'#2E7D32', symbols:['🐒','🐍','🦜','🌿','🍌','🐆'] },
        egypt: { name:'🔺 Egypt', border:'#C9A03D', symbols:['🐫','👑','𓂀','🦂','🌞','🔺'] },
        space: { name:'🪐 Space', border:'#3A4F8A', symbols:['🪐','🚀','🌙','⭐','👽','🌌'] }
    };

    // DOM
    const balanceSpan = document.getElementById('balanceVal');
    const betSpan = document.getElementById('betVal');
    const winMsgSpan = document.getElementById('winMsg');
    const winAreaDiv = document.getElementById('winArea');
    const spinBtn = document.getElementById('spinBtn');
    const reels = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const appDiv = document.querySelector('.app');

    const screens = {
        menu: document.getElementById('menuScreen'),
        game: document.getElementById('gameScreen'),
        profile: document.getElementById('profileScreen'),
        rating: document.getElementById('ratingScreen'),
        wallet: document.getElementById('walletScreen')
    };

    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.screen === name) btn.classList.add('nav-active');
            else btn.classList.remove('nav-active');
        });
        if (name === 'profile') loadProfile();
        if (name === 'rating') loadRating();
        if (name === 'wallet') loadHistory();
    }

    // ========== ПОЛУЧЕНИЕ USER ID из Telegram или URL ==========
    function getUserId() {
        // 1. Пытаемся взять из Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            return String(window.Telegram.WebApp.initDataUnsafe.user.id);
        }
        // 2. Пытаемся взять из параметра URL ?user_id=...
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('user_id');
        if (urlUserId) return urlUserId;
        // 3. Если ничего нет — оставляем 'anon'
        return 'anon';
    }

    // ========== API ==========
    async function loadUser() {
        try {
            const res = await fetch(`${API}?action=getUser&userId=${userId}`);
            const data = await res.json();
            if (data.status === 'ok') {
                balance = data.balance;
                balanceSpan.innerText = balance;
                document.getElementById('statGames').innerText = data.games || 0;
                document.getElementById('statMax').innerText = data.maxWin || 0;
                document.getElementById('statTotal').innerText = data.totalWin || 0;
            }
        } catch(e) { console.warn('loadUser error', e); }
    }

    async function loadRating() {
        try {
            const res = await fetch(`${API}?action=getTop&userId=${userId}`);
            const data = await res.json();
            if (data.list && data.list.length) {
                const html = data.list.map(p => `<div class="rating-item"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
                document.getElementById('ratingList').innerHTML = html;
            } else {
                document.getElementById('ratingList').innerHTML = '<div class="rating-item">Нет данных</div>';
            }
        } catch(e) { document.getElementById('ratingList').innerHTML = '<div class="rating-item">Ошибка загрузки</div>'; }
    }

    async function loadHistory() {
        try {
            const res = await fetch(`${API}?action=getUser&userId=${userId}`);
            const data = await res.json();
            if (data.history && data.history.length) {
                const html = data.history.map(h => `<div class="history-item">${h.date?.slice(0,16)} | Ст. ${h.bet} | Выигрыш ${h.win} | Баланс ${h.balance}</div>`).join('');
                document.getElementById('historyList').innerHTML = html;
            } else {
                document.getElementById('historyList').innerHTML = '<div class="history-item">Нет истории</div>';
            }
        } catch(e) { document.getElementById('historyList').innerHTML = '<div class="history-item">Ошибка</div>'; }
    }

    async function loadProfile() { await loadUser(); }

    // ========== ИГРА ==========
    function getRandomSymbol(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function spinReels() {
        const syms = themes[currentTheme].symbols;
        for (let i=0;i<3;i++) {
            currentSymbols[i] = getRandomSymbol(syms);
            reels[i].innerText = currentSymbols[i];
        }
        return currentSymbols;
    }

    function calcWin(symbols, bet) {
        if (symbols[0]===symbols[1] && symbols[1]===symbols[2]) return bet * 5;
        if (symbols[0]===symbols[1] || symbols[1]===symbols[2] || symbols[0]===symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }

    function setWinMessage(text, isWin=false) {
        winMsgSpan.innerText = text;
        if (isWin) winAreaDiv.classList.add('win-active');
        else winAreaDiv.classList.remove('win-active');
    }

    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        spinBtn.disabled = true;

        const themeData = themes[currentTheme];
        let anim = 12;
        const interval = setInterval(() => {
            for (let i=0;i<3;i++) reels[i].innerText = getRandomSymbol(themeData.symbols);
            anim--;
            if (anim === 0) {
                clearInterval(interval);
                const final = spinReels();
                const win = calcWin(final, currentBet);
                const newBalance = balance - currentBet + win;
                balance = newBalance;
                balanceSpan.innerText = balance;
                if (win > 0) {
                    setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                    if (navigator.vibrate) navigator.vibrate(200);
                } else {
                    setWinMessage("😢 Проигрыш");
                }
                // Отправка на сервер (фон)
                fetch(API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'spin',
                        userId: userId,
                        bet: currentBet,
                        win: win,
                        newBalance: balance,
                        symbols: final,
                        theme: currentTheme
                    })
                }).catch(e => console.warn);
                loadUser(); // обновить статистику
                spinning = false;
                spinBtn.disabled = false;
            }
        }, 60);
    }

    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betSpan.innerText = currentBet;
        }
    }

    function applyTheme(key) {
        currentTheme = key;
        appDiv.style.borderColor = themes[key].border;
        document.querySelectorAll('.theme-chip').forEach(chip => {
            if (chip.dataset.theme === key) chip.classList.add('theme-active');
            else chip.classList.remove('theme-active');
        });
        spinReels();
    }

    function buildThemes() {
        const container = document.getElementById('themeList');
        container.innerHTML = '';
        Object.keys(themes).forEach(key => {
            const chip = document.createElement('div');
            chip.className = 'theme-chip';
            if (key === currentTheme) chip.classList.add('theme-active');
            chip.innerText = themes[key].name;
            chip.dataset.theme = key;
            chip.onclick = () => applyTheme(key);
            container.appendChild(chip);
        });
    }

    // ========== СТАРТ ==========
    window.onload = async () => {
        userId = getUserId();
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }
        await loadUser();
        buildThemes();
        applyTheme('fruit');
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        spinBtn.onclick = spin;
        document.getElementById('startGameBtn').onclick = () => showScreen('game');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.screen);
        });
        showScreen('menu');
        if (window.Telegram?.WebApp) window.Telegram.WebApp.expand();
    };
</script>
</body>
</html>
