<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 30% 20%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        /* Звёздное небо */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        /* Основной контейнер — полный экран, без скролла */
        .app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 20, 0.7);
            backdrop-filter: blur(3px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #d4af37;
            flex-shrink: 0;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 18px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd966;
        }
        /* Таблица множителей */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 8px 16px;
            margin: 12px 20px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
            flex-shrink: 0;
        }
        .paytable span {
            background: rgba(0,0,0,0.6);
            color: #ffdf80;
            padding: 4px 12px;
            border-radius: 40px;
        }
        /* Квадратный экран слота */
        .slot-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 0;
        }
        .slot-screen {
            background: #0f121c;
            border-radius: 32px;
            padding: 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .reels {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        /* Вертикальный барабан — прямоугольник */
        .reel {
            flex: 1;
            background: #ffffff;
            background: linear-gradient(145deg, #f8f8fc, #e8ecf2);
            border-radius: 20px;
            overflow: hidden;
            height: 100%;
            aspect-ratio: 1 / 2;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 8px 18px black;
            position: relative;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.05s linear;
        }
        .reel-symbol {
            height: 33.33%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 500;
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .reel-symbol:last-child {
            border-bottom: none;
        }
        /* Информационная панель */
        .info-panel {
            margin: 8px 20px;
            flex-shrink: 0;
        }
        .win-message {
            background: rgba(212,175,55,0.15);
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #ffdf80;
            margin-bottom: 10px;
        }
        .win-message.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 12px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin-bottom: 10px;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #0c0f18;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }
        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 12px;
            margin: 8px 20px 15px;
            flex-shrink: 0;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
        }
        /* Страницы */
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 30px 20px;
            overflow-y: auto;
        }
        .page.active-page {
            display: flex;
        }
        .page-card {
            background: rgba(20,25,40,0.9);
            border-radius: 48px;
            padding: 24px;
            border: 1px solid #d4af37;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: #ffdf80;
        }
        .close-page {
            background: none;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            margin-top: 30px;
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #5a6380;
            padding: 8px;
        }
        @media (max-width: 500px) {
            .reel-symbol { font-size: 2rem; }
            .paytable span { font-size: 0.65rem; }
            .balance span { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceVal">1000</span></div>
    </div>

    <div class="paytable" id="paytable">
        <span>🌟 x50</span> <span>🚀 x5</span> <span>👽 x4</span> <span>🪐 x3</span> <span>🌙 x2</span> <span>⭐ x1.5</span>
    </div>

    <div class="slot-wrapper">
        <div class="slot-screen">
            <div class="reels" id="reelsContainer"></div>
        </div>
    </div>

    <div class="info-panel">
        <div class="win-message" id="winMessage">🌀 Крути барабаны!</div>
        <div class="bet-panel">
            <span>💰 СТАВКА</span>
            <div class="bet-control">
                <button id="betDec">–</button>
                <span class="bet-value" id="betAmount">25</span>
                <button id="betInc">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" data-page="profile">👤 Профиль</div>
        <div class="nav-btn" data-page="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-page="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Страницы -->
<div id="profilePage" class="page"><div class="page-card" id="profileContent"></div><button class="close-page close-page-btn">← Назад</button></div>
<div id="ratingPage" class="page"><div class="page-card" id="ratingContent"></div><button class="close-page close-page-btn">← Назад</button></div>
<div id="walletPage" class="page"><div class="page-card" id="walletContent"></div><button class="close-page close-page-btn">← Назад</button></div>

<script>
    // ========== НАСТРОЙКИ ==========
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let userId = 'cosmic_' + Math.floor(Math.random() * 100000);
    
    const SYMBOLS = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const MULTIPLIERS = { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 };
    
    // DOM элементы
    const balanceSpan = document.getElementById('balanceVal');
    const winMsgDiv = document.getElementById('winMessage');
    const spinBtn = document.getElementById('spinButton');
    const betAmountSpan = document.getElementById('betAmount');
    const reelsContainer = document.getElementById('reelsContainer');
    let reelStrips = [];     // HTML-элементы .reel-strip для каждого барабана
    let animIntervals = [null, null, null];
    
    // ========== СОХРАНЕНИЕ ==========
    function saveGameData() {
        localStorage.setItem('cs_balance', balance);
        localStorage.setItem('cs_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cs_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cs_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() { balanceSpan.innerText = balance; }
    function updateProfileUI() {
        document.getElementById('profileContent').innerHTML = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
    }
    function updateRatingUI() {
        const list = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        list.sort((a,b) => b.score - a.score);
        document.getElementById('ratingContent').innerHTML = list.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
    }
    function updateWalletUI() {
        document.getElementById('walletContent').innerHTML = `<div class="stat-row"><span>💰 Баланс</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        winMsgDiv.innerText = '💰 Баланс восстановлен';
        winMsgDiv.classList.add('active');
        setTimeout(() => {
            if (!spinning) winMsgDiv.innerText = '🌀 Крути барабаны!';
            winMsgDiv.classList.remove('active');
        }, 1500);
    }
    
    // ========== ПОСТРОЕНИЕ БАРАБАНОВ (каждый — вертикальная лента из 9 символов) ==========
    function buildReels() {
        reelsContainer.innerHTML = '';
        reelStrips = [];
        for (let r = 0; r < 3; r++) {
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            // Генерируем 9 случайных символов для ленты
            for (let i = 0; i < 9; i++) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            reelsContainer.appendChild(reelDiv);
            reelStrips.push(stripDiv);
        }
        // Центрируем ленту так, чтобы в окне было видно 3 символа (средний — на линии выплаты)
        setTimeout(() => {
            for (let r = 0; r < 3; r++) {
                const strip = reelStrips[r];
                const firstSymbol = strip.querySelector('.reel-symbol');
                if (firstSymbol) {
                    const symbolHeight = firstSymbol.offsetHeight;
                    const totalHeight = strip.offsetHeight;
                    // Сдвигаем так, чтобы второй символ (индекс 1) оказался в центре окна
                    const centerOffset = -symbolHeight * 1;
                    strip.style.transform = `translateY(${centerOffset}px)`;
                }
            }
        }, 20);
    }
    
    // ========== АНИМАЦИЯ ВРАЩЕНИЯ ==========
    function startAllSpin() {
        for (let r = 0; r < 3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            const strip = reelStrips[r];
            const symbolsDivs = Array.from(strip.querySelectorAll('.reel-symbol'));
            animIntervals[r] = setInterval(() => {
                // Сдвигаем ленту вниз на 1 символ
                let currentY = parseFloat(strip.style.transform?.match(/translateY\(([-\d.]+)px\)/)?.[1] || 0);
                const firstDiv = symbolsDivs[0];
                if (firstDiv) {
                    const step = firstDiv.offsetHeight;
                    currentY = (currentY + step) % (symbolsDivs.length * step);
                    strip.style.transform = `translateY(${currentY}px)`;
                    // Переносим первый символ в конец, чтобы создать бесконечную ленту
                    if (Math.abs(currentY) >= step * (symbolsDivs.length - 2)) {
                        const firstSym = symbolsDivs.shift();
                        strip.appendChild(firstSym);
                        symbolsDivs.push(firstSym);
                        strip.style.transform = `translateY(0px)`;
                    }
                }
            }, 80);
        }
    }
    
    // Остановка одного барабана
    function stopReel(reelIndex, finalSymbol, callback) {
        if (animIntervals[reelIndex]) clearInterval(animIntervals[reelIndex]);
        const strip = reelStrips[reelIndex];
        const symbolsDivs = Array.from(strip.querySelectorAll('.reel-symbol'));
        // Находим индекс, где нужно остановиться (чтобы finalSymbol оказался в центре)
        let targetIndex = -1;
        for (let i = 0; i < symbolsDivs.length; i++) {
            if (symbolsDivs[i].innerText === finalSymbol) {
                targetIndex = i;
                break;
            }
        }
        if (targetIndex === -1) targetIndex = 1;
        const symbolHeight = symbolsDivs[0].offsetHeight;
        const targetY = -symbolHeight * targetIndex;
        strip.style.transition = 'transform 0.25s ease-out';
        strip.style.transform = `translateY(${targetY}px)`;
        
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, 260);
    }
    
    // Останавливаем барабаны по очереди
    function stopSequentially(finalSymbols, onComplete) {
        stopReel(0, finalSymbols[0], () => {
            setTimeout(() => {
                stopReel(1, finalSymbols[1], () => {
                    setTimeout(() => {
                        stopReel(2, finalSymbols[2], onComplete);
                    }, 300);
                });
            }, 300);
        });
    }
    
    // Расчёт выигрыша по 3 центральным символам (второй символ в ленте)
    function getCenterSymbols() {
        const centerSymbols = [];
        for (let r = 0; r < 3; r++) {
            const strip = reelStrips[r];
            const symbolsDivs = Array.from(strip.querySelectorAll('.reel-symbol'));
            const visibleIndex = 1; // второй символ (индекс 1) — центральная линия
            if (symbolsDivs[visibleIndex]) {
                centerSymbols.push(symbolsDivs[visibleIndex].innerText);
            } else {
                centerSymbols.push('🪐');
            }
        }
        return centerSymbols;
    }
    
    function calculateWin(centerSymbols, bet) {
        const counts = {};
        for (let s of centerSymbols) counts[s] = (counts[s] || 0) + 1;
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                return { win: bet * (MULTIPLIERS[sym] || 1), bonus: sym === '🌠' };
            }
        }
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 2) {
                return { win: Math.floor(bet * 1.2), bonus: false };
            }
        }
        return { win: 0, bonus: false };
    }
    
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            winMsgDiv.innerText = '❌ Не хватает монет!';
            winMsgDiv.classList.add('active');
            setTimeout(() => {
                if (!spinning) winMsgDiv.innerText = '🌀 Крути барабаны!';
                winMsgDiv.classList.remove('active');
            }, 1200);
            return;
        }
        spinning = true;
        spinBtn.disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        winMsgDiv.innerText = '🌀 Крутим...';
        winMsgDiv.classList.remove('active');
        
        startAllSpin();
        
        // Генерируем финальные символы для центральной линии
        const finalCenter = [
            SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
            SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
            SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
        ];
        
        // Останавливаем барабаны с задержкой
        setTimeout(() => {
            stopSequentially(finalCenter, () => {
                const actualCenter = getCenterSymbols();
                const { win, bonus } = calculateWin(actualCenter, currentBet);
                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                    winMsgDiv.innerText = `✨ ВЫИГРЫШ: ${win} ✨`;
                    winMsgDiv.classList.add('active');
                    if (win > stats.maxWin) stats.maxWin = win;
                    stats.totalWin += win;
                    if (navigator.vibrate) navigator.vibrate(200);
                    if (bonus) {
                        setTimeout(() => alert('🌟 БОНУС! Активирована секретная игра!'), 300);
                    }
                } else {
                    winMsgDiv.innerText = '😢 Проигрыш';
                    winMsgDiv.classList.remove('active');
                }
                stats.games++;
                saveGameData();
                updateProfileUI();
                updateRatingUI();
                updateWalletUI();
                spinning = false;
                spinBtn.disabled = false;
                setTimeout(() => {
                    if (!spinning) winMsgDiv.innerText = '🌀 Крути барабаны!';
                }, 2000);
            });
        }, 800);
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    
    // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ ==========
    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageName + 'Page').classList.add('active-page');
        if (pageName === 'profile') updateProfileUI();
        if (pageName === 'rating') updateRatingUI();
        if (pageName === 'wallet') updateWalletUI();
    }
    function hidePages() {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    }
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function init() {
        loadGameData();
        buildReels();
        updateBalanceUI();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        spinBtn.onclick = spin;
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => showPage(btn.dataset.page);
        });
        document.querySelectorAll('.close-page-btn').forEach(btn => {
            btn.onclick = hidePages;
        });
        
        let logoClick = null;
        document.querySelector('.logo').addEventListener('click', () => {
            if (logoClick) {
                clearTimeout(logoClick);
                logoClick = null;
                resetBalance();
            } else {
                logoClick = setTimeout(() => { logoClick = null; }, 300);
            }
        });
        
        function forceFullscreen() {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        }
        forceFullscreen();
        setInterval(forceFullscreen, 1500);
        
        if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
            userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        }
    }
    
    init();
    
    // Звёзды
    (function() {
        const starsDiv = document.getElementById('stars');
        for (let i = 0; i < 180; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 3 + 1;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            starsDiv.appendChild(s);
        }
    })();
</script>
</body>
</html>
