<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES | FINAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Космический фон на весь экран */
        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0f2a, #01010a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 0;
            position: relative;
        }
        /* Звёзды через псевдоэлемент */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 60px 90px, #ffd, rgba(0,0,0,0));
            background-size: 200px 200px, 150px 150px;
            background-repeat: repeat;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            margin: 20px auto;
            background: rgba(10, 12, 21, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 20px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }

        /* Шапка */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.6rem;
            color: #d4af37;
            text-align: center;
        }
        .balance {
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffdf80;
        }

        /* Игровые барабаны */
        .reels {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        .reel {
            background: #0b0f18;
            border-radius: 36px;
            padding: 20px 0;
            width: 100px;
            text-align: center;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 8px 20px black;
        }
        .reel-symbol {
            font-size: 68px;
            filter: drop-shadow(0 4px 6px black);
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
        }
        .win-active {
            background: rgba(212,175,55,0.8);
            color: black;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 15px 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
        }
        .spin-btn:active {
            transform: translateY(3px);
        }
        .nav {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .nav-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 40px;
            color: #d4af37;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(0,0,0,0.5);
            border-radius: 48px;
            padding: 20px;
            margin-top: 15px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            color: #ffdf80;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 20px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
            .logo h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top">
        <div class="logo">
            <h1>FERIES</h1>
            <p>COSMIC CASINO</p>
        </div>
        <div class="balance"><span id="balanceDisplay">1000</span></div>
    </div>

    <!-- Игровая зона -->
    <div class="reels">
        <div class="reel"><div class="reel-symbol" id="reel0">🍒</div></div>
        <div class="reel"><div class="reel-symbol" id="reel1">🍒</div></div>
        <div class="reel"><div class="reel-symbol" id="reel2">🍒</div></div>
    </div>
    <div class="win-area" id="winMessageArea">🎰 SPIN</div>
    <div class="bet-panel">
        <span>💰 СТАВКА</span>
        <div class="bet-control">
            <button id="betMinus">–</button>
            <span class="bet-value" id="betValue">25</span>
            <button id="betPlus">+</button>
        </div>
    </div>
    <button class="spin-btn" id="spinButton">🔮 SPIN</button>

    <!-- Навигация (заглушки) -->
    <div class="nav">
        <div class="nav-btn" id="profileBtn">👤 Профиль</div>
        <div class="nav-btn" id="ratingBtn">🏆 Рейтинг</div>
        <div class="nav-btn" id="walletBtn">💰 Кошелёк</div>
    </div>
    <div id="infoPanel" class="card" style="display: none;"></div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<script>
    // ========== ПЕРЕМЕННЫЕ ==========
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };

    // Символы для демо
    const symbolsSet = ['🍒', '🍊', '🍋', '🍉', '⭐'];
    const reels = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
    const balanceSpan = document.getElementById('balanceDisplay');
    const winMessageSpan = document.getElementById('winMessageArea');
    const betValueSpan = document.getElementById('betValue');

    // Функции
    function updateBalanceUI() {
        balanceSpan.innerText = balance;
    }

    function saveStats() {
        localStorage.setItem('feries_balance', balance);
        localStorage.setItem('feries_stats', JSON.stringify(stats));
    }

    function loadStats() {
        const savedBalance = localStorage.getItem('feries_balance');
        if (savedBalance && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('feries_stats');
        if (savedStats) {
            try { stats = JSON.parse(savedStats); } catch(e) {}
        }
        updateBalanceUI();
    }

    function getRandomSymbol() {
        return symbolsSet[Math.floor(Math.random() * symbolsSet.length)];
    }

    function setWinMessage(text, isWin = false) {
        winMessageSpan.innerText = text;
        if (isWin) winMessageSpan.classList.add('win-active');
        else winMessageSpan.classList.remove('win-active');
    }

    function calcWin(symbols, bet) {
        if (symbols[0] === symbols[1] && symbols[1] === symbols[2]) return bet * 5;
        if (symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }

    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        document.getElementById('spinButton').disabled = true;

        balance -= currentBet;
        updateBalanceUI();
        setWinMessage("🌀 Крутим...");

        // Анимация вращения всех барабанов
        let interval = setInterval(() => {
            for (let i = 0; i < 3; i++) {
                reels[i].innerText = getRandomSymbol();
            }
        }, 50);

        // Поочередная остановка
        const delays = [800, 1100, 1400];
        const finalSymbols = new Array(3);

        for (let i = 0; i < 3; i++) {
            setTimeout((idx) => {
                const sym = getRandomSymbol();
                reels[idx].innerText = sym;
                finalSymbols[idx] = sym;
                if (idx === 2) {
                    clearInterval(interval);
                    const win = calcWin(finalSymbols, currentBet);
                    if (win > 0) {
                        balance += win;
                        updateBalanceUI();
                        setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                        if (win > stats.maxWin) stats.maxWin = win;
                        stats.totalWin += win;
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else {
                        setWinMessage("😢 Проигрыш");
                    }
                    stats.games++;
                    saveStats();
                    spinning = false;
                    document.getElementById('spinButton').disabled = false;
                }
            }, delays[i], i);
        }
    }

    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betValueSpan.innerText = currentBet;
        }
    }

    function showProfile() {
        const panel = document.getElementById('infoPanel');
        panel.style.display = 'block';
        panel.innerHTML = `
            <div class="stat-row">⭐ Игр сыграно: ${stats.games}</div>
            <div class="stat-row">🏆 Макс. выигрыш: ${stats.maxWin}</div>
            <div class="stat-row">📈 Общий выигрыш: ${stats.totalWin}</div>
            <div class="stat-row">🆔 ID: ${Math.random().toString(36).substr(2, 8)}</div>
        `;
        setTimeout(() => panel.style.display = 'none', 4000);
    }

    function showRating() {
        const panel = document.getElementById('infoPanel');
        panel.style.display = 'block';
        panel.innerHTML = `<div class="stat-row">🌍 Топ игроков (демо)</div>
                           <div class="stat-row">1. Pharaoh 🐫 — 15400</div>
                           <div class="stat-row">2. Astronaut 🚀 — 12900</div>
                           <div class="stat-row">3. Satoshi ₿ — 11200</div>`;
        setTimeout(() => panel.style.display = 'none', 4000);
    }

    function showWallet() {
        const panel = document.getElementById('infoPanel');
        panel.style.display = 'block';
        panel.innerHTML = `<div class="wallet-balance" style="font-size:2rem; text-align:center;">💰 ${balance}</div>
                           <div style="text-align:center; margin-top:10px;">Пополнение через крипту скоро</div>`;
        setTimeout(() => panel.style.display = 'none', 4000);
    }

    // ========== ПОЛНОЭКРАННЫЙ РЕЖИМ ==========
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);

    // Инициализация
    window.onload = () => {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            forceFullscreen();
        }
        loadStats();
        document.getElementById('spinButton').onclick = spin;
        document.getElementById('betMinus').onclick = () => changeBet(-5);
        document.getElementById('betPlus').onclick = () => changeBet(5);
        document.getElementById('profileBtn').onclick = showProfile;
        document.getElementById('ratingBtn').onclick = showRating;
        document.getElementById('walletBtn').onclick = showWallet;
        forceFullscreen();
        // случайно не забыть скрыть панель
        setInterval(() => {
            const panel = document.getElementById('infoPanel');
            if (panel.style.display === 'block') setTimeout(() => panel.style.display = 'none', 3500);
        }, 1000);
    };
</script>
</body>
</html>
