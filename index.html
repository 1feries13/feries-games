<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Звездный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер — фиксированная ширина, без скролла */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            background: rgba(8, 10, 20, 0.65);
            backdrop-filter: blur(3px);
            border-radius: 48px;
            padding: 16px 16px 20px;
            border: 1px solid rgba(212,175,55,0.4);
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 12px 0;
            border-bottom: 1px solid #d4af37;
            margin-bottom: 16px;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 4px 16px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Таблица коэффициентов (встроена в экран) */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
        }
        .paytable span {
            color: #ffdf80;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Барабаны — полукруглые, с белой подложкой и золотой линией */
        .reels-container {
            background: #0b0f18;
            border-radius: 40px;
            padding: 20px 10px;
            margin-bottom: 16px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .reel {
            width: 100px;
            height: 240px;
            background: #ffffff10;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 0 0 2px #d4af37, 0 10px 20px black;
            position: relative;
        }
        /* Эффект закругления верха и низа (полукруглые края) */
        .reel::before,
        .reel::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(to bottom, #0b0f18, transparent);
            pointer-events: none;
            z-index: 2;
        }
        .reel::before {
            top: 0;
            border-radius: 28px 28px 0 0;
        }
        .reel::after {
            bottom: 0;
            background: linear-gradient(to top, #0b0f18, transparent);
            border-radius: 0 0 28px 28px;
        }
        /* Центральная золотая линия (выделение главной линии) */
        .reel-center-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #d4af37;
            transform: translateY(-50%);
            z-index: 3;
            box-shadow: 0 0 6px gold;
            pointer-events: none;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .reel-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            filter: drop-shadow(0 2px 4px black);
            background: #0b0f18;
            border-bottom: 1px solid #1e2a3a;
        }

        /* Информация о выигрыше */
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 10px;
            text-align: center;
            margin: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd966;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 12px gold;
        }

        /* Ставка и кнопка спина */
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 6px 16px;
            margin: 12px 0;
        }
        .bet-control {
            display: flex;
            gap: 16px;
            background: #1a212f;
            padding: 4px 16px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #ffd966;
            cursor: pointer;
            width: 36px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 8px 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Бургер-меню (в шапке) */
        .burger {
            width: 32px;
            height: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .burger span {
            display: block;
            height: 3px;
            background: #d4af37;
            border-radius: 3px;
        }
        .side-menu {
            position: fixed;
            top: 0;
            left: -260px;
            width: 240px;
            height: 100%;
            background: #0b0e18;
            border-right: 1px solid #d4af37;
            z-index: 1000;
            transition: left 0.3s;
            padding: 80px 20px;
        }
        .side-menu.open {
            left: 0;
        }
        .side-menu .menu-item {
            padding: 14px 0;
            font-size: 1.1rem;
            color: #ffdf80;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }

        /* Страницы профиля и т.д. (модально, поверх) */
        .page-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 400px;
            background: #1a1f2e;
            border-radius: 48px;
            padding: 24px;
            z-index: 1001;
            border: 1px solid #d4af37;
            display: none;
        }
        .page-card.visible {
            display: block;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        .close-card {
            background: #d4af37;
            border: none;
            padding: 10px;
            border-radius: 60px;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 16px;
        }
        @media (max-width: 550px) {
            .app { max-width: 98%; padding: 12px; }
            .reel { width: 85px; height: 210px; }
            .reel-symbol { height: 70px; font-size: 46px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="burger" id="burgerBtn"><span></span><span></span><span></span></div>
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- Таблица коэффициентов -->
    <div class="paytable" id="paytable"></div>

    <!-- Барабаны -->
    <div class="reels-container">
        <div class="reels" id="reels"></div>
    </div>

    <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
    <div class="bet-panel">
        <span>💰 СТАВКА</span>
        <div class="bet-control">
            <button id="betDec">–</button>
            <span class="bet-value" id="betAmount">25</span>
            <button id="betInc">+</button>
        </div>
    </div>
    <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Боковое меню -->
<div class="side-menu" id="sideMenu">
    <div class="menu-item" data-nav="profile">👤 Профиль</div>
    <div class="menu-item" data-nav="rating">🏆 Рейтинг</div>
    <div class="menu-item" data-nav="wallet">💰 Кошелёк</div>
</div>
<div class="overlay" id="overlay"></div>

<!-- Модальные карточки профиля, рейтинга, кошелька -->
<div id="profileCard" class="page-card"><div id="profileInfo"></div><button class="close-card">Закрыть</button></div>
<div id="ratingCard" class="page-card"><div id="ratingInfo"></div><button class="close-card">Закрыть</button></div>
<div id="walletCard" class="page-card"><div id="walletInfo"></div><button class="close-card">Закрыть</button></div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let reelsData = [];
    let reelStrips = [];
    let reelHeights = [];
    let animIntervals = [];

    // Символы и множители
    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 };

    // ========== СОХРАНЕНИЕ ==========
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() {
        document.getElementById('balanceValue').innerText = balance;
    }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const ratingList = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        ratingList.sort((a,b) => b.score - a.score);
        const html = ratingList.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        document.getElementById('winMessage').innerHTML = '💰 Баланс восстановлен';
        setTimeout(() => { if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!'; }, 1500);
    }

    // ========== ЛОГИКА ВЫИГРЫША ==========
    function calculateWin(symbolsList, bet) {
        const counts = {};
        for (let s of symbolsList) counts[s] = (counts[s] || 0) + 1;
        let win = 0, bonus = false;
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                let mult = multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonus = true;
                break;
            }
        }
        if (win === 0) {
            for (let [sym, cnt] of Object.entries(counts)) {
                if (cnt === 2) { win = Math.floor(bet * 1.2); break; }
            }
        }
        return { win, bonus };
    }

    // ========== ПОСТРОЕНИЕ БАРАБАНОВ (ДЛИННАЯ ЛЕНТА, БЕЗ ПУСТОТ) ==========
    function buildReels() {
        const container = document.getElementById('reels');
        container.innerHTML = '';
        reelsData = [];
        reelStrips = [];
        reelHeights = [0,0,0];
        animIntervals = [];

        for (let r = 0; r < 3; r++) {
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            // Добавляем центральную золотую линию
            const centerLine = document.createElement('div');
            centerLine.className = 'reel-center-line';
            reelDiv.appendChild(centerLine);
            
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            // Создаём длинную ленту (24 символа для непрерывности)
            const longSymbols = [];
            for (let i = 0; i < 24; i++) {
                longSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
            reelsData.push({
                symbols: longSymbols,
                currentPos: Math.floor(Math.random() * 24),
                symbolHeight: 0,
                stripHeight: 0
            });
            for (let i = 0; i < longSymbols.length; i++) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = longSymbols[i];
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            container.appendChild(reelDiv);
            reelStrips.push(stripDiv);
        }

        setTimeout(() => {
            for (let r = 0; r < 3; r++) {
                const strip = reelStrips[r];
                const firstSym = strip.querySelector('.reel-symbol');
                if (firstSym) {
                    const symHeight = firstSym.offsetHeight;
                    const totalHeight = strip.offsetHeight;
                    reelsData[r].symbolHeight = symHeight;
                    reelsData[r].stripHeight = totalHeight;
                    // Начальное смещение — чтобы 3-й символ (примерно) был по центру
                    const startOffset = -(reelsData[r].currentPos * symHeight) + 80;
                    reelHeights[r] = startOffset;
                    strip.style.transform = `translateY(${startOffset}px)`;
                }
            }
        }, 10);
    }

    function startSpinAnimation() {
        for (let r = 0; r < 3; r++) {
            const strip = reelStrips[r];
            const data = reelsData[r];
            if (!strip || !data) continue;
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            animIntervals[r] = setInterval(() => {
                reelHeights[r] = (reelHeights[r] + data.symbolHeight) % (data.stripHeight);
                strip.style.transform = `translateY(${reelHeights[r]}px)`;
            }, 40);
        }
    }

    function stopReel(r, finalSymbol, callback) {
        if (animIntervals[r]) clearInterval(animIntervals[r]);
        const strip = reelStrips[r];
        const data = reelsData[r];
        let targetIndex = 0;
        for (let i = 0; i < data.symbols.length; i++) {
            if (data.symbols[i] === finalSymbol) { targetIndex = i; break; }
        }
        const targetOffset = -(targetIndex * data.symbolHeight) + 80;
        reelHeights[r] = targetOffset;
        strip.style.transform = `translateY(${targetOffset}px)`;
        strip.style.transition = 'transform 0.25s ease-out';
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, 260);
    }

    function stopReelsSequentially(finalSymbols, onComplete) {
        let completed = 0;
        for (let r = 0; r < 3; r++) {
            setTimeout(() => {
                stopReel(r, finalSymbols[r], () => {
                    completed++;
                    if (completed === 3 && onComplete) onComplete(finalSymbols);
                });
            }, r * 250); // 0, 250, 500 мс
        }
    }

    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            document.getElementById('winMessage').innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        document.getElementById('winMessage').innerHTML = '🌀 Крутим...';
        document.getElementById('winMessage').classList.remove('active');
        startSpinAnimation();

        const finalSymbols = [];
        for (let r = 0; r < 3; r++) {
            finalSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
        }

        setTimeout(() => {
            stopReelsSequentially(finalSymbols, (results) => {
                const { win, bonus } = calculateWin(results, currentBet);
                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                    document.getElementById('winMessage').innerHTML = `✨ ВЫИГРЫШ: ${win} ✨`;
                    document.getElementById('winMessage').classList.add('active');
                    if (win > stats.maxWin) stats.maxWin = win;
                    stats.totalWin += win;
                    if (navigator.vibrate) navigator.vibrate(200);
                    if (bonus) {
                        setTimeout(() => alert('🌟 БОНУСНАЯ ИГРА! Скоро будет мини-игра.'), 300);
                    }
                } else {
                    document.getElementById('winMessage').innerHTML = '😢 Проигрыш';
                }
                stats.games++;
                updateProfileUI();
                saveGameData();
                updateRatingUI();
                updateWalletUI();
                spinning = false;
                spinBtn.disabled = false;
                setTimeout(() => {
                    if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!';
                }, 2000);
            });
        }, 800);
    }

    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }

    // ========== МЕНЮ И МОДАЛКИ ==========
    function setupMenu() {
        const burger = document.getElementById('burgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        function closeMenu() { sideMenu.classList.remove('open'); overlay.classList.remove('active'); }
        burger.onclick = () => { sideMenu.classList.toggle('open'); overlay.classList.toggle('active'); };
        overlay.onclick = closeMenu;

        const profileCard = document.getElementById('profileCard');
        const ratingCard = document.getElementById('ratingCard');
        const walletCard = document.getElementById('walletCard');
        const closeBtns = document.querySelectorAll('.close-card');
        function showCard(card) {
            closeAllCards();
            card.style.display = 'block';
            card.classList.add('visible');
            closeMenu();
        }
        function closeAllCards() {
            [profileCard, ratingCard, walletCard].forEach(c => { c.style.display = 'none'; c.classList.remove('visible'); });
        }
        document.querySelectorAll('.menu-item').forEach(item => {
            item.onclick = () => {
                const nav = item.dataset.nav;
                if (nav === 'profile') { updateProfileUI(); showCard(profileCard); }
                if (nav === 'rating') { updateRatingUI(); showCard(ratingCard); }
                if (nav === 'wallet') { updateWalletUI(); showCard(walletCard); }
            };
        });
        closeBtns.forEach(btn => btn.onclick = closeAllCards);
    }

    // ========== КОСМИЧЕСКИЙ ФОН ==========
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i=0; i<250; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();

    // ========== ТАБЛИЦА КОЭФФИЦИЕНТОВ ==========
    function fillPaytable() {
        const pt = document.getElementById('paytable');
        pt.innerHTML = `<span>🌟 x50</span><span>🚀 x5</span><span>👽 x4</span><span>🪐 x3</span><span>🌙 x2</span><span>⭐ x1.5</span>`;
    }

    // ========== ПОЛНОЭКРАННЫЙ РЕЖИМ ==========
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    window.onload = () => {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe?.user) userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
            forceFullscreen();
        }
        loadGameData();
        buildReels();
        fillPaytable();
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        document.getElementById('spinButton').onclick = spin;
        setupMenu();
        updateBalanceUI();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        forceFullscreen();
    };
</script>
</body>
</html>
