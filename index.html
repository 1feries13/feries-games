<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES – Космические слоты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Звездное небо */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starTwinkle 3s infinite alternate;
        }
        @keyframes starTwinkle {
            0% { opacity: 0.2; transform: scale(1); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #ffd966; }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.2), rgba(0,0,0,0));
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        /* Основное приложение – без скролла, весь экран */
        .app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 20, 0.7);
            backdrop-filter: blur(3px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #d4af37;
            flex-shrink: 0;
        }
        .logo h1 {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
        }
        .balance-box {
            background: #000000aa;
            border-radius: 60px;
            padding: 5px 18px;
            border: 1px solid #d4af37;
        }
        .balance-box span {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 8px 16px;
            margin: 8px 20px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }
        .paytable span {
            background: rgba(0,0,0,0.6);
            color: #ffdf80;
            padding: 4px 12px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* Игровой экран: квадратный контейнер для барабанов */
        .game-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            min-height: 0;
        }
        .slot-frame {
            background: linear-gradient(145deg, #1a1f2e, #0e121c);
            border-radius: 32px;
            padding: 20px 25px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 550px;
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        /* Каждый барабан – вертикальная карусель */
        .reel {
            width: 100px;
            height: 240px;
            background: #f5f5fa;
            background: linear-gradient(145deg, #f0f0f8, #e0e4ec);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 10px 20px black;
            position: relative;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .reel-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            font-weight: 400;
            text-shadow: 0 2px 3px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .reel-symbol:last-child {
            border-bottom: none;
        }
        /* Золотая линия выигрыша (центральная строка) */
        .win-line {
            position: absolute;
            top: 50%;
            left: -8px;
            right: -8px;
            transform: translateY(-50%);
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4af37, #ffd966, #d4af37, transparent);
            box-shadow: 0 0 10px gold;
            border-radius: 2px;
            pointer-events: none;
            transition: 0.2s;
            z-index: 5;
        }
        .win-line.active {
            box-shadow: 0 0 20px gold, 0 0 8px orange;
            background: linear-gradient(90deg, transparent, #ffd700, #fff0b5, #ffd700, transparent);
        }

        /* Сообщение о выигрыше */
        .win-message {
            background: rgba(212,175,55,0.15);
            border-radius: 40px;
            padding: 8px 16px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #ffdf80;
            margin: 10px 20px;
        }
        .win-message.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 12px gold;
        }

        /* Панель ставок */
        .bet-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 20px;
            margin: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #0c0f18;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
            margin: 10px 20px;
            flex-shrink: 0;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 12px;
            margin: 8px 20px 15px;
            flex-shrink: 0;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #5a6380;
            padding: 6px;
        }

        /* Модальные окна (профиль, рейтинг, кошелёк) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(145deg, #1a1f2e, #0e121c);
            border-radius: 56px;
            padding: 28px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #d4af37;
        }
        .modal-content h3 {
            color: #ffd966;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        .close-modal {
            background: none;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 550px) {
            .reel { width: 85px; height: 210px; }
            .reel-symbol { height: 70px; font-size: 46px; }
            .paytable span { font-size: 0.7rem; padding: 2px 8px; }
        }
    </style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance-box"><span id="balanceValue">1000</span></div>
    </div>

    <div class="paytable" id="paytable">
        <span>🌟 x50</span> <span>🚀 x5</span> <span>👽 x4</span> <span>🪐 x3</span> <span>🌙 x2</span> <span>⭐ x1.5</span>
    </div>

    <div class="game-screen">
        <div class="slot-frame">
            <div class="reels-container" id="reelsContainer">
                <!-- сюда будут вставлены барабаны -->
                <div class="win-line" id="winLine"></div>
            </div>
        </div>
    </div>

    <div class="win-message" id="winMsg">🌀 Крути барабаны!</div>

    <div class="bet-panel">
        <span>💰 СТАВКА</span>
        <div class="bet-control">
            <button id="betDec">–</button>
            <span class="bet-value" id="betAmount">25</span>
            <button id="betInc">+</button>
        </div>
    </div>
    <button class="spin-btn" id="spinBtn">🔮 SPIN</button>

    <div class="bottom-nav">
        <div class="nav-btn" data-modal="profile">👤 Профиль</div>
        <div class="nav-btn" data-modal="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-modal="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Модальные окна -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <h3>👤 Профиль</h3>
        <div id="profileInfo"></div>
        <button class="close-modal">Закрыть</button>
    </div>
</div>
<div id="ratingModal" class="modal">
    <div class="modal-content">
        <h3>🏆 Рейтинг</h3>
        <div id="ratingInfo"></div>
        <button class="close-modal">Закрыть</button>
    </div>
</div>
<div id="walletModal" class="modal">
    <div class="modal-content">
        <h3>💰 Кошелёк</h3>
        <div id="walletInfo"></div>
        <button class="close-modal">Закрыть</button>
    </div>
</div>

<script>
    // --------------------------------- ГЛОБАЛЬНЫЕ ДАННЫЕ ---------------------------------
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let userId = 'cosmic_' + Math.floor(Math.random() * 100000);

    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 };
    const winLineElement = document.getElementById('winLine');

    // DOM элементы
    const balanceSpan = document.getElementById('balanceValue');
    const winMsgSpan = document.getElementById('winMsg');
    const spinButton = document.getElementById('spinBtn');
    const betAmountSpan = document.getElementById('betAmount');
    const reelsContainer = document.getElementById('reelsContainer');

    // Структура барабанов (по 3 символа, отображаемых в каждое окно)
    let reelElements = [];      // DOM-элементы .reel
    let reelStrips = [];       // внутренние .reel-strip
    let currentPositions = [0, 0, 0]; // текущий translateY в px
    let animIntervals = [null, null, null];
    let finalSymbols = ['🪐', '🪐', '🪐']; // итоговые центральные символы

    // --------------------------------- СОЗДАНИЕ БАРАБАНОВ ---------------------------------
    function createReels() {
        reelsContainer.innerHTML = '';
        reelElements = [];
        reelStrips = [];
        // Убираем старую линию, если есть
        const oldLine = document.querySelector('.win-line');
        if (oldLine) oldLine.remove();
        
        for (let r = 0; r < 3; r++) {
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            // Заполняем полоску 12-ю случайными символами (для плавной прокрутки)
            for (let i = 0; i < 12; i++) {
                const sym = symbols[Math.floor(Math.random() * symbols.length)];
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = sym;
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            reelsContainer.appendChild(reelDiv);
            reelElements.push(reelDiv);
            reelStrips.push(stripDiv);
            currentPositions[r] = 0;
            stripDiv.style.transform = 'translateY(0px)';
        }
        // Добавляем золотую линию поверх
        const newLine = document.createElement('div');
        newLine.className = 'win-line';
        reelsContainer.appendChild(newLine);
        winLineElement.parentNode?.replaceChild(newLine, winLineElement);
        // обновляем ссылку
        // (мы её переопределим)
        window.winLine = newLine;
    }
    // обновим ссылку после создания
    let activeWinLine = null;

    function initReels() {
        createReels();
        activeWinLine = document.querySelector('.win-line');
    }

    // ------------------------------------------------------------------
    // АНИМАЦИЯ ВРАЩЕНИЯ (быстрая смена translateY)
    function startSpin() {
        for (let r = 0; r < 3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            const strip = reelStrips[r];
            const symbolHeight = 80; // px
            // Общее количество символов в полоске (12)
            const maxOffset = -(12 - 3) * symbolHeight; // чтобы не показывать пустоту
            animIntervals[r] = setInterval(() => {
                // двигаем вниз на 10px за тик
                currentPositions[r] += 12;
                if (currentPositions[r] > 0) currentPositions[r] = maxOffset;
                strip.style.transform = `translateY(${currentPositions[r]}px)`;
            }, 30);
        }
    }

    // --------------------------------------------------------------
    // Остановка одного барабана на заданной позиции (центральный символ)
    async function stopReel(reelIdx, targetCenterSymbol, withJump = false) {
        return new Promise((resolve) => {
            if (animIntervals[reelIdx]) clearInterval(animIntervals[reelIdx]);
            const strip = reelStrips[reelIdx];
            const symbolHeight = 80;
            const children = Array.from(strip.children); // массив DOM символов
            // Находим индекс символа, который должен быть в центре (второй видимый)
            let targetIndex = -1;
            for (let i = 0; i < children.length; i++) {
                if (children[i].innerText === targetCenterSymbol) {
                    targetIndex = i;
                    break;
                }
            }
            if (targetIndex === -1) targetIndex = 5; // fallback
            // Желаемое смещение: чтобы этот элемент оказался в центре (второй сверху)
            // Высота одного символа 80px, индекс 0 – самый верхний, нам нужен индекс targetIndex-1? 
            // В окне видно 3 символа: позиции (currentOffset/80) -> 0,1,2 по видимости.
            // Чтобы символ targetIndex оказался на позиции 1 (центр), нужно смещение = -(targetIndex-1)*80
            const targetOffset = -(targetIndex - 1) * symbolHeight;
            // Добавляем плавность
            strip.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
            strip.style.transform = `translateY(${targetOffset}px)`;
            currentPositions[reelIdx] = targetOffset;
            
            if (withJump) {
                // Эффект «торможения с перескоком»: через 0.1 с дергаем вниз, потом обратно
                setTimeout(() => {
                    strip.style.transition = 'transform 0.07s linear';
                    strip.style.transform = `translateY(${targetOffset + 12}px)`;
                    setTimeout(() => {
                        strip.style.transition = 'transform 0.15s ease-out';
                        strip.style.transform = `translateY(${targetOffset}px)`;
                        setTimeout(() => resolve(), 180);
                    }, 70);
                }, 120);
            } else {
                setTimeout(() => resolve(), 260);
            }
        });
    }

    // --------------------------------- ПООЧЕРЕДНАЯ ОСТАНОВКА ---------------------------------
    async function stopAllReelsSequentially(finalSymbolsArray) {
        // первый барабан
        await stopReel(0, finalSymbolsArray[0], false);
        // второй через 350 мс
        await new Promise(r => setTimeout(r, 380));
        await stopReel(1, finalSymbolsArray[1], false);
        // третий через 350 мс + эффект "торможения"
        await new Promise(r => setTimeout(r, 400));
        await stopReel(2, finalSymbolsArray[2], true);
    }

    // --------------------------------- ВЫИГРЫШ ---------------------------------
    function calculateWin(centerSymbols, bet) {
        const counts = {};
        for (let s of centerSymbols) counts[s] = (counts[s] || 0) + 1;
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                let mult = multipliers[sym] || 1;
                return { win: bet * mult, bonus: sym === '🌠' };
            }
        }
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 2) {
                return { win: Math.floor(bet * 1.2), bonus: false };
            }
        }
        return { win: 0, bonus: false };
    }

    // --------------------------------- ОСНОВНОЙ СПИН ---------------------------------
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            winMsgSpan.innerText = '❌ Не хватает монет!';
            winMsgSpan.classList.add('active');
            setTimeout(() => {
                if (!spinning) winMsgSpan.innerText = '🌀 Крути барабаны!';
                winMsgSpan.classList.remove('active');
            }, 1200);
            return;
        }
        spinning = true;
        spinButton.disabled = true;
        if (activeWinLine) activeWinLine.classList.remove('active');
        
        // списываем ставку
        balance -= currentBet;
        updateBalanceUI();
        winMsgSpan.innerText = '🌀 Крутим...';
        winMsgSpan.classList.remove('active');
        
        // Запускаем анимацию всех барабанов
        startSpin();
        
        // Генерируем честные финальные символы для центральной линии
        const finalCenter = [];
        for (let i = 0; i < 3; i++) {
            finalCenter.push(symbols[Math.floor(Math.random() * symbols.length)]);
        }
        
        // Ждём 0.7 секунды, чтобы барабаны покрутились
        await new Promise(r => setTimeout(r, 750));
        
        // Останавливаем по очереди
        await stopAllReelsSequentially(finalCenter);
        
        // После остановки всех – вычисляем выигрыш
        const { win, bonus } = calculateWin(finalCenter, currentBet);
        if (win > 0) {
            balance += win;
            updateBalanceUI();
            winMsgSpan.innerText = `✨ ВЫИГРЫШ: ${win} ✨`;
            winMsgSpan.classList.add('active');
            if (activeWinLine) activeWinLine.classList.add('active');
            if (win > stats.maxWin) stats.maxWin = win;
            stats.totalWin += win;
            if (navigator.vibrate) navigator.vibrate(200);
            if (bonus) {
                setTimeout(() => {
                    alert('🌟 БОНУСНАЯ ИГРА! 🌟\nСкоро здесь будет мини-игра с большим кушем.');
                }, 300);
            }
        } else {
            winMsgSpan.innerText = '😢 Проигрыш';
            winMsgSpan.classList.remove('active');
        }
        stats.games++;
        saveToLocal();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        
        spinning = false;
        spinButton.disabled = false;
        setTimeout(() => {
            if (!spinning) {
                winMsgSpan.innerText = '🌀 Крути барабаны!';
                winMsgSpan.classList.remove('active');
                if (activeWinLine) activeWinLine.classList.remove('active');
            }
        }, 2000);
    }

    // --------------------------------- ПРОЧИЕ ФУНКЦИИ ---------------------------------
    function updateBalanceUI() {
        balanceSpan.innerText = balance;
    }
    function saveToLocal() {
        localStorage.setItem('feries_balance', balance);
        localStorage.setItem('feries_stats', JSON.stringify(stats));
    }
    function loadFromLocal() {
        const savedBalance = localStorage.getItem('feries_balance');
        if (savedBalance && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('feries_stats');
        if (savedStats) try { stats = JSON.parse(savedStats); } catch(e) {}
        updateBalanceUI();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
    }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const topPlayers = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        topPlayers.sort((a,b) => b.score - a.score);
        const html = topPlayers.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveToLocal();
        updateProfileUI();
        updateRatingUI();
        winMsgSpan.innerText = '💰 Баланс восстановлен до 1000';
        winMsgSpan.classList.add('active');
        setTimeout(() => {
            if (!spinning) winMsgSpan.innerText = '🌀 Крути барабаны!';
            winMsgSpan.classList.remove('active');
        }, 1500);
    }

    // Модальные окна
    function showModal(id) {
        document.getElementById(id).classList.add('active');
    }
    function hideModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }
    
    // Изменение ставки
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }

    // --------------------------------------------------------------
    // ИНИЦИАЛИЗАЦИЯ
    function init() {
        initReels();
        loadFromLocal();
        // События
        document.getElementById('betDec').addEventListener('click', () => changeBet(-5));
        document.getElementById('betInc').addEventListener('click', () => changeBet(5));
        spinButton.addEventListener('click', spin);
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.dataset.modal + 'Modal';
                showModal(modalId);
            });
        });
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', hideModals);
        });
        // Сброс баланса двойным кликом по логотипу
        let logoClickTimer = null;
        const logo = document.querySelector('.logo');
        logo.addEventListener('click', () => {
            if (logoClickTimer) {
                clearTimeout(logoClickTimer);
                logoClickTimer = null;
                resetBalance();
            } else {
                logoClickTimer = setTimeout(() => { logoClickTimer = null; }, 300);
            }
        });
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        // полноэкранный режим (работает в WebView)
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
        }
    }
    
    // Звёзды
    (function generateStars() {
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            container.appendChild(star);
        }
    })();
    
    init();
</script>
</body>
</html>
