<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Звездный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер — фиксированная высота, скролл отключён */
        .app {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 10, 20, 0.65);
            backdrop-filter: blur(3px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 18px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 8px 16px;
            margin: 10px 20px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
        }
        .paytable span {
            color: #ffdf80;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Игровой экран */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 15px 20px;
        }
        .slot-frame {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.3);
        }
        /* Поле барабанов с центральной золотой линией */
        .reels-area {
            position: relative;
            background: #0b0f18;
            border-radius: 32px;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        /* Золотая линия по центру (выигрышная линия) */
        .reels-area::before {
            content: '';
            position: absolute;
            left: 5%;
            right: 5%;
            top: 50%;
            height: 3px;
            background: #d4af37;
            transform: translateY(-50%);
            z-index: 2;
            pointer-events: none;
            box-shadow: 0 0 8px gold;
        }
        /* Каждый барабан — контейнер с 3 видимыми слотами (плюс доп символы для прокрутки) */
        .reel {
            width: 100px;
            height: 210px;
            overflow: hidden;
            background: #0b0f18;
            border-radius: 20px;
            position: relative;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.3), 0 0 15px rgba(0,0,0,0.5);
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .reel-symbol {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            filter: drop-shadow(0 2px 4px black);
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 10px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd966;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 6px 18px;
            margin: 12px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 2px 15px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #ffd966;
            cursor: pointer;
            width: 35px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Нижнее меню (бургер на самом деле три кнопки) */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px;
            margin: 10px 20px 20px;
            border: 1px solid rgba(212,175,55,0.4);
        }
        .nav-btn {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Страницы профиля, рейтинга, кошелька (отдельные экраны) */
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }
        .page.active-page {
            display: flex;
        }
        .page-card {
            background: rgba(0,0,0,0.7);
            border-radius: 48px;
            padding: 28px;
            margin: 20px 0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
            font-size: 1rem;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #5a6380;
            padding: 10px;
        }
        @media (max-width: 550px) {
            .reel { width: 85px; height: 180px; }
            .reel-symbol { height: 60px; font-size: 42px; }
            .paytable span { font-size: 0.65rem; padding: 2px 6px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app" id="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>
    <div class="paytable" id="paytable"></div>
    <div class="game-container">
        <div class="slot-frame">
            <div class="reels-area" id="reelsArea">
                <!-- Три барабана будут созданы динамически -->
            </div>
            <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
            <div class="bet-panel">
                <span>💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betAmount">25</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinButton">🔮 SPIN</button>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-btn" data-page="profile">👤 Профиль</div>
        <div class="nav-btn" data-page="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-page="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- СТРАНИЦЫ -->
<div id="profilePage" class="page">
    <div class="page-card" id="profileInfo"></div>
    <button class="back-btn" id="backProfile">← Назад</button>
</div>
<div id="ratingPage" class="page">
    <div class="page-card" id="ratingInfo"></div>
    <button class="back-btn" id="backRating">← Назад</button>
</div>
<div id="walletPage" class="page">
    <div class="page-card" id="walletInfo"></div>
    <button class="back-btn" id="backWallet">← Назад</button>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    
    // Символы темы "Космос"
    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = {
        '🌠': 50,
        '🚀': 5,
        '👽': 4,
        '🪐': 3,
        '🌙': 2,
        '⭐': 1.5
    };
    
    // DOM элементы
    const balanceSpan = document.getElementById('balanceValue');
    const winMessageDiv = document.getElementById('winMessage');
    const spinBtn = document.getElementById('spinButton');
    const betDec = document.getElementById('betDec');
    const betInc = document.getElementById('betInc');
    const betAmountSpan = document.getElementById('betAmount');
    const reelsArea = document.getElementById('reelsArea');
    
    let reelsData = [];      // массив с данными каждого барабана
    let reelStrips = [];     // DOM .reel-strip
    let reelHeights = [0, 0, 0];
    let animIntervals = [null, null, null];
    
    // ========== ФУНКЦИИ БАЛАНСА И СТАТИСТИКИ ==========
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() { balanceSpan.innerText = balance; }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b) => b.score - a.score);
        const html = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Твой баланс:</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        winMessageDiv.innerHTML = '💰 Баланс восстановлен до 1000';
        setTimeout(() => { if (!spinning) winMessageDiv.innerHTML = '🌀 Крути барабаны!'; }, 1500);
    }
    
    // ========== ЛОГИКА ВЫИГРЫША ==========
    function calculateWin(symbolsList, bet) {
        const counts = {};
        for (let s of symbolsList) counts[s] = (counts[s] || 0) + 1;
        let win = 0;
        let bonusTrigger = false;
        for (let [sym, count] of Object.entries(counts)) {
            if (count === 3) {
                let mult = multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonusTrigger = true;
                break;
            }
        }
        if (win === 0) {
            for (let [sym, count] of Object.entries(counts)) {
                if (count === 2) {
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonusTrigger };
    }
    
    // ========== ПОСТРОЕНИЕ БАРАБАНОВ (без пустых мест) ==========
    function buildReels() {
        reelsArea.innerHTML = '';
        reelsData = [];
        reelStrips = [];
        reelHeights = [0, 0, 0];
        
        for (let r = 0; r < 3; r++) {
            // Создаём барабан
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            
            // Генерируем последовательность символов (30 штук, чтобы вращение было плавным)
            const sequence = [];
            for (let i = 0; i < 30; i++) {
                sequence.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
            reelsData.push({ symbols: sequence, currentPos: 0, symbolHeight: 0, stripHeight: 0 });
            
            for (let sym of sequence) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = sym;
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            reelsArea.appendChild(reelDiv);
            reelStrips.push(stripDiv);
        }
        
        // После рендера вычисляем высоту символа
        setTimeout(() => {
            for (let r = 0; r < 3; r++) {
                const firstSym = reelStrips[r]?.querySelector('.reel-symbol');
                if (firstSym) {
                    const symHeight = firstSym.offsetHeight;
                    const totalHeight = reelStrips[r].offsetHeight;
                    reelsData[r].symbolHeight = symHeight;
                    reelsData[r].stripHeight = totalHeight;
                    // Устанавливаем начальную позицию так, чтобы в центральной линии был случайный символ
                    const startPos = Math.floor(Math.random() * 30);
                    reelsData[r].currentPos = startPos;
                    const yOffset = -(startPos * symHeight) + 70; // смещение, чтобы выровнять
                    reelHeights[r] = yOffset;
                    reelStrips[r].style.transform = `translateY(${yOffset}px)`;
                }
            }
        }, 20);
    }
    
    // Запуск вращения (все барабаны быстро меняют позицию)
    function startSpinAnimation() {
        for (let r = 0; r < 3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            const strip = reelStrips[r];
            const data = reelsData[r];
            if (!strip || !data) continue;
            animIntervals[r] = setInterval(() => {
                // Каждый шаг увеличиваем позицию на высоту символа, зацикливаем
                reelHeights[r] = (reelHeights[r] + data.symbolHeight) % (data.stripHeight);
                strip.style.transform = `translateY(${reelHeights[r]}px)`;
            }, 50);
        }
    }
    
    // Остановка одного барабана на заданном символе
    function stopReel(reelIndex, targetSymbol, duration = 200, callback) {
        if (animIntervals[reelIndex]) clearInterval(animIntervals[reelIndex]);
        const strip = reelStrips[reelIndex];
        const data = reelsData[reelIndex];
        // Ищем индекс целевого символа в последовательности
        let targetIndex = 0;
        for (let i = 0; i < data.symbols.length; i++) {
            if (data.symbols[i] === targetSymbol) {
                targetIndex = i;
                break;
            }
        }
        const targetY = -(targetIndex * data.symbolHeight) + 70;
        reelHeights[reelIndex] = targetY;
        strip.style.transition = `transform ${duration}ms ease-out`;
        strip.style.transform = `translateY(${targetY}px)`;
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, duration);
    }
    
    // Остановка с эффектом "торможения" для правого барабана
    function stopReelWithBrake(reelIndex, targetSymbol, callback) {
        if (animIntervals[reelIndex]) clearInterval(animIntervals[reelIndex]);
        const strip = reelStrips[reelIndex];
        const data = reelsData[reelIndex];
        // Находим индекс целевого символа
        let targetIndex = 0;
        for (let i = 0; i < data.symbols.length; i++) {
            if (data.symbols[i] === targetSymbol) {
                targetIndex = i;
                break;
            }
        }
        const finalY = -(targetIndex * data.symbolHeight) + 70;
        // Сначала делаем вид, что останавливаемся на соседнем символе
        const fakeIndex = targetIndex - 1;
        const fakeY = -(fakeIndex * data.symbolHeight) + 70;
        strip.style.transition = 'transform 100ms ease-out';
        strip.style.transform = `translateY(${fakeY}px)`;
        setTimeout(() => {
            // Затем «перескакиваем» на конечный символ
            strip.style.transition = 'transform 200ms cubic-bezier(0.2, 1.3, 0.3, 1)';
            strip.style.transform = `translateY(${finalY}px)`;
            setTimeout(() => {
                strip.style.transition = '';
                if (callback) callback();
            }, 220);
        }, 120);
    }
    
    // Поочередная остановка с торможением последнего
    function stopReelsSequentially(finalSymbols, onComplete) {
        // Левая (индекс 0) — обычная остановка через 200 мс
        stopReel(0, finalSymbols[0], 200, () => {
            // Средняя (индекс 1) — остановка через 300 мс после начала
            stopReel(1, finalSymbols[1], 250, () => {
                // Правая (индекс 2) — с эффектом торможения
                stopReelWithBrake(2, finalSymbols[2], () => {
                    if (onComplete) onComplete(finalSymbols);
                });
            });
        });
    }
    
    // Основной спин
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            winMessageDiv.innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        spinBtn.disabled = true;
        
        // Списание ставки
        balance -= currentBet;
        updateBalanceUI();
        winMessageDiv.innerHTML = '🌀 Крутим...';
        winMessageDiv.classList.remove('active');
        
        // Запуск анимации
        startSpinAnimation();
        
        // Генерация финальных символов (честный рандом)
        const finalSymbols = [];
        for (let i = 0; i < 3; i++) {
            finalSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
        }
        
        // Задержка перед началом остановки (чтобы барабаны покрутились)
        setTimeout(() => {
            stopReelsSequentially(finalSymbols, (results) => {
                const { win, bonusTrigger } = calculateWin(results, currentBet);
                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                    winMessageDiv.innerHTML = `✨ ВЫИГРЫШ: ${win} ✨`;
                    winMessageDiv.classList.add('active');
                    if (win > stats.maxWin) stats.maxWin = win;
                    stats.totalWin += win;
                    if (navigator.vibrate) navigator.vibrate(200);
                    
                    if (bonusTrigger) {
                        setTimeout(() => {
                            alert('🌟 БОНУС! 🌟\nСекретная игра активирована!');
                        }, 300);
                    }
                } else {
                    winMessageDiv.innerHTML = '😢 Проигрыш';
                    winMessageDiv.classList.remove('active');
                }
                stats.games++;
                updateProfileUI();
                saveGameData();
                updateRatingUI();
                updateWalletUI();
                spinning = false;
                spinBtn.disabled = false;
                setTimeout(() => {
                    if (!spinning) winMessageDiv.innerHTML = '🌀 Крути барабаны!';
                }, 2000);
            });
        }, 800);
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    
    // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ ==========
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId + 'Page').classList.add('active-page');
    }
    function hidePages() {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
    }
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function init() {
        loadGameData();
        buildReels();
        
        // Таблица коэффициентов
        const paytableDiv = document.getElementById('paytable');
        paytableDiv.innerHTML = `
            <span>🌠 x50</span>
            <span>🚀 x5</span>
            <span>👽 x4</span>
            <span>🪐 x3</span>
            <span>🌙 x2</span>
            <span>⭐ x1.5</span>
        `;
        
        // Назначение обработчиков
        betDec.onclick = () => changeBet(-5);
        betInc.onclick = () => changeBet(5);
        spinBtn.onclick = spin;
        
        // Нижнее меню
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => {
                const page = btn.dataset.page;
                showPage(page);
                updateProfileUI();
                updateRatingUI();
                updateWalletUI();
            };
        });
        document.getElementById('backProfile').onclick = hidePages;
        document.getElementById('backRating').onclick = hidePages;
        document.getElementById('backWallet').onclick = hidePages;
        
        // Сброс баланса двойным кликом по лого
        let clickTimer = null;
        document.querySelector('.logo').addEventListener('click', () => {
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; resetBalance(); }
            else { clickTimer = setTimeout(() => { clickTimer = null; }, 300); }
        });
        
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
    }
    
    // Звездное небо
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();
    
    // Полноэкранный режим Telegram
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);
    
    if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    init();
</script>
</body>
</html>
