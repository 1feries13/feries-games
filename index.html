<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC CASINO — финальная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* ========== КОСМИЧЕСКИЙ ФОН ========== */
        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,200,0.9);
            animation: starGlow 2s infinite alternate;
        }
        @keyframes starGlow {
            0% { opacity: 0.3; transform: scale(1); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #ffd966; }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .app {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(8, 10, 20, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
            letter-spacing: 2px;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Экраны */
        .screen {
            display: none;
            flex: 1;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Приветственный экран */
        .welcome-card {
            background: rgba(0,0,0,0.5);
            border-radius: 56px;
            padding: 40px;
            text-align: center;
            margin-top: 30vh;
            border: 1px solid #d4af37;
        }
        .welcome-card h2 {
            font-size: 2rem;
            color: #ffdf80;
        }
        .btn-primary {
            background: linear-gradient(145deg, #d4af37, #b48b2c);
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 24px;
            cursor: pointer;
            width: 100%;
            max-width: 250px;
        }

        /* Меню выбора режимов и тематик */
        .modes-grid, .themes-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .mode-card, .theme-card {
            background: rgba(20,25,40,0.9);
            border-radius: 56px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            border: 1px solid #d4af37;
            transition: 0.1s;
        }
        .mode-card:active, .theme-card:active {
            transform: scale(0.98);
            background: #2a3448;
        }
        .mode-card .title, .theme-card .title {
            font-size: 1.2rem;
            color: #ffdf80;
        }

        /* Игровой экран — 3D-слоты */
        .slot-machine {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 25px 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.3);
            margin: 20px 0;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            perspective: 500px;
        }
        .reel {
            background: #0b0f18;
            border-radius: 28px;
            padding: 20px 0;
            width: 100px;
            text-align: center;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 10px 20px black;
            transform-style: preserve-3d;
            transition: transform 0.2s;
        }
        .reel-symbol {
            font-size: 68px;
            filter: drop-shadow(0 4px 6px black);
            display: inline-block;
            transition: transform 0.1s ease;
        }
        /* 3D-эффект при наведении на барабан */
        .reel:hover {
            transform: translateZ(10px);
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
            transition: 0.1s;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 12px 16px;
            margin-top: 15px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .paytable span {
            color: #ffdf80;
            background: rgba(0,0,0,0.4);
            padding: 4px 8px;
            border-radius: 20px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px;
            margin: 20px 10px;
            border: 1px solid #d4af37;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Страницы профиля, рейтинга, кошелька */
        .page-card {
            background: rgba(0,0,0,0.6);
            border-radius: 48px;
            padding: 28px;
            margin-top: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 15px;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 40px;
            color: #d4af37;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
            .logo h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC CASINO</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
            <h2>Добро пожаловать в космос!</h2>
            <button class="btn-primary" id="startBtn">🚀 Играть</button>
        </div>
        <footer>Ваши данные под защитой галактики</footer>
    </div>

    <!-- ЭКРАН ВЫБОРА РЕЖИМА -->
    <div id="modesScreen" class="screen">
        <div class="modes-grid">
            <div class="mode-card" data-mode="classic"><span class="title">🎰 CLASSIC SLOT</span><span>Активен</span></div>
            <div class="mode-card" data-mode="5lines"><span class="title">🎰 5 LINES</span><span>Скоро</span></div>
            <div class="mode-card" data-mode="3x3"><span class="title">🎰 3x3 GRID</span><span>Скоро</span></div>
        </div>
        <footer>Выберите режим</footer>
    </div>

    <!-- ЭКРАН ВЫБОРА ТЕМЫ -->
    <div id="themesScreen" class="screen">
        <div class="themes-grid" id="themesGrid"></div>
        <footer>Выберите вселенную</footer>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="gameScreen" class="screen">
        <div class="slot-machine">
            <div class="reels">
                <div class="reel"><div class="reel-symbol" id="r0">🪐</div></div>
                <div class="reel"><div class="reel-symbol" id="r1">🪐</div></div>
                <div class="reel"><div class="reel-symbol" id="r2">🪐</div></div>
            </div>
            <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
            <div class="bet-panel">
                <span>💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betAmount">25</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinButton">🔮 SPIN</button>
            <div class="paytable" id="paytable"></div>
        </div>
        <button class="back-btn" id="backToThemesBtn">← Назад к темам</button>
    </div>

    <!-- СТРАНИЦА ПРОФИЛЯ -->
    <div id="profileScreen" class="screen">
        <div class="page-card" id="profileInfo"></div>
        <button class="back-btn" id="backFromProfile">← Назад в игру</button>
    </div>

    <!-- СТРАНИЦА РЕЙТИНГА -->
    <div id="ratingScreen" class="screen">
        <div class="page-card" id="ratingInfo"></div>
        <button class="back-btn" id="backFromRating">← Назад в игру</button>
    </div>

    <!-- СТРАНИЦА КОШЕЛЬКА -->
    <div id="walletScreen" class="screen">
        <div class="page-card" id="walletInfo"></div>
        <button class="back-btn" id="backFromWallet">← Назад в игру</button>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ (видна только в игре и темах) -->
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-btn" data-nav="profile">👤 Профиль</div>
        <div class="nav-btn" data-nav="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-nav="wallet">💰 Кошелёк</div>
    </div>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let currentTheme = 'cosmic';
    let currentSymbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    
    // Таблица коэффициентов (для 3 одинаковых)
    const multipliers = {
        '🌠': 50,   // секретный символ — бонусная игра
        '☀️': 10,   // солнце (будет в теме)
        '🚀': 5,
        '🪐': 3,
        '🌙': 2,
        '⭐': 1.5,
        '👽': 4
    };
    
    // Конфигурация тем (3 темы с уникальными символами)
    const themes = {
        cosmic: {
            name: '🌌 КОСМОС',
            symbols: ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'],
            multipliers: { '🌠': 50, '🚀': 5, '🪐': 3, '🌙': 2, '⭐': 1.5, '👽': 4 },
            paytable: '🌠 x50 | 🚀 x5 | 👽 x4 | 🪐 x3 | 🌙 x2 | ⭐ x1.5'
        },
        crypto: {
            name: '₿ КРИПТО-КОСМОС',
            symbols: ['₿', 'Ξ', 'Ł', '💎', '🔗', '🌠'],
            multipliers: { '🌠': 50, '₿': 6, 'Ξ': 4, 'Ł': 3, '💎': 2, '🔗': 1.5 },
            paytable: '🌠 x50 | ₿ x6 | Ξ x4 | Ł x3 | 💎 x2 | 🔗 x1.5'
        },
        egypt: {
            name: '🔺 ЕГИПЕТ-КОСМОС',
            symbols: ['🐫', '👑', '𓂀', '🦂', '🌞', '🌠'],
            multipliers: { '🌠': 50, '🌞': 10, '👑': 5, '𓂀': 4, '🐫': 2, '🦂': 1.5 },
            paytable: '🌠 x50 | 🌞 x10 | 👑 x5 | 𓂀 x4 | 🐫 x2 | 🦂 x1.5'
        }
    };
    
    // DOM элементы
    const screens = {
        welcome: document.getElementById('welcomeScreen'),
        modes: document.getElementById('modesScreen'),
        themes: document.getElementById('themesScreen'),
        game: document.getElementById('gameScreen'),
        profile: document.getElementById('profileScreen'),
        rating: document.getElementById('ratingScreen'),
        wallet: document.getElementById('walletScreen')
    };
    const balanceSpan = document.getElementById('balanceValue');
    const winDiv = document.getElementById('winMessage');
    const spinBtn = document.getElementById('spinButton');
    const betDec = document.getElementById('betDec');
    const betInc = document.getElementById('betInc');
    const betAmountSpan = document.getElementById('betAmount');
    const reels = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const bottomNav = document.getElementById('bottomNav');
    
    // ========== ФУНКЦИИ СОХРАНЕНИЯ ==========
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
        localStorage.setItem('cosmic_theme', currentTheme);
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        const t = localStorage.getItem('cosmic_theme');
        if (t && themes[t]) currentTheme = t;
        updateBalanceUI();
    }
    function updateBalanceUI() { balanceSpan.innerText = balance; }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        const html = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс:</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        winDiv.innerHTML = '💰 Баланс восстановлен до 1000';
    }
    
    // ========== ЛОГИКА ВЫИГРЫША (точные правила) ==========
    function calculateWin(symbols, bet) {
        const counts = {};
        for (let s of symbols) counts[s] = (counts[s] || 0) + 1;
        const themeData = themes[currentTheme];
        let win = 0;
        let bonusTrigger = false;
        
        // Проверяем 3 одинаковых
        for (let [sym, count] of Object.entries(counts)) {
            if (count === 3) {
                let mult = themeData.multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonusTrigger = true;
                break;
            }
        }
        // Если нет 3 одинаковых, проверяем 2 одинаковых (любая пара)
        if (win === 0) {
            for (let [sym, count] of Object.entries(counts)) {
                if (count === 2) {
                    let mult = themeData.multipliers[sym] || 1;
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonusTrigger };
    }
    
    function setWinMessage(text, isWin = false) {
        winDiv.innerHTML = text;
        if (isWin) winDiv.classList.add('active');
        else winDiv.classList.remove('active');
    }
    
    // ========== АНИМАЦИЯ И ПООЧЕРЕДНАЯ ОСТАНОВКА ==========
    let spinInterval = null;
    function startSpinAnimation() {
        const syms = themes[currentTheme].symbols;
        spinInterval = setInterval(() => {
            for (let i=0; i<3; i++) {
                reels[i].innerText = syms[Math.floor(Math.random() * syms.length)];
            }
        }, 50);
    }
    
    function stopReelSequentially(callback) {
        const syms = themes[currentTheme].symbols;
        const finalSymbols = new Array(3);
        const delays = [800, 1100, 1400]; // мс
        for (let i=0; i<3; i++) {
            setTimeout((idx) => {
                const fs = syms[Math.floor(Math.random() * syms.length)];
                reels[idx].innerText = fs;
                finalSymbols[idx] = fs;
                if (idx === 2) {
                    clearInterval(spinInterval);
                    callback(finalSymbols);
                }
            }, delays[i], i);
        }
    }
    
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        spinBtn.disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        setWinMessage("🌀 Крутим...", false);
        startSpinAnimation();
        
        stopReelSequentially((finalSymbols) => {
            const { win, bonusTrigger } = calculateWin(finalSymbols, currentBet);
            if (win > 0) {
                balance += win;
                updateBalanceUI();
                setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                if (win > stats.maxWin) stats.maxWin = win;
                stats.totalWin += win;
                if (navigator.vibrate) navigator.vibrate(200);
                if (bonusTrigger) {
                    setTimeout(() => {
                        alert('🌟 БОНУСНАЯ ИГРА АКТИВИРОВАНА! 🌟\nСкоро здесь будет мини-игра с большим кушем.');
                    }, 300);
                }
            } else {
                setWinMessage("😢 Проигрыш", false);
            }
            stats.games++;
            updateProfileUI();
            saveGameData();
            updateRatingUI();
            updateWalletUI();
            spinning = false;
            spinBtn.disabled = false;
        });
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    
    // ========== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ==========
    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        if (name === 'game' || name === 'themes' || name === 'profile' || name === 'rating' || name === 'wallet') {
            bottomNav.style.display = 'flex';
        } else {
            bottomNav.style.display = 'none';
        }
        if (name === 'game') {
            const themeData = themes[currentTheme];
            document.getElementById('paytable').innerHTML = `<span>💰 ${themeData.paytable}</span>`;
            for (let i=0; i<3; i++) reels[i].innerText = themeData.symbols[0];
            updateBalanceUI();
        }
        if (name === 'profile') updateProfileUI();
        if (name === 'rating') updateRatingUI();
        if (name === 'wallet') updateWalletUI();
    }
    
    // Построение меню тем
    function buildThemesMenu() {
        const container = document.getElementById('themesGrid');
        container.innerHTML = '';
        for (const [key, theme] of Object.entries(themes)) {
            const card = document.createElement('div');
            card.className = 'theme-card';
            card.innerHTML = `<span class="title">${theme.name}</span><span>${theme.symbols[0]}</span>`;
            card.onclick = () => {
                currentTheme = key;
                saveGameData();
                showScreen('game');
            };
            container.appendChild(card);
        }
    }
    
    // ========== НАВИГАЦИЯ ПО НИЖНЕМУ МЕНЮ ==========
    function setupNavigation() {
        document.getElementById('startBtn').onclick = () => showScreen('modes');
        document.getElementById('backToThemesBtn').onclick = () => showScreen('themes');
        document.getElementById('backFromProfile').onclick = () => showScreen('game');
        document.getElementById('backFromRating').onclick = () => showScreen('game');
        document.getElementById('backFromWallet').onclick = () => showScreen('game');
        document.querySelectorAll('.mode-card').forEach(card => {
            card.onclick = () => {
                if (card.dataset.mode === 'classic') {
                    buildThemesMenu();
                    showScreen('themes');
                } else alert('Этот режим скоро появится!');
            };
        });
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => {
                const nav = btn.dataset.nav;
                if (nav === 'profile') showScreen('profile');
                if (nav === 'rating') showScreen('rating');
                if (nav === 'wallet') showScreen('wallet');
            };
        });
        betDec.onclick = () => changeBet(-5);
        betInc.onclick = () => changeBet(5);
        spinBtn.onclick = spin;
    }
    
    // Сброс баланса двойным кликом по логотипу
    let clickTimer = null;
    document.querySelector('.logo').addEventListener('click', () => {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; resetBalance(); }
        else { clickTimer = setTimeout(() => { clickTimer = null; }, 300); }
    });
    
    // Звёзды
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i=0; i<250; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();
    
    // Полноэкранный режим
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);
    
    // Получение ID пользователя Telegram
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    // Инициализация
    loadGameData();
    buildThemesMenu();
    setupNavigation();
    showScreen('welcome');
    forceFullscreen();
</script>
</body>
</html>
