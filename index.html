<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC CASINO</title>
    <!-- Стили slot-machine-gen -->
    <link rel="stylesheet" href="https://unpkg.com/slot-machine-gen@1.3.8/dist/slot-machine.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* ========== КОСМИЧЕСКИЙ ФОН ========== */
        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,200,0.9);
            animation: starGlow 2s infinite alternate;
        }
        @keyframes starGlow {
            0% { opacity: 0.3; transform: scale(1); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #ffd966; }
        }
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120, 80, 200, 0.25), rgba(0, 0, 0, 0));
            filter: blur(40px);
            pointer-events: none;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .app {
            position: relative;
            z-index: 1;
            max-width: 550px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        /* Золотая шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.5);
            margin-bottom: 20px;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
            text-align: center;
        }
        .balance-box {
            background: #000000aa;
            border-radius: 60px;
            padding: 8px 20px;
            text-align: center;
        }
        .balance-box span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Слот-машина */
        .slot-container {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 25px 15px;
            margin: 20px 0;
            border: 1px solid #d4af37;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #slot-machine {
            margin: 0 auto;
            text-align: center;
        }

        /* Панель ставок */
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 20px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px;
            margin-top: auto;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Всплывающие окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1f2e;
            border-radius: 48px;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #d4af37;
        }
        .modal-content h3 {
            color: #ffd966;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .close-modal {
            background: #d4af37;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 15px;
        }
        @media (max-width: 500px) {
            .app { padding: 15px; }
            .logo h1 { font-size: 1.3rem; }
            .balance-box span { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="top-bar">
        <div class="logo"><h1>FERIES</h1><p>COSMIC CASINO</p></div>
        <div class="balance-box"><span id="balanceValue">1000</span></div>
    </div>

    <div class="slot-container">
        <div id="slot-machine"></div>
        <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
        <div class="bet-panel">
            <span>💰 СТАВКА</span>
            <div class="bet-control">
                <button id="betMinus">–</button>
                <span class="bet-value" id="betAmount">25</span>
                <button id="betPlus">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" data-modal="profile">👤 Профиль</div>
        <div class="nav-btn" data-modal="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-modal="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Модальные окна -->
<div id="profileModal" class="modal"><div class="modal-content"><h3>👤 Профиль</h3><div id="profileInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="ratingModal" class="modal"><div class="modal-content"><h3>🏆 Рейтинг</h3><div id="ratingInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="walletModal" class="modal"><div class="modal-content"><h3>💰 Кошелёк</h3><div id="walletInfo"></div><button class="close-modal">Закрыть</button></div></div>

<script src="https://unpkg.com/slot-machine-gen@1.3.8/dist/slot-machine.min.js"></script>
<script>
    // --- Данные игрока ---
    let balance = 1000;
    let currentBet = 25;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let spinning = false;
    let slotMachine = null;

    // --- Конфигурация слотов (твое уникальное наполнение) ---
    const reelsConfig = [
        { // Барабан 1
            imageSrc: '', // Пока пусто, используем символы
            symbols: [
                { title: '🪐', position: 100, weight: 2 },
                { title: '🚀', position: 300, weight: 3 },
                { title: '🌙', position: 500, weight: 4 },
                { title: '⭐', position: 700, weight: 5 },
                { title: '👽', position: 900, weight: 1 },
                { title: '🌌', position: 1100, weight: 3 }
            ]
        },
        { // Барабан 2
            imageSrc: '',
            symbols: [
                { title: '🪐', position: 100, weight: 2 },
                { title: '🚀', position: 300, weight: 3 },
                { title: '🌙', position: 500, weight: 4 },
                { title: '⭐', position: 700, weight: 5 },
                { title: '👽', position: 900, weight: 1 },
                { title: '🌌', position: 1100, weight: 3 }
            ]
        },
        { // Барабан 3
            imageSrc: '',
            symbols: [
                { title: '🪐', position: 100, weight: 2 },
                { title: '🚀', position: 300, weight: 3 },
                { title: '🌙', position: 500, weight: 4 },
                { title: '⭐', position: 700, weight: 5 },
                { title: '👽', position: 900, weight: 1 },
                { title: '🌌', position: 1100, weight: 3 }
            ]
        }
    ];

    // --- Функция расчета выигрыша ---
    function calculateWin(symbols, bet) {
        const titles = symbols.map(s => s.title);
        if (titles[0] === titles[1] && titles[1] === titles[2]) return bet * 5;
        if (titles[0] === titles[1] || titles[1] === titles[2] || titles[0] === titles[2]) return Math.floor(bet * 1.2);
        return 0;
    }

    // --- Обновление UI ---
    function updateBalanceUI() {
        document.getElementById('balanceValue').innerText = balance;
    }

    function updateProfileUI() {
        const info = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId || 'Космический странник'}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = info;
    }

    function updateRatingUI() {
        const ratingList = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId || 'FERIES Player', score: balance }
        ];
        ratingList.sort((a,b) => b.score - a.score);
        const html = ratingList.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }

    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="wallet-balance" style="font-size:2rem; text-align:center;">💰 ${balance}</div>`;
    }

    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }

    function loadGameData() {
        const savedBalance = localStorage.getItem('cosmic_balance');
        if (savedBalance && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('cosmic_stats');
        if (savedStats) try { stats = JSON.parse(savedStats); } catch(e) {}
        updateBalanceUI();
    }

    // --- Callback после вращения ---
    function spinCallback(resultSymbols) {
        const winAmount = calculateWin(resultSymbols, currentBet);
        const messageEl = document.getElementById('winMessage');
        
        if (winAmount > 0) {
            balance += winAmount;
            updateBalanceUI();
            messageEl.innerHTML = `✨ ВЫИГРЫШ: ${winAmount} ✨`;
            messageEl.style.background = 'rgba(212,175,55,0.7)';
            if (winAmount > stats.maxWin) stats.maxWin = winAmount;
            stats.totalWin += winAmount;
            if (navigator.vibrate) navigator.vibrate(200);
        } else {
            messageEl.innerHTML = '😢 Проигрыш';
            messageEl.style.background = 'rgba(212,175,55,0.15)';
        }
        stats.games++;
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        spinning = false;
        document.getElementById('spinButton').disabled = false;
    }

    // --- Инициализация слотов ---
    function initSlotMachine() {
        if (slotMachine) slotMachine.destroy();
        slotMachine = new SlotMachine(
            '#slot-machine',
            reelsConfig,
            spinCallback,
            {
                animSpeed: 1200,
                click2Spin: false,
                reelHeight: 1320,
                reelWidth: 200,
                slotYAxis: 0
            }
        );
    }

    // --- Функция вращения ---
    function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            document.getElementById('winMessage').innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        document.getElementById('spinButton').disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        document.getElementById('winMessage').innerHTML = '🌀 Крутим...';
        slotMachine.play();
    }

    // --- Изменение ставки ---
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }

    // --- Модальные окна ---
    let userId = null;
    function setupModals() {
        const modals = document.querySelectorAll('.modal');
        const navBtns = document.querySelectorAll('.nav-btn');
        
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.dataset.modal + 'Modal';
                const modal = document.getElementById(modalId);
                if (modal) {
                    if (modalId === 'profileModal') updateProfileUI();
                    if (modalId === 'ratingModal') updateRatingUI();
                    if (modalId === 'walletModal') updateWalletUI();
                    modal.style.display = 'flex';
                }
            });
        });
        
        modals.forEach(modal => {
            const closeBtn = modal.querySelector('.close-modal');
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
    }

    // --- Космический фон ---
    function createStars() {
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsContainer.appendChild(star);
        }
    }
    createStars();

    // --- Полноэкранный режим Telegram ---
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.requestFullscreen) {
                window.Telegram.WebApp.requestFullscreen().catch(e => console.warn(e));
            }
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);

    // --- Инициализация ---
    window.onload = () => {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            if (window.Telegram.WebApp.initDataUnsafe?.user) {
                userId = window.Telegram.WebApp.initDataUnsafe.user.username || 'Космический странник';
            }
            forceFullscreen();
        }
        loadGameData();
        initSlotMachine();
        setupModals();
        
        document.getElementById('betMinus').addEventListener('click', () => changeBet(-5));
        document.getElementById('betPlus').addEventListener('click', () => changeBet(5));
        document.getElementById('spinButton').addEventListener('click', spin);
        
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        forceFullscreen();
    };
</script>
</body>
</html>
