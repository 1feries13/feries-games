<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES | Космический слот</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Звёздный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер */
        .app {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(8, 10, 20, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
        }

        /* Шапка с балансом */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            border: 1px solid rgba(212,175,55,0.5);
            margin-bottom: 20px;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 18px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .paytable span {
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 30px;
            color: #ffdf80;
            font-weight: bold;
            font-size: 0.85rem;
        }

        /* Экран слота (корпус) */
        .slot-cabinet {
            background: linear-gradient(145deg, #1e2438, #0f121e);
            border-radius: 48px;
            padding: 20px 15px;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.3), 0 15px 25px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        /* Контейнер с тремя барабанами */
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #03060c;
            border-radius: 32px;
            padding: 15px 10px;
            position: relative;
        }

        /* Полукруглый барабан с тенью */
        .reel {
            width: 100px;
            height: 260px;
            background: #0b0f18;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 8px 30px black;
        }
        /* Центральная линия (подсвеченная зона выплат) */
        .reels-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10px;
            right: 10px;
            height: 80px;
            transform: translateY(-50%);
            background: rgba(212,175,55,0.25);
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(212,175,55,0.8);
            pointer-events: none;
            z-index: 2;
            border-top: 2px solid gold;
            border-bottom: 2px solid gold;
        }

        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
            will-change: transform;
        }

        .reel-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            filter: drop-shadow(0 2px 4px black);
        }

        /* Окно выигрыша */
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 20px 0 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
            transition: 0.1s;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }

        /* Панель ставки */
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }

        /* Кнопка SPIN */
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
            margin-top: 10px;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }

        /* Нижнее меню */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid rgba(212,175,55,0.4);
        }
        .nav-btn {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Страницы (профиль, рейтинг, кошелёк) */
        .page-card {
            background: rgba(0,0,0,0.6);
            border-radius: 48px;
            padding: 25px;
            margin: 20px 0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding-top: 15px;
        }

        @media (max-width: 550px) {
            .reel { width: 85px; height: 225px; }
            .reel-symbol { height: 75px; font-size: 46px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- Таблица коэффициентов -->
    <div class="paytable" id="paytable"></div>

    <!-- Основной слот -->
    <div class="slot-cabinet">
        <div class="reels-container" id="reelsContainer">
            <!-- 3 барабана будут добавлены скриптом -->
        </div>

        <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>

        <div class="bet-panel">
            <span>💰 СТАВКА</span>
            <div class="bet-control">
                <button id="betDec">–</button>
                <span class="bet-value" id="betAmount">25</span>
                <button id="betInc">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-btn" data-nav="profile">👤 Профиль</div>
        <div class="nav-btn" data-nav="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-nav="wallet">💰 Кошелёк</div>
    </div>

    <!-- Скрытые страницы -->
    <div id="profileScreen" class="page-card" style="display: none;">
        <div id="profileInfo"></div>
        <button class="back-btn" id="backFromProfile">← Назад</button>
    </div>
    <div id="ratingScreen" class="page-card" style="display: none;">
        <div id="ratingInfo"></div>
        <button class="back-btn" id="backFromRating">← Назад</button>
    </div>
    <div id="walletScreen" class="page-card" style="display: none;">
        <div id="walletInfo"></div>
        <button class="back-btn" id="backFromWallet">← Назад</button>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<script>
    // ---------- ГЛОБАЛЬНЫЕ ДАННЫЕ ----------
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };

    // Символы и множители (космическая тема)
    const SYMBOLS = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const MULTIPLIERS = {
        '🌠': 50,
        '🚀': 5,
        '👽': 4,
        '🪐': 3,
        '🌙': 2,
        '⭐': 1.5
    };

    // Хранилище для DOM барабанов и таймеров
    let reelStrips = [];
    let reelHeights = [];
    let animIntervals = [];
    let reelSymbolsList = []; // массив массивов символов для каждого барабана

    // ---------- ФУНКЦИИ РАБОТЫ С ДАННЫМИ ----------
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() {
        document.getElementById('balanceValue').innerText = balance;
    }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        const html = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Твой баланс:</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        const msgDiv = document.getElementById('winMessage');
        msgDiv.innerHTML = '💰 Баланс восстановлен до 1000';
        setTimeout(() => {
            if (!spinning) msgDiv.innerHTML = '🌀 Крути барабаны!';
        }, 1500);
    }

    // ---------- ЛОГИКА ВЫИГРЫША ----------
    function calculateWin(symbolsList, bet) {
        const counts = {};
        for (let s of symbolsList) counts[s] = (counts[s] || 0) + 1;
        let win = 0;
        let bonus = false;
        // Три одинаковых
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                win = bet * (MULTIPLIERS[sym] || 1);
                if (sym === '🌠') bonus = true;
                break;
            }
        }
        // Если нет трёх — два одинаковых дают x1.2
        if (win === 0) {
            for (let cnt of Object.values(counts)) {
                if (cnt === 2) {
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonus };
    }

    // ---------- ПОСТРОЕНИЕ БАРАБАНОВ (ВЕРТИКАЛЬНАЯ ЛЕНТА) ----------
    function buildReels() {
        const container = document.getElementById('reelsContainer');
        container.innerHTML = '';
        reelStrips = [];
        reelHeights = [];
        animIntervals = [];
        reelSymbolsList = [];

        for (let r = 0; r < 3; r++) {
            // Создаём 15-20 случайных символов для ленты
            const symCount = 18;
            const symbolsArray = [];
            for (let i = 0; i < symCount; i++) {
                symbolsArray.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
            }
            reelSymbolsList.push(symbolsArray);

            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const strip = document.createElement('div');
            strip.className = 'reel-strip';
            for (let i = 0; i < symbolsArray.length; i++) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = symbolsArray[i];
                strip.appendChild(symDiv);
            }
            reelDiv.appendChild(strip);
            container.appendChild(reelDiv);
            reelStrips.push(strip);
            reelHeights.push(0);
        }

        // Подождём, чтобы браузер рассчитал высоту, затем зададим начальную позицию (чтобы случайный символ оказался в центре)
        setTimeout(() => {
            for (let r = 0; r < 3; r++) {
                const strip = reelStrips[r];
                const firstSym = strip.querySelector('.reel-symbol');
                if (firstSym) {
                    const symHeight = firstSym.offsetHeight;
                    const totalHeight = strip.offsetHeight;
                    // Стартовая позиция: случайный сдвиг, чтобы центральная линия показывала случайный символ
                    const randIndex = Math.floor(Math.random() * reelSymbolsList[r].length);
                    const startY = -(randIndex * symHeight) + 90; // +90 для выравнивания по центру
                    reelHeights[r] = startY;
                    strip.style.transform = `translateY(${startY}px)`;
                }
            }
        }, 20);
    }

    // Запуск анимации (быстрая смена позиции каждые 30 мс)
    function startSpinning() {
        for (let r = 0; r < 3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            const strip = reelStrips[r];
            const symHeight = strip.querySelector('.reel-symbol')?.offsetHeight || 80;
            animIntervals[r] = setInterval(() => {
                // Увеличиваем смещение на высоту одного символа, имитируя прокрутку вниз
                reelHeights[r] += symHeight;
                if (Math.abs(reelHeights[r]) >= strip.offsetHeight) {
                    reelHeights[r] = 0;
                }
                strip.style.transform = `translateY(${reelHeights[r]}px)`;
            }, 40);
        }
    }

    // Остановка конкретного барабана на заданном символе
    function stopReel(index, targetSymbol, duration = 200, callback) {
        if (animIntervals[index]) clearInterval(animIntervals[index]);
        const strip = reelStrips[index];
        const symbolsDivs = Array.from(strip.querySelectorAll('.reel-symbol'));
        const symHeight = symbolsDivs[0]?.offsetHeight || 80;
        // Ищем позицию, где targetSymbol находится в центре (на уровне 90px от верха)
        let targetIndex = -1;
        for (let i = 0; i < symbolsDivs.length; i++) {
            if (symbolsDivs[i].innerText === targetSymbol) {
                targetIndex = i;
                break;
            }
        }
        if (targetIndex === -1) targetIndex = 0;
        const targetY = -(targetIndex * symHeight) + 90;
        reelHeights[index] = targetY;
        strip.style.transition = `transform ${duration}ms ease-out`;
        strip.style.transform = `translateY(${targetY}px)`;
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, duration);
    }

    // Поочередная остановка всех трёх барабанов
    function stopReelsSequentially(finalSymbols, onComplete) {
        const delays = [200, 450, 700]; // задержки остановки: первый через 0.2с, второй 0.45с, третий 0.7с
        let completed = 0;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                stopReel(i, finalSymbols[i], 250, () => {
                    completed++;
                    if (completed === 3 && onComplete) onComplete(finalSymbols);
                });
            }, delays[i]);
        }
    }

    // ГЛАВНАЯ ФУНКЦИЯ СПИНА
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            document.getElementById('winMessage').innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;

        balance -= currentBet;
        updateBalanceUI();
        const msgDiv = document.getElementById('winMessage');
        msgDiv.innerHTML = '🌀 Крутим...';
        msgDiv.classList.remove('active');

        // Запускаем бесконечную прокрутку
        startSpinning();

        // Генерируем честные финальные символы для каждого барабана
        const finalSymbols = [];
        for (let i = 0; i < 3; i++) {
            finalSymbols.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
        }

        // Через 0.5 секунд начинаем поочередную остановку
        setTimeout(() => {
            stopReelsSequentially(finalSymbols, (results) => {
                const { win, bonus } = calculateWin(results, currentBet);
                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                    msgDiv.innerHTML = `✨ ВЫИГРЫШ: ${win} ✨`;
                    msgDiv.classList.add('active');
                    if (win > stats.maxWin) stats.maxWin = win;
                    stats.totalWin += win;
                    if (navigator.vibrate) navigator.vibrate(200);
                    if (bonus) {
                        setTimeout(() => {
                            alert('🌟 БОНУС! 🌟\nТы активировал секретную игру. Скоро здесь будет мини-игра с большим кушем!');
                        }, 300);
                    }
                } else {
                    msgDiv.innerHTML = '😢 Проигрыш';
                    msgDiv.classList.remove('active');
                }
                stats.games++;
                updateProfileUI();
                saveGameData();
                updateRatingUI();
                updateWalletUI();
                spinning = false;
                spinBtn.disabled = false;
                setTimeout(() => {
                    if (!spinning) msgDiv.innerHTML = '🌀 Крути барабаны!';
                }, 2000);
            });
        }, 600);
    }

    // Изменение ставки
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }

    // ---------- НАВИГАЦИЯ ----------
    function showScreen(screenName) {
        const slotDiv = document.querySelector('.slot-cabinet');
        const header = document.querySelector('.header');
        const paytable = document.querySelector('.paytable');
        const bottomNav = document.querySelector('.bottom-nav');
        const profileDiv = document.getElementById('profileScreen');
        const ratingDiv = document.getElementById('ratingScreen');
        const walletDiv = document.getElementById('walletScreen');
        const footer = document.querySelector('footer');

        if (screenName === 'slot') {
            slotDiv.style.display = 'block';
            header.style.display = 'flex';
            paytable.style.display = 'flex';
            bottomNav.style.display = 'flex';
            footer.style.display = 'block';
            profileDiv.style.display = 'none';
            ratingDiv.style.display = 'none';
            walletDiv.style.display = 'none';
        } else {
            slotDiv.style.display = 'none';
            header.style.display = 'none';
            paytable.style.display = 'none';
            bottomNav.style.display = 'none';
            footer.style.display = 'none';
            if (screenName === 'profile') {
                updateProfileUI();
                profileDiv.style.display = 'block';
                ratingDiv.style.display = 'none';
                walletDiv.style.display = 'none';
            } else if (screenName === 'rating') {
                updateRatingUI();
                profileDiv.style.display = 'none';
                ratingDiv.style.display = 'block';
                walletDiv.style.display = 'none';
            } else if (screenName === 'wallet') {
                updateWalletUI();
                profileDiv.style.display = 'none';
                ratingDiv.style.display = 'none';
                walletDiv.style.display = 'block';
            }
        }
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function init() {
        loadGameData();
        buildReels();
        // Таблица коэффициентов
        const paytableDiv = document.getElementById('paytable');
        paytableDiv.innerHTML = `
            <span>🌠 x50</span>
            <span>🚀 x5</span>
            <span>👽 x4</span>
            <span>🪐 x3</span>
            <span>🌙 x2</span>
            <span>⭐ x1.5</span>
        `;

        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        document.getElementById('spinButton').onclick = spin;

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.nav);
        });
        document.getElementById('backFromProfile').onclick = () => showScreen('slot');
        document.getElementById('backFromRating').onclick = () => showScreen('slot');
        document.getElementById('backFromWallet').onclick = () => showScreen('slot');

        let clickTimer = null;
        document.querySelector('.logo').addEventListener('click', () => {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                resetBalance();
            } else {
                clickTimer = setTimeout(() => { clickTimer = null; }, 300);
            }
        });

        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        showScreen('slot');
    }

    // Звёзды
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i = 0; i < 250; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();

    // Полноэкранный режим Telegram
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);

    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }

    init();
    forceFullscreen();
</script>
</body>
</html>
