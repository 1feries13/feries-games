<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC CASINO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* Фон со звездами */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,200,0.9);
            animation: starGlow 2s infinite alternate;
        }
        @keyframes starGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.2), transparent);
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        /* Основной контейнер */
        .app {
            position: relative;
            z-index: 1;
            max-width: 550px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        /* Приветственный экран */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
        }
        .welcome-card {
            background: rgba(0,0,0,0.6);
            border-radius: 56px;
            padding: 40px 30px;
            border: 1px solid #d4af37;
            width: 100%;
        }
        .welcome-card h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .welcome-card input {
            width: 100%;
            padding: 15px;
            border-radius: 60px;
            border: none;
            background: #1a212f;
            color: white;
            font-size: 1rem;
            text-align: center;
            margin: 15px 0;
        }
        .btn-gold {
            background: linear-gradient(145deg, #d4af37, #b48b2c);
            border: none;
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Основной интерфейс игры (скрыт до регистрации) */
        .game-screen {
            display: none;
        }

        /* Шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px 20px;
            border: 1px solid rgba(212,175,55,0.5);
            margin-bottom: 20px;
        }
        .logo h2 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 18px;
        }
        .balance span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Слот-машина */
        .slot-machine {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 25px 15px;
            margin: 20px 0;
            border: 1px solid #d4af37;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .reel {
            background: #0b0f18;
            border-radius: 28px;
            padding: 20px 0;
            width: 100px;
            text-align: center;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.3), 0 8px 20px black;
        }
        .reel-symbol {
            font-size: 68px;
            filter: drop-shadow(0 4px 6px black);
            transition: all 0.05s;
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffd966;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
            margin-top: 10px;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px;
            margin-top: auto;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1f2e;
            border-radius: 48px;
            padding: 30px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #d4af37;
        }
        .modal-content h3 {
            color: #ffd966;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .close-modal {
            background: #d4af37;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 15px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
            .logo h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>

<!-- Приветственный экран -->
<div id="welcomeContainer" class="app">
    <div class="welcome-screen">
        <div class="welcome-card">
            <h1>FERIES COSMIC CASINO</h1>
            <p style="color:#ffdf80; margin-bottom:20px;">Добро пожаловать в космос!</p>
            <input type="text" id="playerNameInput" placeholder="Введи своё имя" maxlength="20">
            <button class="btn-gold" id="startGameBtn">Начать игру</button>
        </div>
        <footer>Ваши данные под защитой галактики</footer>
    </div>
</div>

<!-- Основной игровой экран (изначально скрыт) -->
<div id="gameContainer" class="app game-screen">
    <div class="top-bar">
        <div class="logo"><h2>FERIES COSMIC</h2></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <div class="slot-machine">
        <div class="reels">
            <div class="reel"><div class="reel-symbol" id="reel0">🪐</div></div>
            <div class="reel"><div class="reel-symbol" id="reel1">🪐</div></div>
            <div class="reel"><div class="reel-symbol" id="reel2">🪐</div></div>
        </div>
        <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
        <div class="bet-panel">
            <span>💰 СТАВКА</span>
            <div class="bet-control">
                <button id="betMinus">–</button>
                <span class="bet-value" id="betAmount">25</span>
                <button id="betPlus">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" data-modal="profile">👤 Профиль</div>
        <div class="nav-btn" data-modal="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-modal="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Модальные окна -->
<div id="profileModal" class="modal"><div class="modal-content"><h3>👤 Профиль</h3><div id="profileInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="ratingModal" class="modal"><div class="modal-content"><h3>🏆 Рейтинг</h3><div id="ratingInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="walletModal" class="modal"><div class="modal-content"><h3>💰 Кошелёк</h3><div id="walletInfo"></div><button class="close-modal">Закрыть</button></div></div>

<script>
    // --- Данные игрока ---
    let playerName = localStorage.getItem('cosmic_playerName') || '';
    let balance = 1000;
    let currentBet = 25;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let spinning = false;
    
    // Загрузка сохранённых данных
    function loadGameData() {
        const savedBalance = localStorage.getItem('cosmic_balance');
        if (savedBalance && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('cosmic_stats');
        if (savedStats) try { stats = JSON.parse(savedStats); } catch(e) {}
        document.getElementById('balanceValue').innerText = balance;
    }
    
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    
    // Обновление UI
    function updateBalanceUI() {
        document.getElementById('balanceValue').innerText = balance;
    }
    
    function updateProfileUI() {
        const info = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 Имя:</span><span>${playerName || 'Космический странник'}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = info;
    }
    
    function updateRatingUI() {
        // Демо-рейтинг, позже можно заменить на реальные данные
        const ratingList = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: playerName || 'FERIES Player', score: balance }
        ];
        ratingList.sort((a,b) => b.score - a.score);
        const html = ratingList.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div style="font-size:2rem; text-align:center;">💰 ${balance}</div>`;
    }
    
    // Логика слота
    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌌'];
    
    function getRandomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
    }
    
    function setReels(s0, s1, s2) {
        document.getElementById('reel0').innerText = s0;
        document.getElementById('reel1').innerText = s1;
        document.getElementById('reel2').innerText = s2;
    }
    
    function calcWin(s0, s1, s2, bet) {
        if (s0 === s1 && s1 === s2) return bet * 5;
        if (s0 === s1 || s1 === s2 || s0 === s2) return Math.floor(bet * 1.2);
        return 0;
    }
    
    function showWinMessage(text, isWin) {
        const msgDiv = document.getElementById('winMessage');
        msgDiv.innerText = text;
        if (isWin) {
            msgDiv.style.background = 'rgba(212,175,55,0.7)';
            msgDiv.style.color = '#000';
        } else {
            msgDiv.style.background = 'rgba(212,175,55,0.15)';
            msgDiv.style.color = '#ffd966';
        }
    }
    
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            showWinMessage("❌ Не хватает монет!", false);
            return;
        }
        spinning = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;
        
        // Списываем ставку
        balance -= currentBet;
        updateBalanceUI();
        showWinMessage("🌀 Крутим...", false);
        
        // Анимация вращения (быстрая смена символов)
        let spinInterval = setInterval(() => {
            for (let i = 0; i < 3; i++) {
                document.getElementById(`reel${i}`).innerText = getRandomSymbol();
            }
        }, 50);
        
        // Поочередная остановка
        const delays = [700, 1000, 1300];
        const final = new Array(3);
        for (let i = 0; i < 3; i++) {
            setTimeout((idx) => {
                const fs = getRandomSymbol();
                document.getElementById(`reel${idx}`).innerText = fs;
                final[idx] = fs;
                if (idx === 2) {
                    clearInterval(spinInterval);
                    const win = calcWin(final[0], final[1], final[2], currentBet);
                    if (win > 0) {
                        balance += win;
                        updateBalanceUI();
                        showWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                        if (win > stats.maxWin) stats.maxWin = win;
                        stats.totalWin += win;
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else {
                        showWinMessage("😢 Проигрыш", false);
                    }
                    stats.games++;
                    saveGameData();
                    updateProfileUI();
                    updateRatingUI();
                    updateWalletUI();
                    spinning = false;
                    spinBtn.disabled = false;
                }
            }, delays[i], i);
        }
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }
    
    // --- Модальные окна ---
    function setupModals() {
        const modals = document.querySelectorAll('.modal');
        const navBtns = document.querySelectorAll('.nav-btn');
        
        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const modalId = btn.dataset.modal + 'Modal';
                const modal = document.getElementById(modalId);
                if (modal) {
                    if (modalId === 'profileModal') updateProfileUI();
                    if (modalId === 'ratingModal') updateRatingUI();
                    if (modalId === 'walletModal') updateWalletUI();
                    modal.style.display = 'flex';
                }
            });
        });
        
        modals.forEach(modal => {
            const closeBtn = modal.querySelector('.close-modal');
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
    }
    
    // --- Космический фон (звёзды) ---
    function createStars() {
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsContainer.appendChild(star);
        }
    }
    createStars();
    
    // --- Полноэкранный режим Telegram ---
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.requestFullscreen) {
                window.Telegram.WebApp.requestFullscreen().catch(e => console.warn(e));
            }
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);
    
    // --- Регистрация и старт игры ---
    function startGame() {
        const nameInput = document.getElementById('playerNameInput');
        let name = nameInput.value.trim();
        if (name === "") name = "Космический странник";
        playerName = name;
        localStorage.setItem('cosmic_playerName', playerName);
        
        // Скрыть приветствие, показать игру
        document.getElementById('welcomeContainer').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'flex';
        
        // Загрузить данные
        loadGameData();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        
        // Установить стартовые символы
        setReels('🪐', '🪐', '🪐');
    }
    
    // Если уже есть имя, сразу показываем игру
    if (playerName) {
        document.getElementById('welcomeContainer').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'flex';
        loadGameData();
        setReels('🪐', '🪐', '🪐');
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
    } else {
        document.getElementById('welcomeContainer').style.display = 'flex';
        document.getElementById('gameContainer').style.display = 'none';
    }
    
    // Обработчики событий
    document.getElementById('startGameBtn').addEventListener('click', startGame);
    document.getElementById('betMinus').addEventListener('click', () => changeBet(-5));
    document.getElementById('betPlus').addEventListener('click', () => changeBet(5));
    document.getElementById('spinButton').addEventListener('click', spin);
    
    setupModals();
    
    // После загрузки страницы также форсируем полноэкранный режим
    window.onload = () => {
        forceFullscreen();
        if (playerName) {
            loadGameData();
            updateProfileUI();
            updateRatingUI();
            updateWalletUI();
        }
    };
</script>
</body>
</html>
