<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES CASINO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #0f1725, #02040c);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
        }

        /* Премиум рамка на всё приложение */
        .app {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(10, 16, 30, 0.65);
            backdrop-filter: blur(20px);
            border-radius: 64px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(212, 175, 55, 0.7);
            transition: border-color 0.2s;
        }

        /* Верхний баннер с большим логотипом */
        .hero {
            background: linear-gradient(135deg, rgba(0,0,0,0.5) 0%, rgba(30,20,10,0.3) 100%);
            text-align: center;
            padding: 28px 20px 16px;
            border-bottom: 1px solid rgba(212,175,55,0.4);
        }
        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffefb9, #d4af37, #b8860b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .hero p {
            color: #c9b177;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Баланс и шапка */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 24px 0;
        }
        .balance-card {
            background: rgba(0,0,0,0.5);
            border-radius: 100px;
            padding: 8px 24px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212,175,55,0.5);
        }
        .balance-card span {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffdf80;
        }

        /* Основной контент */
        .content {
            padding: 16px 20px 24px;
        }

        /* Слоты */
        .slot-area {
            background: rgba(0,0,0,0.3);
            border-radius: 48px;
            padding: 20px 12px;
            margin-bottom: 10px;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .reel {
            background: rgba(10, 15, 30, 0.8);
            border-radius: 36px;
            padding: 24px 0;
            width: 110px;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(212,175,55,0.3), 0 12px 24px black;
        }
        .reel-symbol {
            font-size: 72px;
            filter: drop-shadow(0 4px 8px black);
            transition: all 0.05s ease;
            text-shadow: 0 0 4px currentColor;
        }
        /* Цветные акценты для разных тем (добавим чуть позже динамически, но основа) */
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 16px 0;
            transition: 0.1s;
        }
        .win-active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 20px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 20px;
            margin: 12px 0;
        }
        .bet-label { color: #ddd; font-size: 1rem; }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd966;
            cursor: pointer;
            width: 44px;
        }
        .bet-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 80px;
            font-size: 2rem;
            font-weight: bold;
            color: #0c0f18;
            margin: 16px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }
        .theme-strip {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 12px 4px;
            margin-top: 8px;
        }
        .theme-chip {
            background: #20273d;
            border-radius: 60px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #eee;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #4a526b;
        }
        .theme-active {
            background: #d4af37;
            color: #0a0f1e;
            border-color: #ffea9e;
        }

        /* Нижняя навигация */
        .nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 12px 12px 20px;
            margin-top: 8px;
            border-top: 1px solid rgba(212,175,55,0.3);
        }
        .nav-btn {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            color: #ccc;
        }
        .nav-active {
            background: #d4af37;
            color: #0a0f1e;
        }
        /* Экраны */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        /* Карточки для профиля, рейтинга, кошелька */
        .card {
            background: rgba(0,0,0,0.55);
            border-radius: 48px;
            padding: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212,175,55,0.3);
            margin-top: 10px;
        }
        .rating-item {
            display: flex;
            justify-content: space-between;
            background: #151e2c;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffd966;
        }
        .history-item {
            background: #0f1620;
            padding: 10px;
            border-radius: 40px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #ddd;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 12px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="hero">
        <h1>FERIES</h1>
        <p>CASINO • LUXURY GAMING</p>
    </div>
    <div class="top-bar">
        <div class="balance-card">
            <span id="balanceVal">1000</span>
        </div>
    </div>

    <div class="content">
        <!-- Меню игр -->
        <div id="menuScreen" class="screen active">
            <div class="card" style="text-align:center;">
                <div id="startGameBtn" style="background:linear-gradient(145deg,#2a3448,#141a2a); border-radius:48px; padding:28px; cursor:pointer;">
                    <div style="font-size:2rem;">🔥 FERIES CLASSIC</div>
                    <div style="font-size:1.1rem; color:#d4af37; margin-top:8px;">➡️ Нажми, чтобы играть</div>
                </div>
            </div>
        </div>

        <!-- Игровой экран -->
        <div id="gameScreen" class="screen">
            <div class="slot-area">
                <div class="reels">
                    <div class="reel"><div class="reel-symbol" id="r0">🍒</div></div>
                    <div class="reel"><div class="reel-symbol" id="r1">🍒</div></div>
                    <div class="reel"><div class="reel-symbol" id="r2">🍒</div></div>
                </div>
                <div class="win-area" id="winArea"><span id="winMsg">🎰 SPIN</span></div>
                <div class="bet-panel">
                    <span class="bet-label">💰 СТАВКА</span>
                    <div class="bet-control">
                        <button id="betDec">–</button>
                        <span class="bet-value" id="betVal">25</span>
                        <button id="betInc">+</button>
                    </div>
                </div>
                <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
                <div class="theme-strip" id="themeList"></div>
            </div>
        </div>

        <!-- Профиль -->
        <div id="profileScreen" class="screen">
            <div class="card">
                <div style="font-size:1.5rem; margin-bottom:16px;">👤 ПРОФИЛЬ</div>
                <p>⭐ Игр сыграно: <span id="statGames">0</span></p>
                <p>🏆 Макс. выигрыш: <span id="statMax">0</span></p>
                <p>📈 Общий выигрыш: <span id="statTotal">0</span></p>
                <hr style="margin:15px 0; border-color:#444;">
                <p>🆔 ID: <span id="userIdDisplay">local</span></p>
            </div>
        </div>

        <!-- Рейтинг -->
        <div id="ratingScreen" class="screen">
            <div class="card">
                <div style="font-size:1.3rem; margin-bottom:16px;">🌍 ТОП ИГРОКОВ</div>
                <div id="ratingList"></div>
            </div>
        </div>

        <!-- Кошелёк -->
        <div id="walletScreen" class="screen">
            <div class="card">
                <div style="font-size:1.3rem; margin-bottom:16px;">💰 ИСТОРИЯ</div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-btn" data-screen="menu">🎮 Меню</div>
        <div class="nav-btn" data-screen="profile">👤 Профиль</div>
        <div class="nav-btn" data-screen="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-screen="wallet">💰 Кошелек</div>
    </div>
    <footer>FERIES CASINO — поочередная остановка | Премиум версия</footer>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ НАСТРОЙКИ ==========
    let userId = 'local';
    let balance = 1000;
    let currentBet = 25;
    let currentTheme = 'egypt';
    let currentSymbols = ['🐫','👑','𓂀'];
    let spinning = false;

    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let history = [];

    // ТЕМЫ (добавим яркие акценты для крипто — цветные эмодзи, но оставим как есть)
    const themes = {
        egypt: { name: '🔺 Egypt', border: '#C9A03D', symbols: ['🐫', '👑', '𓂀', '🦂', '🌞', '🔺'] },
        space: { name: '🪐 Space', border: '#3A4F8A', symbols: ['🪐', '🚀', '🌙', '⭐', '👽', '🌌'] },
        crypto: { name: '₿ Crypto', border: '#F7931A', symbols: ['₿', 'Ξ', 'Ł', '₮', '💎', '🚀'] },
        jungle: { name: '🌿 Jungle', border: '#2E7D32', symbols: ['🐒', '🐍', '🦜', '🌿', '🍌', '🐆'] },
        fruit: { name: '🍎 Fruit', border: '#E65100', symbols: ['🍒', '🍊', '🍋', '🍉', '🍇', '🍓'] },
        horror: { name: '🧛 Horror', border: '#5D2E2E', symbols: ['🧛', '🕷️', '🪦', '👻', '🔪', '🕯️'] }
    };

    // DOM
    const balanceSpan = document.getElementById('balanceVal');
    const betSpan = document.getElementById('betVal');
    const winMsgSpan = document.getElementById('winMsg');
    const winAreaDiv = document.getElementById('winArea');
    const spinBtn = document.getElementById('spinBtn');
    const reels = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const appDiv = document.querySelector('.app');

    const screens = {
        menu: document.getElementById('menuScreen'),
        game: document.getElementById('gameScreen'),
        profile: document.getElementById('profileScreen'),
        rating: document.getElementById('ratingScreen'),
        wallet: document.getElementById('walletScreen')
    };

    // ========== ЛОКАЛЬНОЕ ХРАНЕНИЕ ==========
    function saveGameData() {
        localStorage.setItem('feries_balance', balance);
        localStorage.setItem('feries_stats', JSON.stringify(stats));
        localStorage.setItem('feries_history', JSON.stringify(history));
    }

    function loadGameData() {
        const savedBalance = localStorage.getItem('feries_balance');
        if (savedBalance !== null && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('feries_stats');
        if (savedStats) {
            try {
                const s = JSON.parse(savedStats);
                stats.games = s.games || 0;
                stats.maxWin = s.maxWin || 0;
                stats.totalWin = s.totalWin || 0;
            } catch(e) {}
        }
        const savedHistory = localStorage.getItem('feries_history');
        if (savedHistory) {
            try {
                history = JSON.parse(savedHistory);
            } catch(e) { history = []; }
        }
        updateBalanceUI();
        updateProfileUI();
        updateWalletUI();
    }

    function updateBalanceUI() {
        balanceSpan.innerText = balance;
    }

    function addHistoryEntry(text, amount) {
        const entry = { date: new Date().toLocaleString(), text, amount };
        history.unshift(entry);
        if (history.length > 20) history.pop();
        updateWalletUI();
        saveGameData();
    }

    function updateWalletUI() {
        const histDiv = document.getElementById('historyList');
        if (histDiv) {
            if (history.length === 0) histDiv.innerHTML = '<div class="history-item">Нет ставок</div>';
            else histDiv.innerHTML = history.map(h => `<div class="history-item">${h.date} — ${h.text}</div>`).join('');
        }
    }

    function updateProfileUI() {
        document.getElementById('statGames').innerText = stats.games;
        document.getElementById('statMax').innerText = stats.maxWin;
        document.getElementById('statTotal').innerText = stats.totalWin;
        document.getElementById('userIdDisplay').innerText = userId;
    }

    function updateRatingUI() {
        const ratingContainer = document.getElementById('ratingList');
        if (!ratingContainer) return;
        const demoPlayers = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId === 'local' ? 'FERIES_Player' : userId.slice(0,8), score: balance }
        ];
        demoPlayers.sort((a,b) => b.score - a.score);
        ratingContainer.innerHTML = demoPlayers.map(p => `<div class="rating-item"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
    }

    // ========== ИГРОВАЯ ЛОГИКА ==========
    function getRandomSymbol(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function setSymbols(s0, s1, s2) {
        reels[0].innerText = s0;
        reels[1].innerText = s1;
        reels[2].innerText = s2;
        currentSymbols = [s0, s1, s2];
    }

    function calcWin(symbols, bet) {
        if (symbols[0] === symbols[1] && symbols[1] === symbols[2]) return bet * 5;
        if (symbols[0] === symbols[1] || symbols[1] === symbols[2] || symbols[0] === symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }

    function setWinMessage(text, isWin = false) {
        winMsgSpan.innerText = text;
        if (isWin) winAreaDiv.classList.add('win-active');
        else winAreaDiv.classList.remove('win-active');
    }

    // ПООЧЕРЕДНАЯ ОСТАНОВКА
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        spinBtn.disabled = true;

        balance -= currentBet;
        updateBalanceUI();
        setWinMessage("🌀 Крутим...");
        addHistoryEntry(`Ставка ${currentBet}`, -currentBet);

        const symbolsArray = themes[currentTheme].symbols;
        let spinInterval = setInterval(() => {
            for (let i = 0; i < reels.length; i++) {
                reels[i].innerText = getRandomSymbol(symbolsArray);
            }
        }, 40);

        setTimeout(() => {
            const final0 = getRandomSymbol(symbolsArray);
            reels[0].innerText = final0;
            setTimeout(() => {
                const final1 = getRandomSymbol(symbolsArray);
                reels[1].innerText = final1;
                setTimeout(() => {
                    clearInterval(spinInterval);
                    const final2 = getRandomSymbol(symbolsArray);
                    reels[2].innerText = final2;
                    const finalSymbols = [final0, final1, final2];
                    currentSymbols = finalSymbols;
                    const win = calcWin(finalSymbols, currentBet);
                    if (win > 0) {
                        balance += win;
                        updateBalanceUI();
                        setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                        addHistoryEntry(`Выигрыш +${win}`, win);
                        if (win > stats.maxWin) stats.maxWin = win;
                        stats.totalWin += win;
                        if (navigator.vibrate) navigator.vibrate(200);
                    } else {
                        setWinMessage("😢 Проигрыш");
                    }
                    stats.games++;
                    updateProfileUI();
                    saveGameData();
                    updateRatingUI();
                    spinning = false;
                    spinBtn.disabled = false;
                }, 300);
            }, 300);
        }, 700);
    }

    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betSpan.innerText = currentBet;
        }
    }

    function applyTheme(key) {
        currentTheme = key;
        appDiv.style.borderColor = themes[key].border;
        document.querySelectorAll('.theme-chip').forEach(chip => {
            if (chip.dataset.theme === key) chip.classList.add('theme-active');
            else chip.classList.remove('theme-active');
        });
        const syms = themes[key].symbols;
        setSymbols(getRandomSymbol(syms), getRandomSymbol(syms), getRandomSymbol(syms));
        setWinMessage(`🎨 Тема: ${themes[key].name}`);
    }

    function buildThemes() {
        const container = document.getElementById('themeList');
        container.innerHTML = '';
        const order = ['egypt', 'space', 'crypto', 'jungle', 'fruit', 'horror'];
        for (let key of order) {
            const t = themes[key];
            if (!t) continue;
            const chip = document.createElement('div');
            chip.className = 'theme-chip';
            if (key === currentTheme) chip.classList.add('theme-active');
            chip.innerText = t.name;
            chip.dataset.theme = key;
            chip.onclick = () => applyTheme(key);
            container.appendChild(chip);
        }
    }

    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if (btn.dataset.screen === name) btn.classList.add('nav-active');
            else btn.classList.remove('nav-active');
        });
        if (name === 'profile') updateProfileUI();
        if (name === 'rating') updateRatingUI();
        if (name === 'wallet') updateWalletUI();
    }

    // Скрытый сброс баланса (двойной клик по логотипу в hero)
    let clickTimer = null;
    const heroLogo = document.querySelector('.hero h1');
    if (heroLogo) {
        heroLogo.style.cursor = 'pointer';
        heroLogo.addEventListener('click', () => {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                balance = 1000;
                updateBalanceUI();
                saveGameData();
                setWinMessage("💰 Баланс восстановлен до 1000", false);
                updateProfileUI();
                updateRatingUI();
            } else {
                clickTimer = setTimeout(() => { clickTimer = null; }, 300);
            }
        });
    }

    // Инициализация
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.expand(); // полноэкранный режим
            if (window.Telegram.WebApp.initDataUnsafe?.user) {
                userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
            }
        } else {
            userId = 'browser_' + Math.floor(Math.random()*10000);
        }
        loadGameData();
        buildThemes();
        applyTheme('egypt');
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        spinBtn.onclick = spin;
        document.getElementById('startGameBtn').onclick = () => showScreen('game');
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.screen);
        });
        showScreen('menu');
        if (window.Telegram?.WebApp) window.Telegram.WebApp.expand();
    };
</script>
</body>
</html>
