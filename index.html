<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES CASINO — премиум</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #03050a;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
        }

        /* Анимированный фон (золотые частицы) */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(212,175,55,0.4), rgba(212,175,55,0));
            border-radius: 50%;
            animation: float 12s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* Главный контейнер — занимает весь экран */
        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
        }

        /* Шапка с бургер-меню и логотипом */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
        }
        .burger {
            width: 32px;
            height: 24px;
            cursor: pointer;
            position: relative;
            z-index: 200;
        }
        .burger span {
            display: block;
            width: 100%;
            height: 3px;
            background: #d4af37;
            margin: 5px 0;
            border-radius: 3px;
            transition: 0.2s;
        }
        .logo {
            text-align: center;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.6rem;
            color: #d4af37;
        }

        /* Боковое меню (выезжающее) */
        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: linear-gradient(145deg, #0f0f1a, #05050c);
            border-right: 1px solid #d4af37;
            z-index: 1000;
            transition: left 0.3s ease;
            padding: 80px 20px 20px;
            box-shadow: 4px 0 20px rgba(0,0,0,0.5);
        }
        .side-menu.open {
            left: 0;
        }
        .side-menu .menu-item {
            padding: 14px 0;
            font-size: 1.2rem;
            color: #ffdf80;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
            transition: 0.1s;
        }
        .side-menu .menu-item:active {
            background: rgba(212,175,55,0.2);
            padding-left: 10px;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }

        /* Экраны */
        .screen {
            display: none;
            padding: 20px;
            flex: 1;
            animation: fadeIn 0.3s ease;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* Приветственный экран */
        .welcome-card {
            background: rgba(0,0,0,0.5);
            border-radius: 48px;
            padding: 40px 24px;
            text-align: center;
            margin-top: 30px;
        }
        .welcome-card h2 {
            font-size: 2rem;
            color: #ffdf80;
        }
        .btn-primary {
            background: linear-gradient(145deg, #d4af37, #b48b2c);
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 30px;
            cursor: pointer;
        }

        /* Меню игр */
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .game-card {
            background: rgba(20,25,40,0.8);
            border-radius: 56px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .game-card:active { transform: scale(0.98); }
        .game-card .title { font-size: 1.3rem; color: #ffdf80; font-weight: bold; }

        /* Игровой экран — стилизация барабанов как на скрине */
        .slot-machine {
            background: linear-gradient(145deg, #1a1f2e, #0e121c);
            border-radius: 48px;
            padding: 24px 16px;
            box-shadow: inset 0 0 0 1px rgba(212,175,55,0.3), 0 20px 30px black;
            margin: 10px 0;
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .reel {
            background: #0b0f18;
            border-radius: 28px;
            padding: 20px 0;
            width: 100px;
            text-align: center;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 8px 20px black;
            position: relative;
            overflow: hidden;
        }
        /* Эффект блеска на барабане */
        .reel::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.15), transparent);
            pointer-events: none;
        }
        .reel-symbol {
            font-size: 68px;
            filter: drop-shadow(0 4px 8px black);
            transition: all 0.05s linear;
        }
        .game-theme-crypto .reel-symbol { text-shadow: 0 0 8px #f7931a; }
        .game-theme-egypt .reel-symbol { text-shadow: 0 0 8px #c9a03d; }

        .win-area {
            background: rgba(212,175,55,0.1);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            margin: 16px 0;
        }
        .win-active {
            background: rgba(212,175,55,0.7);
            color: black;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 12px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            min-width: 50px;
            text-align: center;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 16px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }
        .game-balance {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 16px;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 8px 20px;
            border-radius: 40px;
            color: #d4af37;
            cursor: pointer;
            margin-top: 20px;
        }
        .info-card {
            background: rgba(0,0,0,0.6);
            border-radius: 48px;
            padding: 28px;
            backdrop-filter: blur(8px);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .wallet-balance {
            font-size: 2rem;
            text-align: center;
            color: #ffd966;
            margin: 20px 0;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 20px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; }
            .reel-symbol { font-size: 56px; }
        }
    </style>
</head>
<body>
<div class="animated-bg" id="animatedBg"></div>
<div class="app">
    <div class="top-bar">
        <div class="burger" id="burgerBtn">
            <span></span><span></span><span></span>
        </div>
        <div class="logo">
            <h1>FERIES</h1>
            <p>CASINO • LUXURY GAMING</p>
        </div>
        <div style="width: 32px;"></div>
    </div>

    <!-- Боковое меню -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-item" data-nav="profile">👤 Профиль</div>
        <div class="menu-item" data-nav="rating">🏆 Рейтинг</div>
        <div class="menu-item" data-nav="wallet">💰 Кошелек</div>
        <div class="menu-item" data-nav="menu">🎮 Меню игр</div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- ЭКРАНЫ -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
            <h2>Добро пожаловать!</h2>
            <p>Пусть удача улыбнётся вам в FERIES CASINO</p>
            <button class="btn-primary" id="toMenuBtn">Перейти в меню игр</button>
        </div>
        <footer>Ваши данные защищены</footer>
    </div>

    <div id="menuScreen" class="screen">
        <div class="games-grid" id="gamesGrid"></div>
        <footer>Выберите игру</footer>
    </div>

    <div id="gameScreen" class="screen">
        <div class="slot-machine">
            <div class="game-balance" id="gameBalance">1000</div>
            <div class="reels-container">
                <div class="reel"><div class="reel-symbol" id="r0">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r1">🍒</div></div>
                <div class="reel"><div class="reel-symbol" id="r2">🍒</div></div>
            </div>
            <div class="win-area" id="winArea"><span id="winMsg">🎰 SPIN</span></div>
            <div class="bet-panel">
                <span>💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betVal">25</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
        </div>
        <button class="back-btn" id="backToMenuFromGame">← В меню игр</button>
    </div>

    <div id="profileScreen" class="screen">
        <div class="info-card">
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span id="statGames">0</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span id="statMax">0</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span id="statTotal">0</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span id="userIdDisplay">—</span></div>
        </div>
        <button class="back-btn" id="backToMenuFromProfile">← Назад</button>
    </div>

    <div id="ratingScreen" class="screen">
        <div class="info-card">
            <div id="ratingList">Загрузка...</div>
        </div>
        <button class="back-btn" id="backToMenuFromRating">← Назад</button>
    </div>

    <div id="walletScreen" class="screen">
        <div class="info-card">
            <div class="wallet-balance" id="walletBalance">1000</div>
            <button class="btn-primary" id="depositBtn" style="background:#2a3448; box-shadow:none;">💎 Пополнить (крипта)</button>
            <div class="security-text" style="margin-top:16px;">🔒 Ваши данные защищены</div>
        </div>
        <button class="back-btn" id="backToMenuFromWallet">← Назад</button>
    </div>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ==========
    let userId = 'local';
    let balance = 1000;
    let currentBet = 25;
    let currentGameTheme = 'egypt';
    let currentSymbols = ['🐫','👑','𓂀'];
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };

    const gamesConfig = {
        egypt: { name: '🔺 EGYPT GOLD', border: '#C9A03D', symbols: ['🐫','👑','𓂀','🦂','🌞','🔺'], neonClass: 'game-theme-egypt' },
        space: { name: '🪐 SPACE ODYSSEY', border: '#3A4F8A', symbols: ['🪐','🚀','🌙','⭐','👽','🌌'], neonClass: '' },
        crypto: { name: '₿ CRYPTO MINER', border: '#F7931A', symbols: ['₿','Ξ','Ł','₮','💎','🚀'], neonClass: 'game-theme-crypto' },
        jungle: { name: '🌿 JUNGLE TREASURE', border: '#2E7D32', symbols: ['🐒','🐍','🦜','🌿','🍌','🐆'], neonClass: '' },
        fruit: { name: '🍎 FRUIT BLAST', border: '#E65100', symbols: ['🍒','🍊','🍋','🍉','🍇','🍓'], neonClass: '' }
    };

    // DOM
    const screens = {
        welcome: document.getElementById('welcomeScreen'),
        menu: document.getElementById('menuScreen'),
        game: document.getElementById('gameScreen'),
        profile: document.getElementById('profileScreen'),
        rating: document.getElementById('ratingScreen'),
        wallet: document.getElementById('walletScreen')
    };
    const gameBalanceSpan = document.getElementById('gameBalance');
    const walletBalanceSpan = document.getElementById('walletBalance');
    const betSpan = document.getElementById('betVal');
    const winMsgSpan = document.getElementById('winMsg');
    const winArea = document.getElementById('winArea');
    const spinButton = document.getElementById('spinBtn');
    const reels = [document.getElementById('r0'), document.getElementById('r1'), document.getElementById('r2')];
    const appDiv = document.querySelector('.app');

    // Функции хранения
    function saveGameData() {
        localStorage.setItem('feries_balance', balance);
        localStorage.setItem('feries_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const savedBalance = localStorage.getItem('feries_balance');
        if (savedBalance !== null && !isNaN(parseInt(savedBalance))) balance = parseInt(savedBalance);
        const savedStats = localStorage.getItem('feries_stats');
        if (savedStats) try { stats = JSON.parse(savedStats); } catch(e) {}
        updateBalanceUI();
        updateProfileUI();
        updateWalletUI();
    }
    function updateBalanceUI() {
        if (gameBalanceSpan) gameBalanceSpan.innerText = balance;
        if (walletBalanceSpan) walletBalanceSpan.innerText = balance;
    }
    function updateProfileUI() {
        document.getElementById('statGames').innerText = stats.games || 0;
        document.getElementById('statMax').innerText = stats.maxWin || 0;
        document.getElementById('statTotal').innerText = stats.totalWin || 0;
        document.getElementById('userIdDisplay').innerText = userId;
    }
    function updateWalletUI() { if (walletBalanceSpan) walletBalanceSpan.innerText = balance; }
    function updateRatingUI() {
        const container = document.getElementById('ratingList');
        if (!container) return;
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId === 'local' ? 'FERIES_Player' : userId.slice(0,8), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        container.innerHTML = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        setWinMessage("💰 Баланс восстановлен до 1000", false);
    }

    // Игровая логика
    function getRandomSymbol(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function setSymbols(s0,s1,s2) {
        reels[0].innerText = s0;
        reels[1].innerText = s1;
        reels[2].innerText = s2;
        currentSymbols = [s0,s1,s2];
    }
    function calcWin(symbols, bet) {
        if (symbols[0]===symbols[1] && symbols[1]===symbols[2]) return bet * 5;
        if (symbols[0]===symbols[1] || symbols[1]===symbols[2] || symbols[0]===symbols[2]) return Math.floor(bet * 1.2);
        return 0;
    }
    function setWinMessage(text, isWin=false) {
        winMsgSpan.innerText = text;
        if (isWin) winArea.classList.add('win-active');
        else winArea.classList.remove('win-active');
    }

    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        spinButton.disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        setWinMessage("🌀 Крутим...");

        const game = gamesConfig[currentGameTheme];
        const symbolsArray = game.symbols;
        let interval = setInterval(() => {
            for (let i=0; i<3; i++) reels[i].innerText = getRandomSymbol(symbolsArray);
        }, 40);

        setTimeout(() => {
            const final0 = getRandomSymbol(symbolsArray);
            reels[0].innerText = final0;
            setTimeout(() => {
                const final1 = getRandomSymbol(symbolsArray);
                reels[1].innerText = final1;
                setTimeout(() => {
                    clearInterval(interval);
                    let final2 = getRandomSymbol(symbolsArray);
                    // подъёб с вероятностью 20%
                    if (Math.random() < 0.2) {
                        reels[2].innerText = final2;
                        setTimeout(() => {
                            const fake = getRandomSymbol(symbolsArray);
                            reels[2].innerText = fake;
                            finish(final0, final1, fake);
                        }, 100);
                    } else {
                        reels[2].innerText = final2;
                        finish(final0, final1, final2);
                    }
                    function finish(s0,s1,s2) {
                        const win = calcWin([s0,s1,s2], currentBet);
                        if (win > 0) {
                            balance += win;
                            updateBalanceUI();
                            setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                            if (win > stats.maxWin) stats.maxWin = win;
                            stats.totalWin += win;
                            if (navigator.vibrate) navigator.vibrate(200);
                        } else setWinMessage("😢 Проигрыш");
                        stats.games++;
                        updateProfileUI();
                        saveGameData();
                        updateRatingUI();
                        spinning = false;
                        spinButton.disabled = false;
                    }
                }, 350);
            }, 350);
        }, 700);
    }

    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betSpan.innerText = currentBet;
        }
    }

    function applyGameTheme(themeKey) {
        currentGameTheme = themeKey;
        const game = gamesConfig[themeKey];
        appDiv.classList.remove('game-theme-crypto', 'game-theme-egypt');
        if (game.neonClass) appDiv.classList.add(game.neonClass);
        const syms = game.symbols;
        setSymbols(getRandomSymbol(syms), getRandomSymbol(syms), getRandomSymbol(syms));
        setWinMessage(`🎮 ${game.name}`);
    }

    function buildGamesMenu() {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';
        for (let [key, game] of Object.entries(gamesConfig)) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `<span class="title">${game.name}</span><span class="icon">${game.symbols[0]}</span>`;
            card.onclick = () => { currentGameTheme = key; showScreen('game'); applyGameTheme(key); };
            grid.appendChild(card);
        }
    }

    // Навигация
    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        if (name === 'game') {
            updateBalanceUI();
            applyGameTheme(currentGameTheme);
        }
        if (name === 'profile') updateProfileUI();
        if (name === 'rating') updateRatingUI();
        if (name === 'wallet') updateWalletUI();
    }

    // Меню-бургер
    const burger = document.getElementById('burgerBtn');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    function closeMenu() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
    }
    burger.onclick = () => {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
    };
    overlay.onclick = closeMenu;
    document.querySelectorAll('.menu-item').forEach(item => {
        item.onclick = () => {
            const nav = item.dataset.nav;
            if (nav === 'menu') showScreen('menu');
            if (nav === 'profile') showScreen('profile');
            if (nav === 'rating') showScreen('rating');
            if (nav === 'wallet') showScreen('wallet');
            closeMenu();
        };
    });

    // Кнопки навигации
    document.getElementById('toMenuBtn').onclick = () => showScreen('menu');
    document.getElementById('backToMenuFromGame').onclick = () => showScreen('menu');
    document.getElementById('backToMenuFromProfile').onclick = () => showScreen('menu');
    document.getElementById('backToMenuFromRating').onclick = () => showScreen('menu');
    document.getElementById('backToMenuFromWallet').onclick = () => showScreen('menu');
    document.getElementById('betDec').onclick = () => changeBet(-5);
    document.getElementById('betInc').onclick = () => changeBet(5);
    spinButton.onclick = spin;
    document.getElementById('depositBtn').onclick = () => alert('Пополнение через криптовалюту скоро. Баланс: ' + balance);

    // Скрытый сброс (двойной клик по логотипу)
    let clickTimer = null;
    document.querySelector('.logo').addEventListener('click', () => {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; resetBalance(); }
        else { clickTimer = setTimeout(() => { clickTimer = null; }, 300); }
    });

    // Анимированный фон
    function createParticles() {
        const bg = document.getElementById('animatedBg');
        for (let i=0; i<40; i++) {
            const size = Math.random() * 6 + 2;
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = 10 + Math.random() * 10 + 's';
            bg.appendChild(particle);
        }
    }
    createParticles();

    // Инициализация
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.initDataUnsafe?.user)
                userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        } else userId = 'browser_' + Math.floor(Math.random()*10000);
        loadGameData();
        buildGamesMenu();
        applyGameTheme('egypt');
        showScreen('welcome');
        if (window.Telegram?.WebApp) window.Telegram.WebApp.expand();
    };
</script>
</body>
</html>
