<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Звездное небо */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Главный контейнер */
        .app {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(8, 10, 20, 0.65);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 18px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* ========== ЭКРАН СЛОТОВ ========== */
        .slot-screen {
            padding: 20px;
        }
        .slot-machine {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 20px 15px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.3);
        }
        .reels {
            background: #0b0f18;
            border-radius: 32px;
            padding: 20px 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        /* КАЖДЫЙ БАРАБАН — ВЕРТИКАЛЬНАЯ ПРОКРУТКА */
        .reel {
            width: 100px;
            height: 240px;
            overflow: hidden;
            background: #0b0f18;
            border-radius: 20px;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.3), 0 0 15px rgba(0,0,0,0.5);
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .reel-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            filter: drop-shadow(0 2px 4px black);
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }

        /* Таблица коэффициентов над слотами */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 10px 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.75rem;
        }
        .paytable span {
            color: #ffdf80;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 12px;
            margin: 20px 20px 15px;
            border: 1px solid rgba(212,175,55,0.4);
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Страницы профиля, рейтинга, кошелька */
        .page-card {
            background: rgba(0,0,0,0.6);
            border-radius: 48px;
            padding: 28px;
            margin: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
            font-size: 1rem;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            width: calc(100% - 40px);
            margin: 10px 20px;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 15px;
        }
        @media (max-width: 550px) {
            .reel { width: 85px; height: 210px; }
            .reel-symbol { height: 70px; font-size: 46px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН — СЛОТЫ -->
    <div id="slotScreen" class="slot-screen">
        <div class="paytable" id="paytable"></div>
        <div class="slot-machine">
            <div class="reels" id="reels">
                <!-- 3 барабана будут динамически созданы -->
            </div>
            <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
            <div class="bet-panel">
                <span>💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betAmount">25</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinButton">🔮 SPIN</button>
        </div>
    </div>

    <!-- СТРАНИЦЫ (по умолчанию скрыты) -->
    <div id="profileScreen" class="page-card" style="display: none;">
        <div id="profileInfo"></div>
        <button class="back-btn" id="backFromProfile">← Назад</button>
    </div>
    <div id="ratingScreen" class="page-card" style="display: none;">
        <div id="ratingInfo"></div>
        <button class="back-btn" id="backFromRating">← Назад</button>
    </div>
    <div id="walletScreen" class="page-card" style="display: none;">
        <div id="walletInfo"></div>
        <button class="back-btn" id="backFromWallet">← Назад</button>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-btn" data-nav="profile">👤 Профиль</div>
        <div class="nav-btn" data-nav="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-nav="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let reelsData = [];      // Массив с данными каждого барабана
    let reelStrips = [];     // DOM-элементы .reel-strip
    let reelHeights = [];    // текущая позиция прокрутки
    let animIntervals = [];  // интервалы вращения
    
    // Символы и множители для ТЕМЫ КОСМОС
    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = {
        '🌠': 50,   // секретный символ
        '🚀': 5,
        '🪐': 3,
        '👽': 4,
        '🌙': 2,
        '⭐': 1.5
    };
    
    // ========== ФУНКЦИИ СОХРАНЕНИЯ И БАЛАНСА ==========
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() {
        document.getElementById('balanceValue').innerText = balance;
    }
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    function updateRatingUI() {
        const ratingList = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        ratingList.sort((a,b) => b.score - a.score);
        const html = ratingList.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Твой баланс:</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        document.getElementById('winMessage').innerHTML = '💰 Баланс восстановлен до 1000';
        setTimeout(() => { if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!'; }, 1500);
    }
    
    // ========== ЛОГИКА ВЫИГРЫША ==========
    function calculateWin(symbolsList, bet) {
        // symbolsList — массив из 3 символов (результаты)
        const counts = {};
        for (let s of symbolsList) counts[s] = (counts[s] || 0) + 1;
        let win = 0;
        let bonusTrigger = false;
        // 3 одинаковых
        for (let [sym, count] of Object.entries(counts)) {
            if (count === 3) {
                let mult = multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonusTrigger = true;
                break;
            }
        }
        // Если нет трёх, проверяем два одинаковых
        if (win === 0) {
            for (let [sym, count] of Object.entries(counts)) {
                if (count === 2) {
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonusTrigger };
    }
    
    // ========== ПОСТРОЕНИЕ БАРАБАНОВ (ВЕРТИКАЛЬНАЯ ПРОКРУТКА) ==========
    function buildReels() {
        const container = document.getElementById('reels');
        container.innerHTML = '';
        reelsData = [];
        reelStrips = [];
        reelHeights = [0, 0, 0];
        
        for (let r = 0; r < 3; r++) {
            // Создаём блок барабана
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            
            // Наполняем 16 случайными символами (чтобы было много для прокрутки)
            const randSymbols = [];
            for (let i = 0; i < 12; i++) {
                const randSym = symbols[Math.floor(Math.random() * symbols.length)];
                randSymbols.push(randSym);
            }
            // Запоминаем начальную позицию (рандомный сдвиг)
            const startPos = Math.floor(Math.random() * 12);
            reelsData.push({
                symbols: randSymbols,
                currentPos: startPos,
                stripHeight: 0,
                symbolHeight: 0
            });
            
            // Выводим символы в DOM
            for (let i = 0; i < randSymbols.length; i++) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = randSymbols[i];
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            container.appendChild(reelDiv);
            reelStrips.push(stripDiv);
        }
        
        // После добавления в DOM — вычисляем высоту и задаём начальное смещение
        setTimeout(() => {
            for (let r = 0; r < 3; r++) {
                const strip = reelStrips[r];
                const firstSym = strip.querySelector('.reel-symbol');
                if (firstSym) {
                    const symHeight = firstSym.offsetHeight;
                    const totalHeight = strip.offsetHeight;
                    reelsData[r].symbolHeight = symHeight;
                    reelsData[r].stripHeight = totalHeight;
                    // Стартовое смещение — чтобы центральный символ был в зоне видимости
                    const startOffset = -(reelsData[r].currentPos * symHeight) + 80;
                    reelHeights[r] = startOffset;
                    strip.style.transform = `translateY(${startOffset}px)`;
                }
            }
        }, 10);
    }
    
    // Вращение барабанов (быстрая смена позиции каждые 50 мс)
    function startSpinAnimation() {
        for (let r = 0; r < 3; r++) {
            const strip = reelStrips[r];
            const data = reelsData[r];
            if (!strip || !data) continue;
            // Останавливаем предыдущий интервал
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            // Запускаем новый
            animIntervals[r] = setInterval(() => {
                // Увеличиваем позицию (эмуляция вращения вниз)
                reelHeights[r] = (reelHeights[r] + data.symbolHeight) % (data.stripHeight);
                strip.style.transform = `translateY(${reelHeights[r]}px)`;
            }, 50);
        }
    }
    
    // Остановка конкретного барабана r на финальном символе finalSymbol
    function stopReel(r, finalSymbol, callback) {
        if (animIntervals[r]) clearInterval(animIntervals[r]);
        const strip = reelStrips[r];
        const data = reelsData[r];
        // Находим индекс финального символа в наборе
        let targetIndex = 0;
        for (let i = 0; i < data.symbols.length; i++) {
            if (data.symbols[i] === finalSymbol) {
                targetIndex = i;
                break;
            }
        }
        // Рассчитываем позицию, чтобы этот символ оказался в центре
        const targetOffset = -(targetIndex * data.symbolHeight) + 80;
        reelHeights[r] = targetOffset;
        strip.style.transform = `translateY(${reelHeights[r]}px)`;
        strip.style.transition = 'transform 0.2s ease-out';
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, 220);
    }
    
    // Остановка всех барабанов по очереди с поочередной задержкой
    function stopReelsSequentially(finalSymbols, onComplete) {
        let completed = 0;
        for (let r = 0; r < 3; r++) {
            stopReel(r, finalSymbols[r], () => {
                completed++;
                if (completed === 3 && onComplete) onComplete(finalSymbols);
            });
            // Задержка между остановками: 200, 400, 600 мс
            if (r === 0) setTimeout(() => {}, 200);
            else if (r === 1) setTimeout(() => {}, 400);
            else setTimeout(() => {}, 600);
        }
    }
    
    // ГЛАВНАЯ ФУНКЦИЯ SPIN
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            document.getElementById('winMessage').innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;
        
        // Списываем ставку
        balance -= currentBet;
        updateBalanceUI();
        document.getElementById('winMessage').innerHTML = '🌀 Крутим...';
        document.getElementById('winMessage').classList.remove('active');
        
        // Запускаем анимацию прокрутки
        startSpinAnimation();
        
        // Генерируем финальные символы (честный случайный выбор)
        const finalSymbols = [];
        for (let r = 0; r < 3; r++) {
            finalSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
        }
        
        // Останавливаем барабаны по очереди
        setTimeout(() => {
            stopReelsSequentially(finalSymbols, (results) => {
                const { win, bonusTrigger } = calculateWin(results, currentBet);
                if (win > 0) {
                    balance += win;
                    updateBalanceUI();
                    document.getElementById('winMessage').innerHTML = `✨ ВЫИГРЫШ: ${win} ✨`;
                    document.getElementById('winMessage').classList.add('active');
                    if (win > stats.maxWin) stats.maxWin = win;
                    stats.totalWin += win;
                    if (navigator.vibrate) navigator.vibrate(200);
                    
                    if (bonusTrigger) {
                        setTimeout(() => {
                            alert('🌟 БОНУС! 🌟\nТы активировал секретную игру. Скоро здесь будет мини-игра с большим кушем!');
                        }, 300);
                    }
                } else {
                    document.getElementById('winMessage').innerHTML = '😢 Проигрыш';
                    document.getElementById('winMessage').classList.remove('active');
                }
                stats.games++;
                updateProfileUI();
                saveGameData();
                updateRatingUI();
                updateWalletUI();
                spinning = false;
                spinBtn.disabled = false;
                // Возвращаем стандартное сообщение через 2 секунды
                setTimeout(() => {
                    if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!';
                }, 2000);
            });
        }, 800);
    }
    
    // ========== ИЗМЕНЕНИЕ СТАВКИ ==========
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }
    
    // ========== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ==========
    function showScreen(screenName) {
        const slotDiv = document.getElementById('slotScreen');
        const profileDiv = document.getElementById('profileScreen');
        const ratingDiv = document.getElementById('ratingScreen');
        const walletDiv = document.getElementById('walletScreen');
        const bottomNav = document.querySelector('.bottom-nav');
        
        if (screenName === 'slot') {
            slotDiv.style.display = 'block';
            profileDiv.style.display = 'none';
            ratingDiv.style.display = 'none';
            walletDiv.style.display = 'none';
            bottomNav.style.display = 'flex';
        } else {
            slotDiv.style.display = 'none';
            bottomNav.style.display = 'none';
            if (screenName === 'profile') {
                updateProfileUI();
                profileDiv.style.display = 'block';
                ratingDiv.style.display = 'none';
                walletDiv.style.display = 'none';
            } else if (screenName === 'rating') {
                updateRatingUI();
                profileDiv.style.display = 'none';
                ratingDiv.style.display = 'block';
                walletDiv.style.display = 'none';
            } else if (screenName === 'wallet') {
                updateWalletUI();
                profileDiv.style.display = 'none';
                ratingDiv.style.display = 'none';
                walletDiv.style.display = 'block';
            }
        }
    }
    
    // ========== ИНИЦИАЛИЗАЦИЯ И СОБЫТИЯ ==========
    function init() {
        loadGameData();
        buildReels();
        
        // Заполняем таблицу коэффициентов
        const paytableDiv = document.getElementById('paytable');
        paytableDiv.innerHTML = `
            <span>🌟 x50</span>
            <span>🚀 x5</span>
            <span>👽 x4</span>
            <span>🪐 x3</span>
            <span>🌙 x2</span>
            <span>⭐ x1.5</span>
        `;
        
        // Назначаем обработчики
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        document.getElementById('spinButton').onclick = spin;
        
        // Навигация по нижнему меню
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = () => {
                const nav = btn.dataset.nav;
                showScreen(nav);
            };
        });
        
        // Кнопки "Назад" со страниц
        document.getElementById('backFromProfile').onclick = () => showScreen('slot');
        document.getElementById('backFromRating').onclick = () => showScreen('slot');
        document.getElementById('backFromWallet').onclick = () => showScreen('slot');
        
        // Сброс баланса двойным кликом по логотипу
        let clickTimer = null;
        document.querySelector('.logo').addEventListener('click', () => {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                resetBalance();
            } else {
                clickTimer = setTimeout(() => { clickTimer = null; }, 300);
            }
        });
        
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        showScreen('slot');
    }
    
    // Звёздное небо
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i = 0; i < 250; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();
    
    // Полноэкранный режим Telegram
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);
    
    // Получаем ID пользователя
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    init();
</script>
</body>
</html>
