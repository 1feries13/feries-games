<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT — реальный слот</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Космический фон */
        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,255,200,0.9);
            animation: starGlow 2s infinite alternate;
        }
        @keyframes starGlow {
            0% { opacity: 0.3; transform: scale(1); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #ffd966; }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Основной контейнер */
        .app {
            position: relative;
            z-index: 1;
            max-width: 580px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(8, 10, 20, 0.7);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
        }

        /* Шапка с балансом */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .logo h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
            letter-spacing: 2px;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Экран слотов (игровая область) */
        .slot-screen {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 20px 15px;
            margin: 20px;
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px black;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.6);
            border-radius: 40px;
            padding: 8px 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .paytable span {
            color: #ffd966;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            border-left: 2px solid #d4af37;
        }

        /* Контейнер барабанов с эффектом глубины */
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
            perspective: 400px;
        }
        .reel {
            position: relative;
            width: 100px;
            height: 140px;
            background: #0b0f18;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: inset 0 0 0 3px rgba(212,175,55,0.5), 0 10px 20px black;
        }
        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .reel-symbol {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 68px;
            filter: drop-shadow(0 2px 4px black);
        }
        /* 3D-эффект для барабанов при наведении */
        .reel:hover {
            transform: translateZ(10px);
        }

        /* Информация о выигрыше/проигрыше */
        .win-info {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
            transition: 0.1s;
        }
        .win-info.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }

        /* Панель ставки и кнопка SPIN */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 5px 0;
        }
        .bet-box {
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .bet-box span {
            font-size: 1rem;
            color: #ccc;
        }
        .bet-changer {
            display: flex;
            gap: 15px;
            background: #1a212f;
            padding: 4px 15px;
            border-radius: 60px;
        }
        .bet-changer button {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: #ffd966;
            cursor: pointer;
            width: 35px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            flex: 1;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
            text-align: center;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }

        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 10px;
            margin: 20px 20px 20px;
            border: 1px solid #d4af37;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }

        /* Страницы (профиль, рейтинг, кошелёк) */
        .page-card {
            background: rgba(0,0,0,0.6);
            border-radius: 48px;
            padding: 28px;
            margin: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
            font-size: 1rem;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 40px;
            color: #d4af37;
            cursor: pointer;
            width: calc(100% - 40px);
            margin: 0 20px 20px;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 15px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        @media (max-width: 550px) {
            .reel { width: 85px; height: 120px; }
            .reel-symbol { font-size: 56px; height: 120px; }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- Экран слота (игровой) -->
    <div id="slotScreen" class="screen active">
        <div class="slot-screen">
            <div class="paytable" id="paytable"></div>
            <div class="reels-container">
                <div class="reel" id="reel0"><div class="reel-strip" id="strip0"></div></div>
                <div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>
                <div class="reel" id="reel2"><div class="reel-strip" id="strip2"></div></div>
            </div>
            <div class="win-info" id="winInfo">🌀 Крути барабаны!</div>
            <div class="controls">
                <div class="bet-box">
                    <span>💰 СТАВКА</span>
                    <div class="bet-changer">
                        <button id="betDec">–</button>
                        <span class="bet-value" id="betAmount">25</span>
                        <button id="betInc">+</button>
                    </div>
                </div>
                <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
            </div>
        </div>
        <div class="bottom-nav">
            <div class="nav-btn" data-nav="profile">👤 Профиль</div>
            <div class="nav-btn" data-nav="rating">🏆 Рейтинг</div>
            <div class="nav-btn" data-nav="wallet">💰 Кошелёк</div>
        </div>
        <footer>Ваши данные под защитой галактики</footer>
    </div>

    <!-- Страница профиля -->
    <div id="profileScreen" class="screen">
        <div class="page-card" id="profileInfo"></div>
        <button class="back-btn" id="backFromProfile">← Назад в игру</button>
    </div>

    <!-- Страница рейтинга -->
    <div id="ratingScreen" class="screen">
        <div class="page-card" id="ratingInfo"></div>
        <button class="back-btn" id="backFromRating">← Назад в игру</button>
    </div>

    <!-- Страница кошелька -->
    <div id="walletScreen" class="screen">
        <div class="page-card" id="walletInfo"></div>
        <button class="back-btn" id="backFromWallet">← Назад в игру</button>
    </div>
</div>

<script>
    // ---------- НАСТРОЙКИ ИГРЫ ----------
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    
    // Тема (пока одна космическая)
    const theme = {
        name: 'Космос',
        symbols: ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'],
        multipliers: { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 },
        paytable: '🌠 x50 | 🚀 x5 | 👽 x4 | 🪐 x3 | 🌙 x2 | ⭐ x1.5'
    };

    // DOM элементы
    const balanceSpan = document.getElementById('balanceValue');
    const winInfoDiv = document.getElementById('winInfo');
    const spinButton = document.getElementById('spinBtn');
    const betDec = document.getElementById('betDec');
    const betInc = document.getElementById('betInc');
    const betAmountSpan = document.getElementById('betAmount');
    const paytableDiv = document.getElementById('paytable');
    
    // Барабаны (контейнеры для анимации)
    const reelStrips = [
        document.getElementById('strip0'),
        document.getElementById('strip1'),
        document.getElementById('strip2')
    ];
    const reelHeight = 140; // высота одного символа в пикселях
    let currentOffsets = [0, 0, 0];
    let animationIntervals = [null, null, null];
    
    // Символы текущей темы
    let symbolsArray = theme.symbols;
    let multipliers = theme.multipliers;
    
    // Отображение таблицы коэффициентов
    paytableDiv.innerHTML = `<span>💰 ${theme.paytable}</span>`;
    
    // Генерация вертикальных полос для каждого барабана
    function buildReelStrip(stripElement, symbols) {
        // Создаём 5-6 копий символов для бесконечной прокрутки
        let html = '';
        for (let i = 0; i < 5; i++) {
            for (let s of symbols) {
                html += `<div class="reel-symbol">${s}</div>`;
            }
        }
        stripElement.innerHTML = html;
        stripElement.style.transform = 'translateY(0px)';
    }
    
    // Инициализация барабанов
    function initReels() {
        for (let i = 0; i < 3; i++) {
            buildReelStrip(reelStrips[i], symbolsArray);
            currentOffsets[i] = 0;
            reelStrips[i].style.transform = `translateY(0px)`;
        }
    }
    
    // Плавная прокрутка барабана на случайную позицию (имитация вращения)
    function spinReelWithStop(reelIndex, finalSymbolIndex, duration, callback) {
        const strip = reelStrips[reelIndex];
        const totalSymbols = symbolsArray.length * 5; // количество элементов в полосе
        const symbolHeight = reelHeight;
        // Вычисляем целевую позицию: нужно, чтобы финальный символ оказался в видимой области
        // Видимая область — это 1 элемент (индекс 2 или 3 после прокрутки)
        // Мы хотим, чтобы finalSymbolIndex оказался на позиции 2 (третий элемент сверху)
        const targetVisibleIndex = 2; // показываем третий символ
        // Находим, на каком расстоянии от начала полосы находится нужный символ
        let targetOffset = 0;
        const allSymbols = [];
        for (let i = 0; i < 5; i++) {
            for (let s of symbolsArray) allSymbols.push(s);
        }
        // Ищем позицию первого вхождения finalSymbol среди всех
        let firstPos = -1;
        for (let i = 0; i < allSymbols.length; i++) {
            if (allSymbols[i] === finalSymbolIndex) {
                firstPos = i;
                break;
            }
        }
        if (firstPos === -1) firstPos = 0; // fallback
        // Нам нужно, чтобы после остановки символ оказался на targetVisibleIndex
        // Текущий offset = 0, мы прокручиваем вниз на величину (firstPos - targetVisibleIndex) * symbolHeight, плюс несколько оборотов
        let rotations = 4; // полных оборота
        let targetY = (firstPos - targetVisibleIndex) * symbolHeight + rotations * totalSymbols * symbolHeight;
        targetY %= (totalSymbols * symbolHeight);
        // Анимация
        const startTime = performance.now();
        const startY = currentOffsets[reelIndex];
        const deltaY = targetY - startY;
        function animate(now) {
            const elapsed = now - startTime;
            let t = Math.min(1, elapsed / duration);
            // easeOutCubic для плавной остановки
            const ease = 1 - Math.pow(1 - t, 3);
            const newY = startY + deltaY * ease;
            strip.style.transform = `translateY(-${newY}px)`;
            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                // фиксация точной позиции
                strip.style.transform = `translateY(-${targetY}px)`;
                currentOffsets[reelIndex] = targetY;
                if (callback) callback();
            }
        }
        requestAnimationFrame(animate);
    }
    
    // Поочередная остановка барабанов (сначала 0, потом 1, потом 2)
    function sequentialStop(finalSymbols, afterStopCallback) {
        let step = 0;
        function stopNext() {
            if (step >= 3) {
                if (afterStopCallback) afterStopCallback();
                return;
            }
            const finalSym = finalSymbols[step];
            spinReelWithStop(step, finalSym, 400, () => {
                step++;
                stopNext();
            });
        }
        stopNext();
    }
    
    // Запуск вращения всех барабанов (одновременно)
    function startAllSpinning() {
        for (let i = 0; i < 3; i++) {
            const strip = reelStrips[i];
            // Бесконечная прокрутка: постоянно увеличиваем смещение
            let offset = currentOffsets[i];
            let step = 0;
            if (animationIntervals[i]) clearInterval(animationIntervals[i]);
            animationIntervals[i] = setInterval(() => {
                offset += 12; // скорость вращения
                if (offset > 2000) offset -= 2000;
                strip.style.transform = `translateY(-${offset}px)`;
                currentOffsets[i] = offset;
            }, 20);
        }
    }
    
    function stopAllSpinning() {
        for (let i = 0; i < 3; i++) {
            if (animationIntervals[i]) {
                clearInterval(animationIntervals[i]);
                animationIntervals[i] = null;
            }
        }
    }
    
    // Функция расчета выигрыша
    function calculateWin(symbols, bet) {
        const counts = {};
        for (let s of symbols) counts[s] = (counts[s] || 0) + 1;
        let win = 0;
        let bonusTrigger = false;
        for (let [sym, count] of Object.entries(counts)) {
            if (count === 3) {
                const mult = multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonusTrigger = true;
                break;
            }
        }
        if (win === 0) {
            for (let [sym, count] of Object.entries(counts)) {
                if (count === 2) {
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonusTrigger };
    }
    
    function updateBalanceUI() {
        balanceSpan.innerText = balance;
    }
    
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    
    function showWinMessage(text, isWin) {
        winInfoDiv.innerHTML = text;
        if (isWin) winInfoDiv.classList.add('active');
        else winInfoDiv.classList.remove('active');
    }
    
    // Основная функция спина
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            showWinMessage("❌ Не хватает монет!", false);
            return;
        }
        spinning = true;
        spinButton.disabled = true;
        // Списание ставки
        balance -= currentBet;
        updateBalanceUI();
        showWinMessage("🌀 Вращение...", false);
        
        // Генерируем случайные финальные символы для каждого барабана
        const finalSymbols = [];
        for (let i = 0; i < 3; i++) {
            const rand = Math.floor(Math.random() * symbolsArray.length);
            finalSymbols.push(symbolsArray[rand]);
        }
        
        // Запуск вращения
        startAllSpinning();
        
        // Поочередная остановка: сначала первый, затем второй, затем третий
        // Для имитации настоящего слота каждый останавливается с небольшой задержкой
        setTimeout(() => {
            stopAllSpinning();
            // Останавливаем первый барабан на финальном символе
            spinReelWithStop(0, finalSymbols[0], 300, () => {
                // Останавливаем второй барабан
                spinReelWithStop(1, finalSymbols[1], 300, () => {
                    // Останавливаем третий барабан
                    spinReelWithStop(2, finalSymbols[2], 300, () => {
                        const { win, bonusTrigger } = calculateWin(finalSymbols, currentBet);
                        if (win > 0) {
                            balance += win;
                            updateBalanceUI();
                            showWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                            if (win > stats.maxWin) stats.maxWin = win;
                            stats.totalWin += win;
                            if (navigator.vibrate) navigator.vibrate(200);
                            if (bonusTrigger) {
                                setTimeout(() => {
                                    alert('🌟 БОНУС АКТИВИРОВАН! 🌟\nСкоро здесь будет мини-игра с большим кушем.');
                                }, 300);
                            }
                        } else {
                            showWinMessage("😢 Проигрыш", false);
                        }
                        stats.games++;
                        saveGameData();
                        updateProfileUI();
                        updateRatingUI();
                        updateWalletUI();
                        spinning = false;
                        spinButton.disabled = false;
                    });
                });
            });
        }, 600);
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    
    // ========== ПРОФИЛЬ, РЕЙТИНГ, КОШЕЛЁК ==========
    function updateProfileUI() {
        const html = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
        document.getElementById('profileInfo').innerHTML = html;
    }
    
    function updateRatingUI() {
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        const html = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingInfo').innerHTML = html;
    }
    
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс:</span><span>${balance}</span></div>`;
    }
    
    // Переключение экранов
    const slotScreen = document.getElementById('slotScreen');
    const profileScreen = document.getElementById('profileScreen');
    const ratingScreen = document.getElementById('ratingScreen');
    const walletScreen = document.getElementById('walletScreen');
    
    function showScreen(screenName) {
        slotScreen.classList.remove('active');
        profileScreen.classList.remove('active');
        ratingScreen.classList.remove('active');
        walletScreen.classList.remove('active');
        if (screenName === 'slot') slotScreen.classList.add('active');
        if (screenName === 'profile') profileScreen.classList.add('active');
        if (screenName === 'rating') ratingScreen.classList.add('active');
        if (screenName === 'wallet') walletScreen.classList.add('active');
        if (screenName === 'profile') updateProfileUI();
        if (screenName === 'rating') updateRatingUI();
        if (screenName === 'wallet') updateWalletUI();
    }
    
    // Обработчики навигации
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const nav = btn.dataset.nav;
            if (nav === 'profile') showScreen('profile');
            if (nav === 'rating') showScreen('rating');
            if (nav === 'wallet') showScreen('wallet');
        });
    });
    document.getElementById('backFromProfile').onclick = () => showScreen('slot');
    document.getElementById('backFromRating').onclick = () => showScreen('slot');
    document.getElementById('backFromWallet').onclick = () => showScreen('slot');
    
    // Кнопки управления игрой
    betDec.onclick = () => changeBet(-5);
    betInc.onclick = () => changeBet(5);
    spinButton.onclick = spin;
    
    // Сброс баланса двойным кликом по логотипу
    let clickTimer = null;
    document.querySelector('.logo').addEventListener('click', () => {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; balance = 1000; updateBalanceUI(); saveGameData(); updateProfileUI(); updateRatingUI(); updateWalletUI(); showWinMessage("💰 Баланс восстановлен", false); }
        else { clickTimer = setTimeout(() => { clickTimer = null; }, 300); }
    });
    
    // Генерация звёзд
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            starsDiv.appendChild(star);
        }
    }
    createStars();
    
    // Полноэкранный режим
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 2000);
    
    // Получение ID
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    // Загрузка данных и инициализация
    loadGameData();
    initReels();
    updateProfileUI();
    updateRatingUI();
    updateWalletUI();
    showScreen('slot');
    forceFullscreen();
</script>
</body>
</html>
