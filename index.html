<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT — финал</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Звездное небо */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: starTwinkle 3s infinite alternate;
        }
        @keyframes starTwinkle {
            0% { opacity: 0.2; transform: scale(1); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px #ffd966; }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.2), rgba(0,0,0,0));
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        /* Приложение фиксированной высоты */
        .app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 20, 0.7);
            backdrop-filter: blur(3px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #d4af37;
            flex-shrink: 0;
        }
        .logo h1 {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            cursor: pointer;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
        }
        .balance-box {
            background: #000000aa;
            border-radius: 60px;
            padding: 5px 18px;
            border: 1px solid #d4af37;
        }
        .balance-box span {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Таблица коэффициентов */
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 8px 16px;
            margin: 8px 20px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }
        .paytable span {
            background: rgba(0,0,0,0.6);
            color: #ffdf80;
            padding: 4px 12px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* Игровой экран */
        .game-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            min-height: 0;
        }
        .slot-frame {
            background: linear-gradient(145deg, #1a1f2e, #0e121c);
            border-radius: 32px;
            padding: 20px 25px;
            border: 2px solid #d4af37;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 550px;
        }
        .reels-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        /* Каждый барабан */
        .reel {
            width: 100px;
            height: 240px;
            background: linear-gradient(145deg, #f0f0f8, #e0e4ec);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 10px 20px black;
            position: relative;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            will-change: transform;
        }
        .reel-symbol {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 54px;
            font-weight: 400;
            text-shadow: 0 2px 3px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.9);
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        /* Золотая линия выигрыша */
        .win-line {
            position: absolute;
            top: 50%;
            left: -8px;
            right: -8px;
            transform: translateY(-50%);
            height: 4px;
            background: linear-gradient(90deg, transparent, #d4af37, #ffd966, #d4af37, transparent);
            box-shadow: 0 0 10px gold;
            border-radius: 2px;
            pointer-events: none;
            transition: 0.2s;
            z-index: 5;
        }
        .win-line.active {
            box-shadow: 0 0 20px gold, 0 0 8px orange;
            background: linear-gradient(90deg, transparent, #ffd700, #fff0b5, #ffd700, transparent);
        }
        .win-message {
            background: rgba(212,175,55,0.15);
            border-radius: 40px;
            padding: 8px 16px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: #ffdf80;
            margin: 10px 20px;
        }
        .win-message.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 12px gold;
        }
        .bet-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 20px;
            margin: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #0c0f18;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
            margin: 10px 20px;
            flex-shrink: 0;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 8px 12px;
            margin: 8px 20px 15px;
            flex-shrink: 0;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 15px;
            border-radius: 60px;
            cursor: pointer;
            color: #ccc;
            background: rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }
        footer {
            text-align: center;
            font-size: 0.55rem;
            color: #5a6380;
            padding: 6px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(145deg, #1a1f2e, #0e121c);
            border-radius: 56px;
            padding: 28px;
            width: 85%;
            max-width: 400px;
            border: 1px solid #d4af37;
        }
        .modal-content h3 {
            color: #ffd966;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
        }
        .close-modal {
            background: none;
            border: 1px solid #d4af37;
            padding: 10px;
            border-radius: 60px;
            color: #d4af37;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        @media (max-width: 550px) {
            .reel { width: 85px; height: 210px; }
            .reel-symbol { height: 70px; font-size: 46px; }
        }
    </style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance-box"><span id="balanceValue">1000</span></div>
    </div>
    <div class="paytable" id="paytable">
        <span>🌟 x50</span> <span>🚀 x5</span> <span>👽 x4</span> <span>🪐 x3</span> <span>🌙 x2</span> <span>⭐ x1.5</span>
    </div>
    <div class="game-screen">
        <div class="slot-frame">
            <div class="reels-container" id="reelsContainer">
                <div class="win-line" id="winLine"></div>
            </div>
        </div>
    </div>
    <div class="win-message" id="winMsg">🌀 Крути барабаны!</div>
    <div class="bet-panel">
        <span>💰 СТАВКА</span>
        <div class="bet-control">
            <button id="betDec">–</button>
            <span class="bet-value" id="betAmount">25</span>
            <button id="betInc">+</button>
        </div>
    </div>
    <button class="spin-btn" id="spinBtn">🔮 SPIN</button>
    <div class="bottom-nav">
        <div class="nav-btn" data-modal="profile">👤 Профиль</div>
        <div class="nav-btn" data-modal="rating">🏆 Рейтинг</div>
        <div class="nav-btn" data-modal="wallet">💰 Кошелёк</div>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>
<div id="profileModal" class="modal"><div class="modal-content"><h3>👤 Профиль</h3><div id="profileInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="ratingModal" class="modal"><div class="modal-content"><h3>🏆 Рейтинг</h3><div id="ratingInfo"></div><button class="close-modal">Закрыть</button></div></div>
<div id="walletModal" class="modal"><div class="modal-content"><h3>💰 Кошелёк</h3><div id="walletInfo"></div><button class="close-modal">Закрыть</button></div></div>

<script>
    // ========== ДАННЫЕ ==========
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let userId = 'cosmic_' + Math.floor(Math.random() * 100000);

    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 };
    
    // DOM
    const balanceSpan = document.getElementById('balanceValue');
    const winMsgSpan = document.getElementById('winMsg');
    const spinButton = document.getElementById('spinBtn');
    const betAmountSpan = document.getElementById('betAmount');
    const reelsContainer = document.getElementById('reelsContainer');
    const winLine = document.getElementById('winLine');

    // Структура барабанов
    let reelStrips = [];      // DOM .reel-strip
    let currentPositions = [0,0,0];
    let animIntervals = [null,null,null];
    const SYMBOL_HEIGHT = 80;  // px
    const VISIBLE_SYMBOLS = 3;
    const EXTRA_SYMBOLS = 20;   // чтобы всегда было много символов

    // ========== ПОСТРОЕНИЕ БАРАБАНОВ ==========
    function createReels() {
        reelsContainer.innerHTML = '';
        reelStrips = [];
        // удаляем старую линию, если есть (оставим только одну)
        const oldLine = document.querySelector('.win-line');
        if (oldLine && oldLine !== winLine) oldLine.remove();
        
        for (let r = 0; r < 3; r++) {
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            // Заполняем ленту 20 символами (повторяем, чтобы не было пустот)
            for (let i = 0; i < EXTRA_SYMBOLS; i++) {
                const sym = symbols[Math.floor(Math.random() * symbols.length)];
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = sym;
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            reelsContainer.appendChild(reelDiv);
            reelStrips.push(stripDiv);
            // Начальная позиция: рандомный сдвиг, чтобы в окне были разные символы
            const randomOffset = -(Math.floor(Math.random() * (EXTRA_SYMBOLS - VISIBLE_SYMBOLS)) * SYMBOL_HEIGHT);
            currentPositions[r] = randomOffset;
            stripDiv.style.transform = `translateY(${randomOffset}px)`;
            stripDiv.style.transition = 'none';
        }
        // Убедимся, что золотая линия есть и она сверху
        if (!winLine.parentNode) reelsContainer.appendChild(winLine);
    }

    // ========== АНИМАЦИЯ ВРАЩЕНИЯ ==========
    function startSpinAnimation() {
        for (let r = 0; r < 3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            const maxOffset = -(EXTRA_SYMBOLS - VISIBLE_SYMBOLS) * SYMBOL_HEIGHT;
            animIntervals[r] = setInterval(() => {
                // двигаем вниз на 8px за тик (быстро)
                currentPositions[r] += 8;
                if (currentPositions[r] > 0) currentPositions[r] = maxOffset;
                reelStrips[r].style.transform = `translateY(${currentPositions[r]}px)`;
                reelStrips[r].style.transition = 'none';
            }, 20); // 20 мс — очень быстро
        }
    }

    // ========== ОСТАНОВКА ОДНОГО БАРАБАНА ==========
    function stopReel(reelIdx, targetCenterSymbol, withJump = false) {
        return new Promise((resolve) => {
            if (animIntervals[reelIdx]) clearInterval(animIntervals[reelIdx]);
            const strip = reelStrips[reelIdx];
            const children = Array.from(strip.children);
            // Находим индекс символа, который должен оказаться в центре (второй видимый)
            let targetIndex = children.findIndex(ch => ch.innerText === targetCenterSymbol);
            if (targetIndex === -1) targetIndex = Math.floor(children.length / 2); // fallback
            // Смещение, чтобы этот символ был на позиции 1 (центр)
            const targetOffset = -(targetIndex - 1) * SYMBOL_HEIGHT;
            // Плавная остановка
            strip.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
            strip.style.transform = `translateY(${targetOffset}px)`;
            currentPositions[reelIdx] = targetOffset;
            
            if (withJump) {
                // Эффект «торможения с перескоком»: дергаем вниз, потом обратно
                setTimeout(() => {
                    strip.style.transition = 'transform 0.07s linear';
                    strip.style.transform = `translateY(${targetOffset + 12}px)`;
                    setTimeout(() => {
                        strip.style.transition = 'transform 0.15s ease-out';
                        strip.style.transform = `translateY(${targetOffset}px)`;
                        setTimeout(resolve, 180);
                    }, 70);
                }, 120);
            } else {
                setTimeout(resolve, 260);
            }
        });
    }

    // ========== ПООЧЕРЕДНАЯ ОСТАНОВКА ==========
    async function stopAllReels(finalSymbols) {
        await stopReel(0, finalSymbols[0], false);
        await new Promise(r => setTimeout(r, 400));
        await stopReel(1, finalSymbols[1], false);
        await new Promise(r => setTimeout(r, 400));
        await stopReel(2, finalSymbols[2], true);
    }

    // ========== ВЫИГРЫШ ==========
    function calculateWin(centerSymbols, bet) {
        const counts = {};
        for (let s of centerSymbols) counts[s] = (counts[s] || 0) + 1;
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                let mult = multipliers[sym] || 1;
                return { win: bet * mult, bonus: sym === '🌠' };
            }
        }
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 2) return { win: Math.floor(bet * 1.2), bonus: false };
        }
        return { win: 0, bonus: false };
    }

    // ========== ОСНОВНОЙ СПИН ==========
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            winMsgSpan.innerText = '❌ Не хватает монет!';
            winMsgSpan.classList.add('active');
            setTimeout(() => winMsgSpan.classList.remove('active'), 1200);
            return;
        }
        spinning = true;
        spinButton.disabled = true;
        winLine.classList.remove('active');
        
        balance -= currentBet;
        updateBalanceUI();
        winMsgSpan.innerText = '🌀 Крутим...';
        winMsgSpan.classList.remove('active');
        
        startSpinAnimation();
        
        // Генерируем финальные символы для центральной линии
        const finalCenter = [];
        for (let i = 0; i < 3; i++) finalCenter.push(symbols[Math.floor(Math.random() * symbols.length)]);
        
        await new Promise(r => setTimeout(r, 800)); // крутим 0.8 сек
        
        await stopAllReels(finalCenter);
        
        const { win, bonus } = calculateWin(finalCenter, currentBet);
        if (win > 0) {
            balance += win;
            updateBalanceUI();
            winMsgSpan.innerText = `✨ ВЫИГРЫШ: ${win} ✨`;
            winMsgSpan.classList.add('active');
            winLine.classList.add('active');
            if (win > stats.maxWin) stats.maxWin = win;
            stats.totalWin += win;
            if (navigator.vibrate) navigator.vibrate(200);
            if (bonus) setTimeout(() => alert('🌟 БОНУС! Скоро будет мини-игра.'), 300);
        } else {
            winMsgSpan.innerText = '😢 Проигрыш';
            winMsgSpan.classList.remove('active');
        }
        stats.games++;
        saveToLocal();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
        
        spinning = false;
        spinButton.disabled = false;
        setTimeout(() => {
            if (!spinning) {
                winMsgSpan.innerText = '🌀 Крути барабаны!';
                winMsgSpan.classList.remove('active');
                winLine.classList.remove('active');
            }
        }, 2000);
    }

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function updateBalanceUI() { balanceSpan.innerText = balance; }
    function saveToLocal() {
        localStorage.setItem('feries_balance', balance);
        localStorage.setItem('feries_stats', JSON.stringify(stats));
    }
    function loadFromLocal() {
        const b = localStorage.getItem('feries_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('feries_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
        updateProfileUI();
        updateRatingUI();
        updateWalletUI();
    }
    function updateProfileUI() {
        document.getElementById('profileInfo').innerHTML = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
    }
    function updateRatingUI() {
        const top = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        top.sort((a,b)=>b.score - a.score);
        document.getElementById('ratingInfo').innerHTML = top.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс</span><span>${balance}</span></div>`;
    }
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    function showModal(id) { document.getElementById(id).classList.add('active'); }
    function hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
    
    // Сброс баланса по двойному клику на логотип
    let logoClickTimer = null;
    document.querySelector('.logo').addEventListener('click', () => {
        if (logoClickTimer) {
            clearTimeout(logoClickTimer);
            logoClickTimer = null;
            balance = 1000;
            updateBalanceUI();
            saveToLocal();
            updateProfileUI();
            updateRatingUI();
            winMsgSpan.innerText = '💰 Баланс восстановлен';
            setTimeout(() => { if (!spinning) winMsgSpan.innerText = '🌀 Крути барабаны!'; }, 1500);
        } else {
            logoClickTimer = setTimeout(() => { logoClickTimer = null; }, 300);
        }
    });

    // ========== ЗВЁЗДЫ ==========
    function generateStars() {
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 4 + 2 + 's';
            container.appendChild(star);
        }
    }
    generateStars();

    // ========== ПОЛНОЭКРАННЫЙ РЕЖИМ TELEGRAM ==========
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 1000);

    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function init() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
            userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
        }
        createReels();
        loadFromLocal();
        document.getElementById('betDec').addEventListener('click', () => changeBet(-5));
        document.getElementById('betInc').addEventListener('click', () => changeBet(5));
        spinButton.addEventListener('click', spin);
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => showModal(btn.dataset.modal + 'Modal'));
        });
        document.querySelectorAll('.close-modal').forEach(btn => btn.addEventListener('click', hideModals));
    }
    init();
</script>
</body>
</html>
