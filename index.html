<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Космический фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: starGlow 2s infinite alternate;
        }
        @keyframes starGlow {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), transparent);
            filter: blur(40px);
            pointer-events: none;
        }
        /* Приложение */
        .app {
            position: relative;
            z-index: 1;
            max-width: 580px;
            width: 100%;
            margin: 20px auto;
            background: rgba(8, 10, 20, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 56px;
            padding: 20px;
            border: 1px solid rgba(212,175,55,0.5);
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #d4af37;
        }
        .logo h1 {
            font-size: 1.9rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.55rem;
            color: #d4af37;
            letter-spacing: 2px;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 8px 20px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd966;
        }
        /* Экран слотов */
        .slot-screen {
            background: linear-gradient(145deg, #151c2a, #0a0e16);
            border-radius: 48px;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 8px 20px black;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .reel {
            background: #0b0f18;
            border-radius: 28px;
            width: 100px;
            height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.4), 0 10px 20px black;
            overflow: hidden;
            position: relative;
        }
        .reel-inner {
            transition: transform 0.05s linear;
            width: 100%;
            text-align: center;
        }
        .reel-symbol {
            font-size: 64px;
            line-height: 1.4;
            display: block;
            text-align: center;
            filter: drop-shadow(0 2px 4px black);
        }
        /* Информация о выигрыше и множители */
        .multipliers {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            font-size: 0.8rem;
            color: #ffdf80;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 60px;
            flex-wrap: wrap;
        }
        .multipliers span {
            background: #1a212f;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            transition: 0.1s;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin: 15px 0;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 8px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #6b4e1a;
        }
        /* Нижняя навигация */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 10px;
        }
        .nav-btn {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 60px;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            border: 1px solid #d4af37;
            color: #ccc;
            flex: 1;
            transition: 0.1s;
        }
        .nav-btn.active {
            background: #d4af37;
            color: #0a0f1e;
        }
        /* Страницы профиля, рейтинга, кошелька */
        .page-card {
            background: rgba(0,0,0,0.65);
            border-radius: 48px;
            padding: 28px;
            margin: 20px 0;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffdf80;
            font-size: 1rem;
        }
        .back-btn {
            background: none;
            border: 1px solid #d4af37;
            padding: 12px;
            border-radius: 40px;
            color: #d4af37;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            margin-top: 15px;
        }
        @media (max-width: 500px) {
            .reel { width: 85px; height: 120px; }
            .reel-symbol { font-size: 52px; }
            .logo h1 { font-size: 1.4rem; }
        }
        /* Вспомогательные классы для скрытия экранов */
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- Основной игровой экран (виден всегда, остальные экраны переключаются через модальные страницы) -->
    <div class="screen active" id="gameScreen">
        <div class="slot-screen">
            <div class="reels" id="reelsContainer">
                <div class="reel"><div class="reel-inner"><div class="reel-symbol">🪐</div></div></div>
                <div class="reel"><div class="reel-inner"><div class="reel-symbol">🪐</div></div></div>
                <div class="reel"><div class="reel-inner"><div class="reel-symbol">🪐</div></div></div>
            </div>
            <div class="multipliers" id="multipliersBar"></div>
            <div class="win-area" id="winMessage">🎰 Крути барабаны!</div>
            <div class="bet-panel">
                <span>💰 СТАВКА</span>
                <div class="bet-control">
                    <button id="betDec">–</button>
                    <span class="bet-value" id="betAmount">25</span>
                    <button id="betInc">+</button>
                </div>
            </div>
            <button class="spin-btn" id="spinButton">🔮 SPIN</button>
        </div>
        <div class="bottom-nav">
            <div class="nav-btn" data-page="profile">👤 Профиль</div>
            <div class="nav-btn" data-page="rating">🏆 Рейтинг</div>
            <div class="nav-btn" data-page="wallet">💰 Кошелёк</div>
        </div>
        <footer>Ваши данные под защитой галактики</footer>
    </div>

    <!-- Страница профиля -->
    <div class="screen" id="profileScreen">
        <div class="page-card" id="profileInfo"></div>
        <button class="back-btn" id="backToGame">← Назад в игру</button>
    </div>

    <!-- Страница рейтинга -->
    <div class="screen" id="ratingScreen">
        <div class="page-card" id="ratingInfo"></div>
        <button class="back-btn" id="backToGameRating">← Назад в игру</button>
    </div>

    <!-- Страница кошелька -->
    <div class="screen" id="walletScreen">
        <div class="page-card" id="walletInfo"></div>
        <button class="back-btn" id="backToGameWallet">← Назад в игру</button>
    </div>
</div>

<script>
    // ========== ГЛОБАЛЬНЫЕ ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    let currentTheme = 'cosmic';
    
    // Конфигурация темы (символы и множители)
    const themes = {
        cosmic: {
            symbols: ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'],
            multipliers: { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 },
            paytable: '🌠 x50 | 🚀 x5 | 👽 x4 | 🪐 x3 | 🌙 x2 | ⭐ x1.5'
        }
    };
    
    // DOM элементы
    const balanceSpan = document.getElementById('balanceValue');
    const winDiv = document.getElementById('winMessage');
    const spinBtn = document.getElementById('spinButton');
    const betDec = document.getElementById('betDec');
    const betInc = document.getElementById('betInc');
    const betAmountSpan = document.getElementById('betAmount');
    const reelsContainers = document.querySelectorAll('#reelsContainer .reel-inner');
    const multipliersBar = document.getElementById('multipliersBar');
    
    // Показываем множители
    multipliersBar.innerHTML = themes.cosmic.paytable.split('|').map(m => `<span>${m.trim()}</span>`).join('');
    
    // Функции сохранения
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        const b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        const s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        updateBalanceUI();
    }
    function updateBalanceUI() {
        balanceSpan.innerText = balance;
    }
    function updateProfileUI() {
        document.getElementById('profileInfo').innerHTML = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
    }
    function updateRatingUI() {
        const demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        document.getElementById('ratingInfo').innerHTML = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
    }
    function updateWalletUI() {
        document.getElementById('walletInfo').innerHTML = `<div class="stat-row"><span>💰 Баланс:</span><span>${balance}</span></div>`;
    }
    function resetBalance() {
        balance = 1000;
        updateBalanceUI();
        saveGameData();
        updateProfileUI();
        updateRatingUI();
        winDiv.innerHTML = '💰 Баланс восстановлен';
    }
    
    // Логика выигрыша
    function calculateWin(symbols, bet) {
        const counts = {};
        for (let s of symbols) counts[s] = (counts[s] || 0) + 1;
        let win = 0;
        let bonus = false;
        for (let [sym, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                let mult = themes.cosmic.multipliers[sym] || 1;
                win = bet * mult;
                if (sym === '🌠') bonus = true;
                break;
            }
        }
        if (win === 0) {
            for (let [sym, cnt] of Object.entries(counts)) {
                if (cnt === 2) {
                    win = Math.floor(bet * 1.2);
                    break;
                }
            }
        }
        return { win, bonus };
    }
    
    function setWinMessage(text, isWin = false) {
        winDiv.innerHTML = text;
        if (isWin) winDiv.classList.add('active');
        else winDiv.classList.remove('active');
    }
    
    // ========== БЫСТРАЯ ВЕРТИКАЛЬНАЯ АНИМАЦИЯ С ПООЧЕРЕДНОЙ ОСТАНОВКОЙ ==========
    let spinInterval = null;
    let currentSpinSymbols = [];
    
    function startQuickSpin() {
        const syms = themes.cosmic.symbols;
        // Запускаем очень быструю смену символов (каждые 30 мс)
        spinInterval = setInterval(() => {
            for (let i = 0; i < reelsContainers.length; i++) {
                const randomSym = syms[Math.floor(Math.random() * syms.length)];
                reelsContainers[i].innerHTML = `<div class="reel-symbol">${randomSym}</div>`;
            }
        }, 30);
    }
    
    function stopReelsSequentially(callback) {
        const syms = themes.cosmic.symbols;
        const finalSymbols = new Array(3);
        const delays = [500, 850, 1200]; // быстрая последовательная остановка
        for (let i = 0; i < 3; i++) {
            setTimeout((idx) => {
                const finalSym = syms[Math.floor(Math.random() * syms.length)];
                reelsContainers[idx].innerHTML = `<div class="reel-symbol">${finalSym}</div>`;
                finalSymbols[idx] = finalSym;
                if (idx === 2) {
                    clearInterval(spinInterval);
                    callback(finalSymbols);
                }
            }, delays[i], i);
        }
    }
    
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            setWinMessage("❌ Не хватает монет!");
            return;
        }
        spinning = true;
        spinBtn.disabled = true;
        balance -= currentBet;
        updateBalanceUI();
        setWinMessage("🌀 Крутим...", false);
        
        startQuickSpin();
        
        stopReelsSequentially((finalSymbols) => {
            const { win, bonus } = calculateWin(finalSymbols, currentBet);
            if (win > 0) {
                balance += win;
                updateBalanceUI();
                setWinMessage(`✨ ВЫИГРЫШ: ${win} ✨`, true);
                if (win > stats.maxWin) stats.maxWin = win;
                stats.totalWin += win;
                if (navigator.vibrate) navigator.vibrate(200);
                if (bonus) {
                    setTimeout(() => alert('🌟 БОНУС! Активирована секретная игра 🌟'), 200);
                }
            } else {
                setWinMessage("😢 Проигрыш", false);
            }
            stats.games++;
            updateProfileUI();
            saveGameData();
            updateRatingUI();
            updateWalletUI();
            spinning = false;
            spinBtn.disabled = false;
        });
    }
    
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            betAmountSpan.innerText = currentBet;
        }
    }
    
    // ========== ПЕРЕКЛЮЧЕНИЕ МЕЖДУ ЭКРАНАМИ ==========
    const gameScreen = document.getElementById('gameScreen');
    const profileScreen = document.getElementById('profileScreen');
    const ratingScreen = document.getElementById('ratingScreen');
    const walletScreen = document.getElementById('walletScreen');
    const backBtns = document.querySelectorAll('.back-btn');
    
    function showGame() {
        gameScreen.classList.add('active');
        profileScreen.classList.remove('active');
        ratingScreen.classList.remove('active');
        walletScreen.classList.remove('active');
    }
    function showProfile() {
        gameScreen.classList.remove('active');
        profileScreen.classList.add('active');
        updateProfileUI();
    }
    function showRating() {
        gameScreen.classList.remove('active');
        ratingScreen.classList.add('active');
        updateRatingUI();
    }
    function showWallet() {
        gameScreen.classList.remove('active');
        walletScreen.classList.add('active');
        updateWalletUI();
    }
    
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const page = btn.dataset.page;
            if (page === 'profile') showProfile();
            if (page === 'rating') showRating();
            if (page === 'wallet') showWallet();
        });
    });
    backBtns.forEach(btn => btn.addEventListener('click', showGame));
    
    // Сброс баланса двойным кликом по логотипу
    let clickTimer = null;
    document.querySelector('.logo').addEventListener('click', () => {
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; resetBalance(); }
        else { clickTimer = setTimeout(() => { clickTimer = null; }, 300); }
    });
    
    // ========== ПОЛНОЭКРАННЫЙ РЕЖИМ TELEGRAM ==========
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
            setTimeout(() => window.Telegram.WebApp.expand(), 600);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 1500);
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    // Инициализация
    loadGameData();
    updateProfileUI();
    updateRatingUI();
    updateWalletUI();
    betDec.onclick = () => changeBet(-5);
    betInc.onclick = () => changeBet(5);
    spinBtn.onclick = spin;
    showGame();
    forceFullscreen();
</script>
</body>
</html>
