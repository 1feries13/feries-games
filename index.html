<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FERIES COSMIC SLOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f2a, #02040c);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Звёзды */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(120,80,200,0.25), rgba(0,0,0,0));
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
        }

        /* Основное приложение */
        .app {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            background: rgba(8, 10, 20, 0.6);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
        }

        /* Шапка: бургер и баланс */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .burger {
            width: 32px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .burger span {
            display: block;
            height: 3px;
            background: #d4af37;
            border-radius: 3px;
        }
        .logo h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f9e6b3, #d4af37);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.5rem;
            color: #d4af37;
            text-align: center;
        }
        .balance {
            background: #000000aa;
            border-radius: 60px;
            padding: 6px 16px;
            border: 1px solid #d4af37;
        }
        .balance span {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd966;
        }

        /* Контейнер слотов */
        .slot-container {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .paytable {
            background: rgba(0,0,0,0.5);
            border-radius: 60px;
            padding: 10px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .paytable span {
            color: #ffdf80;
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        /* Экран с белым фоном под слотами */
        .reels-wrapper {
            background: #ffffffdd;
            border-radius: 48px;
            padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .reels {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }
        /* Золотая центральная линия (рамка вокруг выигрышной строки) */
        .reels::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 90px;
            transform: translateY(-50%);
            border: 2px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(212,175,55,0.8);
            pointer-events: none;
            z-index: 2;
        }
        .reel {
            width: 100px;
            height: 270px;
            overflow: hidden;
            background: #0b0f18;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px rgba(212,175,55,0.3), 0 0 0 1px rgba(255,255,255,0.2);
            position: relative;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }
        .reel-symbol {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background: #0b0f18;
            color: white;
            text-shadow: 0 0 4px gold;
        }
        .win-area {
            background: rgba(212,175,55,0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            margin: 20px 0 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd966;
        }
        .win-area.active {
            background: rgba(212,175,55,0.7);
            color: #0a0f1e;
            box-shadow: 0 0 15px gold;
        }
        .bet-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b101ccc;
            border-radius: 60px;
            padding: 8px 20px;
            margin-bottom: 15px;
        }
        .bet-control {
            display: flex;
            gap: 20px;
            background: #1a212f;
            padding: 4px 20px;
            border-radius: 60px;
        }
        .bet-control button {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #ffd966;
            cursor: pointer;
            width: 40px;
        }
        .bet-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
        }
        .spin-btn {
            background: linear-gradient(145deg, #f3d776, #c49b2c);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0 #6b4e1a;
            transition: 0.05s linear;
        }
        .spin-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #6b4e1a;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #5a6380;
            padding: 15px;
        }

        /* Боковое меню (бургер) */
        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: #0b0e18;
            border-right: 1px solid #d4af37;
            z-index: 1000;
            transition: left 0.3s;
            padding: 80px 20px;
        }
        .side-menu.open {
            left: 0;
        }
        .side-menu .menu-item {
            padding: 14px 0;
            font-size: 1.2rem;
            color: #ffdf80;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            cursor: pointer;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }

        /* Страницы (отдельные экраны) */
        .page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8,10,20,0.95);
            z-index: 1100;
            display: none;
            flex-direction: column;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }
        .page.active {
            display: flex;
        }
        .page .close-page {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #d4af37;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .page-card {
            background: #1a1f2e;
            border-radius: 48px;
            padding: 28px;
            margin-top: 20px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #d4af37;
            color: #ffdf80;
        }
        .back-to-game {
            margin-top: 30px;
            background: #d4af37;
            border: none;
            padding: 12px;
            border-radius: 60px;
            color: #0a0f1e;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="app">
    <div class="header">
        <div class="burger" id="burgerBtn"><span></span><span></span><span></span></div>
        <div class="logo"><h1>FERIES</h1><p>COSMIC SLOT</p></div>
        <div class="balance"><span id="balanceValue">1000</span></div>
    </div>

    <!-- Основной игровой контент -->
    <div class="slot-container">
        <div class="paytable" id="paytable"></div>
        <div class="reels-wrapper">
            <div class="reels" id="reelsContainer"></div>
        </div>
        <div class="win-area" id="winMessage">🌀 Крути барабаны!</div>
        <div class="bet-panel">
            <span>💰 СТАВКА</span>
            <div class="bet-control">
                <button id="betDec">–</button>
                <span class="bet-value" id="betAmount">25</span>
                <button id="betInc">+</button>
            </div>
        </div>
        <button class="spin-btn" id="spinButton">🔮 SPIN</button>
    </div>
    <footer>Ваши данные под защитой галактики</footer>
</div>

<!-- Боковое меню -->
<div class="side-menu" id="sideMenu">
    <div class="menu-item" data-page="profile">👤 Профиль</div>
    <div class="menu-item" data-page="rating">🏆 Рейтинг</div>
    <div class="menu-item" data-page="wallet">💰 Кошелёк</div>
</div>
<div class="overlay" id="overlay"></div>

<!-- Страницы -->
<div id="profilePage" class="page">
    <button class="close-page">✕</button>
    <div class="page-card" id="profileContent"></div>
    <button class="back-to-game" data-close>← Вернуться в игру</button>
</div>
<div id="ratingPage" class="page">
    <button class="close-page">✕</button>
    <div class="page-card" id="ratingContent"></div>
    <button class="back-to-game" data-close>← Вернуться в игру</button>
</div>
<div id="walletPage" class="page">
    <button class="close-page">✕</button>
    <div class="page-card" id="walletContent"></div>
    <button class="back-to-game" data-close>← Вернуться в игру</button>
</div>

<script>
    // ========== ДАННЫЕ ==========
    let userId = 'cosmic_' + Math.floor(Math.random()*100000);
    let balance = 1000;
    let currentBet = 25;
    let spinning = false;
    let stats = { games: 0, maxWin: 0, totalWin: 0 };
    
    const symbols = ['🪐', '🚀', '🌙', '⭐', '👽', '🌠'];
    const multipliers = { '🌠': 50, '🚀': 5, '👽': 4, '🪐': 3, '🌙': 2, '⭐': 1.5 };
    
    // Состояние барабанов
    let reelStrips = [];
    let reelData = [];
    let animIntervals = [];
    let currentPositions = [];
    
    // ========== СОХРАНЕНИЕ ==========
    function saveGameData() {
        localStorage.setItem('cosmic_balance', balance);
        localStorage.setItem('cosmic_stats', JSON.stringify(stats));
    }
    function loadGameData() {
        let b = localStorage.getItem('cosmic_balance');
        if (b && !isNaN(parseInt(b))) balance = parseInt(b);
        let s = localStorage.getItem('cosmic_stats');
        if (s) try { stats = JSON.parse(s); } catch(e) {}
        document.getElementById('balanceValue').innerText = balance;
    }
    function updateProfile() {
        document.getElementById('profileContent').innerHTML = `
            <div class="stat-row"><span>⭐ Игр сыграно:</span><span>${stats.games}</span></div>
            <div class="stat-row"><span>🏆 Макс. выигрыш:</span><span>${stats.maxWin}</span></div>
            <div class="stat-row"><span>📈 Общий выигрыш:</span><span>${stats.totalWin}</span></div>
            <div class="stat-row"><span>🆔 ID:</span><span>${userId}</span></div>
        `;
    }
    function updateRating() {
        let demo = [
            { name: '🐫 Pharaoh', score: 15400 },
            { name: '🚀 Astronaut', score: 12900 },
            { name: '₿ Satoshi', score: 11200 },
            { name: userId.slice(0,10), score: balance }
        ];
        demo.sort((a,b)=>b.score - a.score);
        let html = demo.map(p => `<div class="stat-row"><span>${p.name}</span><span>💰 ${p.score}</span></div>`).join('');
        document.getElementById('ratingContent').innerHTML = html;
    }
    function updateWallet() {
        document.getElementById('walletContent').innerHTML = `<div class="stat-row"><span>💰 Твой баланс:</span><span>${balance}</span></div>`;
    }
    
    // ========== ЛОГИКА ВЫИГРЫША ==========
    function calcWin(symArr, bet) {
        let counts = {};
        for (let s of symArr) counts[s] = (counts[s] || 0) + 1;
        let win = 0, bonus = false;
        for (let [s, cnt] of Object.entries(counts)) {
            if (cnt === 3) {
                let mult = multipliers[s] || 1;
                win = bet * mult;
                if (s === '🌠') bonus = true;
                break;
            }
        }
        if (win === 0) {
            for (let cnt of Object.values(counts)) {
                if (cnt === 2) { win = Math.floor(bet * 1.2); break; }
            }
        }
        return { win, bonus };
    }
    
    // ========== ПОСТРОЕНИЕ БАРАБАНОВ (вертикальные ленты) ==========
    function buildReels() {
        const container = document.getElementById('reelsContainer');
        container.innerHTML = '';
        reelStrips = [];
        reelData = [];
        const stripLength = 12; // 12 символов в ленте
        for (let r=0; r<3; r++) {
            // Генерируем случайную последовательность
            let strip = [];
            for (let i=0; i<stripLength; i++) {
                strip.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
            reelData.push({ symbols: strip, symbolHeight: 90, totalHeight: 0, currentPos: 0 });
            
            const reelDiv = document.createElement('div');
            reelDiv.className = 'reel';
            const stripDiv = document.createElement('div');
            stripDiv.className = 'reel-strip';
            for (let s of strip) {
                const symDiv = document.createElement('div');
                symDiv.className = 'reel-symbol';
                symDiv.innerText = s;
                stripDiv.appendChild(symDiv);
            }
            reelDiv.appendChild(stripDiv);
            container.appendChild(reelDiv);
            reelStrips.push(stripDiv);
        }
        // После рендера узнаем реальную высоту ленты и устанавливаем начальное смещение (рандомное)
        setTimeout(() => {
            for (let r=0; r<3; r++) {
                const strip = reelStrips[r];
                const totalH = strip.offsetHeight;
                reelData[r].totalHeight = totalH;
                const startOffset = -(Math.floor(Math.random() * (reelData[r].symbols.length - 3)) * 90);
                currentPositions[r] = startOffset;
                strip.style.transform = `translateY(${startOffset}px)`;
            }
        }, 10);
    }
    
    // Анимация вращения (быстрая смена позиции)
    function startSpin() {
        for (let r=0; r<3; r++) {
            if (animIntervals[r]) clearInterval(animIntervals[r]);
            animIntervals[r] = setInterval(() => {
                if (!reelStrips[r]) return;
                let newPos = currentPositions[r] + 30; // шаг прокрутки
                if (newPos >= 0) newPos = -reelData[r].totalHeight + 90;
                currentPositions[r] = newPos;
                reelStrips[r].style.transform = `translateY(${newPos}px)`;
            }, 30);
        }
    }
    
    // Остановка конкретного барабана с фиксацией символа в центре
    function stopReel(reelIndex, targetSymbol, callback) {
        if (animIntervals[reelIndex]) clearInterval(animIntervals[reelIndex]);
        const strip = reelStrips[reelIndex];
        const data = reelData[reelIndex];
        // Находим индекс целевого символа в ленте (первое вхождение)
        let targetIdx = data.symbols.indexOf(targetSymbol);
        if (targetIdx === -1) targetIdx = 0;
        // Смещение, чтобы этот символ оказался в центре (высота символа 90, центр около 90*1.5 = 135? но у нас видимая область 270, центральная ячейка 90-180)
        const desiredOffset = -(targetIdx * 90) + 90; // +90 чтобы сместить в центр
        // Плавно перемещаем
        strip.style.transition = 'transform 0.2s ease-out';
        currentPositions[reelIndex] = desiredOffset;
        strip.style.transform = `translateY(${desiredOffset}px)`;
        setTimeout(() => {
            strip.style.transition = '';
            if (callback) callback();
        }, 220);
    }
    
    // Главный спин
    async function spin() {
        if (spinning) return;
        if (balance < currentBet) {
            document.getElementById('winMessage').innerHTML = '❌ Не хватает монет!';
            return;
        }
        spinning = true;
        const spinBtn = document.getElementById('spinButton');
        spinBtn.disabled = true;
        balance -= currentBet;
        document.getElementById('balanceValue').innerText = balance;
        document.getElementById('winMessage').innerHTML = '🌀 Крутим...';
        document.getElementById('winMessage').classList.remove('active');
        
        startSpin();
        
        // Генерируем случайные финальные символы (честно)
        const finalSymbols = [];
        for (let i=0; i<3; i++) {
            finalSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
        }
        
        // Остановка барабанов с задержками: левый (800), средний (1050), правый (1300)
        setTimeout(() => stopReel(0, finalSymbols[0]), 800);
        setTimeout(() => stopReel(1, finalSymbols[1]), 1050);
        setTimeout(() => stopReel(2, finalSymbols[2], () => {
            // После остановки всех трёх
            const { win, bonus } = calcWin(finalSymbols, currentBet);
            if (win > 0) {
                balance += win;
                document.getElementById('balanceValue').innerText = balance;
                document.getElementById('winMessage').innerHTML = `✨ ВЫИГРЫШ: ${win} ✨`;
                document.getElementById('winMessage').classList.add('active');
                if (win > stats.maxWin) stats.maxWin = win;
                stats.totalWin += win;
                if (navigator.vibrate) navigator.vibrate(200);
                if (bonus) {
                    setTimeout(() => alert('🌟 БОНУС! 🌟\nСекретная игра активирована!'), 300);
                }
            } else {
                document.getElementById('winMessage').innerHTML = '😢 Проигрыш';
            }
            stats.games++;
            saveGameData();
            updateProfile();
            updateRating();
            updateWallet();
            spinning = false;
            spinBtn.disabled = false;
            setTimeout(() => {
                if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!';
            }, 2000);
        }), 1300);
    }
    
    // Изменение ставки
    function changeBet(delta) {
        let newBet = currentBet + delta;
        if (newBet >= 5 && newBet <= 500) {
            currentBet = newBet;
            document.getElementById('betAmount').innerText = currentBet;
        }
    }
    
    // ========== НАВИГАЦИЯ (бургер-меню и страницы) ==========
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if (pageId === 'profilePage') updateProfile();
        if (pageId === 'ratingPage') updateRating();
        if (pageId === 'walletPage') updateWallet();
    }
    function hidePages() {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    }
    
    const burger = document.getElementById('burgerBtn');
    const sideMenu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    function closeMenu() {
        sideMenu.classList.remove('open');
        overlay.classList.remove('active');
    }
    burger.onclick = () => {
        sideMenu.classList.toggle('open');
        overlay.classList.toggle('active');
    };
    overlay.onclick = closeMenu;
    document.querySelectorAll('.menu-item').forEach(item => {
        item.onclick = () => {
            const page = item.dataset.page;
            if (page === 'profile') showPage('profilePage');
            if (page === 'rating') showPage('ratingPage');
            if (page === 'wallet') showPage('walletPage');
            closeMenu();
        };
    });
    // Кнопки закрытия страниц
    document.querySelectorAll('.close-page, .back-to-game').forEach(btn => {
        btn.onclick = () => hidePages();
    });
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    function init() {
        loadGameData();
        buildReels();
        // Таблица коэффициентов
        const payDiv = document.getElementById('paytable');
        payDiv.innerHTML = '<span>🌠 x50</span><span>🚀 x5</span><span>👽 x4</span><span>🪐 x3</span><span>🌙 x2</span><span>⭐ x1.5</span>';
        document.getElementById('betDec').onclick = () => changeBet(-5);
        document.getElementById('betInc').onclick = () => changeBet(5);
        document.getElementById('spinButton').onclick = spin;
        updateProfile();
        updateRating();
        updateWallet();
        
        // Сброс баланса по двойному клику на логотип
        let clickTimer = null;
        document.querySelector('.logo').addEventListener('click', () => {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
                balance = 1000;
                document.getElementById('balanceValue').innerText = balance;
                saveGameData();
                updateProfile();
                updateRating();
                updateWallet();
                document.getElementById('winMessage').innerHTML = '💰 Баланс 1000';
                setTimeout(() => { if (!spinning) document.getElementById('winMessage').innerHTML = '🌀 Крути барабаны!'; }, 1500);
            } else {
                clickTimer = setTimeout(() => clickTimer = null, 300);
            }
        });
    }
    
    // Звёзды
    function createStars() {
        const starsDiv = document.getElementById('stars');
        for (let i=0; i<200; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            let sz = Math.random()*3+1;
            s.style.width = sz+'px';
            s.style.height = sz+'px';
            s.style.left = Math.random()*100+'%';
            s.style.top = Math.random()*100+'%';
            s.style.animationDelay = Math.random()*5+'s';
            s.style.animationDuration = Math.random()*4+2+'s';
            starsDiv.appendChild(s);
        }
    }
    createStars();
    
    // Полноэкранный режим Telegram
    function forceFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            setTimeout(() => window.Telegram.WebApp.expand(), 200);
        }
    }
    forceFullscreen();
    setInterval(forceFullscreen, 1500);
    
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
        userId = String(window.Telegram.WebApp.initDataUnsafe.user.id);
    }
    
    init();
</script>
</body>
</html>
